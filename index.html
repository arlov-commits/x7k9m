function editCatName(el,oldName){el.setAttribute('draggable','false');const count=el.textContent.match(/\((\d+)\)/)?.[1]||'';const inp=document.createElement('input');inp.type='text';inp.value=oldName;inp.className='life-input';inp.style.cssText='font-size:var(--fs-2xs);font-weight:700;text-transform:uppercase;width:120px;padding:2px 6px;';el.innerHTML='';el.appendChild(inp);inp.focus();inp.select();function save(){const nv=inp.value.trim();if(nv&&nv!==oldName){state.lifeTasks.forEach(t=>{if(t.category===oldName)t.category=nv});const sel=$('#lifeNewCat');if(sel){const opts=Array.from(sel.options);const has=opts.some(o=>o.value===nv);if(!has){const o=document.createElement('option');o.value=nv;o.textContent=nv;sel.appendChild(o)}}}render();scheduleSave()}inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();save()}else if(e.key==='Escape')render()});inp.addEventListener('blur',save)}

// ===== TASKS TAB DRAG =====
let lifeDragId=null,lifeDragCat=null,dragCatName=null;
function lifeItemDragStart(e,id,cat){lifeDragId=id;lifeDragCat=cat;dragCatName=null;e.dataTransfer.effectAllowed='move';e.currentTarget.classList.add('dragging')}
function lifeItemDragOver(e){e.preventDefault();if(dragCatName)return;e.currentTarget.classList.add('drag-over-item')}
function lifeItemDragLeave(e){e.currentTarget.classList.remove('drag-over-item')}
function lifeItemDrop(e,targetId,targetCat){e.preventDefault();e.currentTarget.classList.remove('drag-over-item');if(lifeDragId===null||lifeDragId===targetId)return;const t=state.lifeTasks.find(t=>t.id===lifeDragId);if(!t)return;if(targetCat&&targetCat!==t.category)t.category=targetCat;const arr=state.lifeTasks;const fromIdx=arr.findIndex(x=>x.id===lifeDragId);const toIdx=arr.findIndex(x=>x.id===targetId);const[item]=arr.splice(fromIdx,1);arr.splice(toIdx,0,item);lifeDragId=null;render();scheduleSave()}
function lifeCatDragStart(e,cat){dragCatName=cat;lifeDragId=null;e.dataTransfer.setData('text/plain','cat:'+cat);e.dataTransfer.effectAllowed='move'}
function lifeCatDragOver(e){e.preventDefault();e.currentTarget.classList.add('drag-over')}
function lifeCatDragLeave(e){e.currentTarget.classList.remove('drag-over')}
function lifeCatDrop(e,targetCat){e.preventDefault();e.currentTarget.classList.remove('drag-over');if(lifeDragId!==null){const t=state.lifeTasks.find(t=>t.id===lifeDragId);if(t){t.category=targetCat;lifeDragId=null;render();scheduleSave();return}}if(dragCatName&&dragCatName!==targetCat){if(!state.catOrder)state.catOrder=[];const cats=new Set();state.lifeTasks.filter(t=>!t.done).forEach(t=>{const c=t.category||'General';cats.add(c)});let order=state.catOrder.filter(c=>cats.has(c));cats.forEach(c=>{if(!order.includes(c))order.push(c)});const fi=order.indexOf(dragCatName),ti=order.indexOf(targetCat);if(fi>=0&&ti>=0){order.splice(fi,1);order.splice(ti,0,dragCatName);state.catOrder=order}dragCatName=null;render();scheduleSave()}}

// ===== SYLLABUS =====
function hideSylWeek(wkN){if(!state.hiddenSylWeeks)state.hiddenSylWeeks=[];if(!state.hiddenSylWeeks.includes(wkN))state.hiddenSylWeeks.push(wkN);render();scheduleSave()}
function expandSylWeek(wkN){state.hiddenSylWeeks=(state.hiddenSylWeeks||[]).filter(w=>w!==wkN);render();scheduleSave()}
function hideSylDay(date){if(!state.hiddenSylDays)state.hiddenSylDays=[];if(!state.hiddenSylDays.includes(date))state.hiddenSylDays.push(date);render();scheduleSave()}
function expandSylDays(wkN){const weeks=generateWeeks();const wk=weeks.find(w=>w.num===wkN);if(!wk){state.hiddenSylDays=[];render();scheduleSave();return}const dates=wk.days.map(d=>d.date);state.hiddenSylDays=(state.hiddenSylDays||[]).filter(d=>!dates.includes(d));render();scheduleSave()}
// A feed entry's tick and star are the only part of it the user owns, so they are written to
// state.sylMarks rather than to the entry (which is regenerated from the spreadsheet every fetch).
function toggleSylHL(id){const s=sylFind(id);if(!s)return;if(s.feed)sylSetMark(id,'highlighted',!s.highlighted);else s.highlighted=!s.highlighted;render();scheduleSave()}
function toggleSylDone(id){const s=sylFind(id);if(!s)return;const nv=!s.done;if(s.feed)sylSetMark(id,'done',nv);else s.done=nv;render();scheduleSave()}
// --- Week-tab syllabus pill actions (v11.7). The pill is the interface: tapping it lifts an action
// rail over the pill itself, so highlight / complete / open are one thumb-reach away and nothing
// covers the week. The armed key is transient — never persisted, never synced — but it is read back
// when the pills render, so the rail stays open across the re-render a toggle triggers and the
// button under the finger updates in place. All writes still go through toggleSylDone/toggleSylHL
// (one per-record write each, per SYNC_REFERENCE). ---
let _sylActing=null;
function sylPillTap(key,el){const wasOn=el.classList.contains('acting');sylClearActing();if(!wasOn){_sylActing=key;el.classList.add('acting')}}
function sylClearActing(){_sylActing=null;document.querySelectorAll('.syl-mirror.acting').forEach(c=>c.classList.remove('acting'))}
// Completing dismisses the rail: the struck-through pill underneath is the confirmation, and it is
// worth uncovering. Highlighting does not — its button lights up in place, and the star is usually
// one of two things you came to do.
function sylActDone(id){sylClearActing();toggleSylDone(id)}
function sylActOpen(id){sylClearActing();openSylFromWeek(id)}
function openSylFromWeek(id){const s=sylFind(id);switchTab('syllabus');setTimeout(()=>{const row=document.getElementById('syl-'+id);if(!row)return;if(s)row.style.setProperty('--pulse-color','var(--accent-'+s.cat+'-dim,var(--accent-ab-dim))');row.scrollIntoView({behavior:'smooth',block:'center'});row.classList.remove('syl-pulse');void row.offsetWidth;row.classList.add('syl-pulse');setTimeout(()=>row.classList.remove('syl-pulse'),1700)},90)}
// Writes to whichever layer owns the entry: the record itself for a hand-added one, a patch over
// the spreadsheet for a feed one.
function sylWriteField(s,field,val){if(s.feed)sylSetEdit(s.id,{[field]:val});else s[field]=val}
function inlineSylEdit(id,field,el){const s=sylFind(id);if(!s)return;

if(field==='title'){const inp=document.createElement('input');inp.type='text';inp.value=s.title;inp.className='syl-title-edit';el.replaceWith(inp);inp.focus();inp.select();function save(){sylWriteField(s,'title',inp.value.trim()||s.title);render();scheduleSave()}inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();save()}else if(e.key==='Escape')render()});inp.addEventListener('blur',save)}
else if(field==='detail'){const ta=document.createElement('textarea');ta.value=sylDetailSrc(s);ta.className='syl-detail-edit';ta.rows=Math.max(2,sylDetailSrc(s).split('\n').length+1);el.replaceWith(ta);ta.focus();function save(){sylWriteField(s,'detail',ta.value);render();scheduleSave()}ta.addEventListener('keydown',e=>{if(e.key==='Escape')render()});ta.addEventListener('blur',save)}}
function deleteSylEntry(id){if(!confirm('Delete syllabus entry?'))return;state.syllabus=(state.syllabus||[]).filter(s=>s.id!==id);render();scheduleSave()}
function addSylEntry(){const title=$('#sylNewTitle')?.value.trim();if(!title)return;const newId=genId();const dueVal=normalizeDateInput($('#sylNewDue')?.value?.trim())||isoDate(TODAY);const dueEndVal='';const dueTimeVal=$('#sylNewTime')?.value||'';const newCat=$('#sylNewCat').value;const newCls=sylClassOf(newCat);state.syllabus.push({id:newId,cat:newCat,clsAlias:newCls?newCls.alias:'',type:$('#sylNewType').value,title,detail:$('#sylNewDetail')?.value||'',due:dueVal,dueEnd:dueEndVal,dueTime:dueTimeVal,done:false,highlighted:false});$('#sylNewTitle').value='';$('#sylNewDue').value='';$('#sylNewTime').value='';$('#sylNewDetail').value='';render();scheduleSave();setTimeout(()=>{const wk=semesterWeekNum(parseDate(dueVal));const sec=document.querySelector(`.syl-week-section:has(.syl-week-hdr:first-child)`);const sections=document.querySelectorAll('.syl-week-section');for(const s of sections){if(s.querySelector('.syl-week-hdr')?.textContent?.includes('Week '+wk)){s.scrollIntoView({behavior:'smooth',block:'center'});break}}},60)}
function addSylType(id){const s=(state.syllabus||[]).find(s=>s.id===id);if(!s)return;const t=prompt('Enter type (reading, paper, exam, presentation, or custom):',s.type);if(t&&t.trim()){s.type=t.trim().toLowerCase();render();scheduleSave()}}
let editSylId=null;
// Both kinds of entry open the same editor. A hand-added one is edited in place; a feed one is
// edited as a patch over the spreadsheet's row, which is why Delete becomes Reset for it: there is
// nothing here to delete, only an edit of yours to take back.
function openSylEdit(id){editSylId=id;const s=sylFind(id);if(!s)return;
  fillCatSelect($('#sCat'),s.cat,[],true);
  $('#sylModalTitle').textContent=s.feed?'Edit Feed Entry':'Edit Syllabus Entry';
  const del=$('#sDel');del.textContent=s.feed?'Reset to feed':'Delete';del.classList.toggle('btn-quiet',!!s.feed);del.classList.toggle('btn-danger',!s.feed);
  del.disabled=!!(s.feed&&!s.edited);del.style.opacity=del.disabled?'.4':'';
  del.title=s.feed?'Put this entry back to what the spreadsheet says':'';
  $('#sTitle').value=s.title;$('#sDetail').value=sylDetailSrc(s);$('#sCat').value=s.cat;$('#sType').value=s.type;$('#sDue').value=s.due;$('#sDueTime').value=s.dueTime||'';$('#sDueEnd').value=s.dueEnd||'';$('#sDueEnd').min=s.due;edResetTouched('sDueEnd');$('#sylModal').classList.add('open')}
$('#sSave').onclick=()=>{const s=sylFind(editSylId);
  if(s&&s.feed){sylSetEdit(editSylId,{title:$('#sTitle').value,detail:$('#sDetail').value,cat:$('#sCat').value,type:$('#sType').value,due:normalizeDateInput($('#sDue').value)||s.due,dueTime:$('#sDueTime').value||''})}
  else{const h=(state.syllabus||[]).find(x=>x.id===editSylId);if(h){h.title=$('#sTitle').value;h.detail=$('#sDetail').value;h.cat=$('#sCat').value;const _sc=sylClassOf(h.cat);h.clsAlias=_sc?_sc.alias:'';h.type=$('#sType').value;h.due=normalizeDateInput($('#sDue').value)||h.due;h.dueTime=$('#sDueTime').value||'';h.dueEnd=normalizeDateInput($('#sDueEnd').value)||''}}
  $('#sylModal').classList.remove('open');render();scheduleSave()}
$('#sDel').onclick=()=>{const s=sylFind(editSylId);
  if(s&&s.feed){if(!confirm('Reset this entry to what the syllabus feed says?'))return;$('#sylModal').classList.remove('open');sylResetEdit(editSylId);return}
  if(!confirm('Delete syllabus entry?'))return;state.syllabus=(state.syllabus||[]).filter(x=>x.id!==editSylId);$('#sylModal').classList.remove('open');render();scheduleSave()}
$('#sCanc').onclick=()=>{$('#sylModal').classList.remove('open')}
$('#sylModal').onclick=e=>{if(e.target.id==='sylModal')$('#sylModal').classList.remove('open')}

// ===== EXPORT / IMPORT =====
function exportState(){
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'planner-backup-' + isoDate(new Date()) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importState(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    try {
      const text = await file.text();
      const imported = JSON.parse(text);
      if(imported.tasks && imported.lifeTasks){
        applyChosenState(imported);
        migrateRecordIds();
        stripHoursField();
        render();
        scheduleSave();
        flushQueue();
        alert('Backup restored successfully!');
      } else {
        alert('Invalid backup file.');
      }
    } catch(err){
      alert('Error reading file: ' + err.message);
    }
  };
  input.click();
}
function bumpOverdueTasks(){const todayStr=isoDate(TODAY);let changed=false;const toReturn=state.tasks.filter(t=>!t.done&&t.date<todayStr);toReturn.forEach(t=>{if(t.lifeSourceId){const lt=state.lifeTasks.find(l=>l.id===t.lifeSourceId);if(lt){lt.inBank=true}}else{state.lifeTasks.push({id:genId(),name:t.name,category:'General',priority:t.priority==='high'?'high':'med',due:'',done:false,inBank:true})}changed=true});state.tasks=state.tasks.filter(t=>t.done||t.date>=todayStr);if(changed)scheduleSave()}
function migrateEventTasks(){const evtTasks=state.tasks.filter(t=>t.cat==='events');if(!evtTasks.length)return;if(!state.events)state.events=[];evtTasks.forEach(t=>{const exists=(state.events||[]).some(e=>e.name===t.name&&e.date===t.date);if(!exists){state.events.push({id:genId(),name:t.name,date:t.date,endDate:'',startTime:t.time||'',endTime:'',location:'',allDay:false})}});state.tasks=state.tasks.filter(t=>t.cat!=='events');scheduleSave()}
async function init(){
  // The weather layer was removed in v10.9; drop its cache so no stale readings linger.
  try{localStorage.removeItem(SKEY+'-weather')}catch(e){}
  await loadState();bumpOverdueTasks();migrateEventTasks();render();handleUrlAction();updateConn(navigator.onLine?'online':'offline');startSync();
  // The syllabus feed is never in the critical path: the tab has already drawn from cache above,
  // and this refresh re-renders when (and if) a newer spreadsheet lands.
  sylRefresh();
  setInterval(()=>{if(document.visibilityState==='visible'&&navigator.onLine)syncPullAndMerge(false)},30000);
  window.addEventListener('online',()=>{updateConn('online');setTimeout(()=>{flushQueue().then(()=>syncPullAndMerge(false))},500)});
  window.addEventListener('offline',()=>updateConn('offline'));
  window.addEventListener('pagehide',flushQueueBeacon);
  // Capture phase, so it runs even though the chip stops propagation — but only for clicks that
  // did NOT land on a chip, or it would disarm the very chip being armed.
  document.addEventListener('click',e=>{
    const t=e.target;
    if(!t||!t.closest||!t.closest('.cal-evt'))calDisarm();
  },true);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushQueueBeacon();else if(document.visibilityState==='visible'&&navigator.onLine){flushQueue().then(()=>syncPullAndMerge(false))}});
  if('serviceWorker' in navigator){
    const hadController=!!navigator.serviceWorker.controller;let swReloading=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(swReloading||!hadController)return;swReloading=true;location.reload()});
    navigator.serviceWorker.register('sw.js').then(reg=>{if(reg)reg.update()}).catch(e=>console.warn('SW reg failed:',e));
    // Capture phase, so it runs even though the chip stops propagation — but only for clicks that
  // did NOT land on a chip, or it would disarm the very chip being armed.
  document.addEventListener('click',e=>{
    const t=e.target;
    if(!t||!t.closest||!t.closest('.cal-evt'))calDisarm();
  },true);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')navigator.serviceWorker.getRegistration().then(r=>{if(r)r.update()})});
  }}
init();
