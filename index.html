  /* spacing grid */

*{margin:0;padding:0;box-sizing:border-box}
/* Background also on <html> (carries data-theme): Chrome/Android tints the bottom OS nav bar from the root bg. */
html{background:var(--bg);transition:background var(--t-med) var(--ease)}
/* Nothing may widen the page. One unbreakable token — a URL pasted into a syllabus row — used to
   stretch a day column past the viewport, and the whole layout scrolled sideways under a bottom bar
   that is fixed to the viewport, which is what made the tab bar look misplaced and cut off. Long
   words break (see .evt-title/.syl-pill-title below); this is the guard that holds even for
   whatever comes next. `clip` rather than `hidden`: it does not make the body a scroll container,
   so the almanac's sticky flanks keep sticking to the viewport. */
body{overflow-x:clip;font-family:var(--font-sans);font-size:var(--fs-s);background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh;transition:background var(--t-med) var(--ease),color var(--t-med) var(--ease)}
/* The shell is exactly one viewport tall and never scrolls; .scroll is what moves. `dvh` tracks the
   viewport as the URL bar comes and goes, so the tab bar rides with it instead of being stranded
   below it. The `vh` line before it is the fallback for anything without dvh. */
.shell{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.frame{flex:1 1 auto;min-height:0;display:flex;position:relative}
.scroll{flex:1 1 auto;min-width:0;overflow-y:auto;overflow-x:clip;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch}
.app{position:relative;max-width:900px;margin:0 auto;padding:var(--sp-6) var(--sp-4) 40px}
.header{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:30px;flex-wrap:wrap}
.header h1{font-family:var(--font-serif);font-size:var(--fs-xl);font-weight:600;letter-spacing:-.02em}
.today-badge{font-family:var(--font-mono);font-size:var(--fs-2xs);color:var(--text-dim);background:var(--surface2);padding:3px 9px;border-radius:var(--r-pill)}
.combined-status{font-family:var(--font-mono);font-size:var(--fs-2xs);display:inline-flex;align-items:center;gap:5px;min-width:90px;transition:color var(--t-med) var(--ease)}
.status-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;transition:background var(--t-med) var(--ease)}
.combined-status.saved-online{color:var(--ok)}.combined-status.saved-online .status-dot{background:var(--ok)}
.combined-status.saving{color:var(--warning)}.combined-status.saving .status-dot{background:var(--warning);animation:pulse .8s infinite alternate}
.combined-status.syncing{color:var(--warning)}.combined-status.syncing .status-dot{background:var(--warning);animation:pulse .8s infinite alternate}
.combined-status.offline{color:var(--text-muted)}.combined-status.offline .status-dot{background:var(--danger)}
.combined-status.error{color:var(--danger)}.combined-status.error .status-dot{background:var(--danger)}
@keyframes pulse{from{opacity:.4}to{opacity:1}}
.theme-toggle{display:inline-flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);padding:5px 12px;border-radius:var(--r-pill);cursor:pointer;font-family:var(--font-sans);font-size:var(--fs-xs);font-weight:500;transition:color var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease)}
/* Class colour slots (v11.5). The syllabus is a feed now, so the classes are whatever the
   spreadsheet names — c0..c5 alias the accents each theme already defines rather than making
   every theme declare six more. var() resolves at use, so these follow the active theme.
   The order is picked for separation in Ember, whose warm accents otherwise collapse into one
   another: gold, green, blue, purple, teal, orange. --accent-life is deliberately not among
   them and --accent-cn is last, so a class never lands on the Tasks orange in the legend. */
:root{--accent-c0:var(--accent-bh);--accent-c0-dim:var(--accent-bh-dim);--accent-c1:var(--accent-wh);--accent-c1-dim:var(--accent-wh-dim);--accent-c2:var(--evt-1);--accent-c2-dim:var(--evt-1-dim);--accent-c3:var(--evt-2);--accent-c3-dim:var(--evt-2-dim);--accent-c4:var(--evt-4);--accent-c4-dim:var(--evt-4-dim);--accent-c5:var(--accent-cn);--accent-c5-dim:var(--accent-cn-dim)}
.chip.c0{background:var(--accent-c0-dim);color:var(--accent-c0)}.chip.c1{background:var(--accent-c1-dim);color:var(--accent-c1)}.chip.c2{background:var(--accent-c2-dim);color:var(--accent-c2)}.chip.c3{background:var(--accent-c3-dim);color:var(--accent-c3)}.chip.c4{background:var(--accent-c4-dim);color:var(--accent-c4)}.chip.c5{background:var(--accent-c5-dim);color:var(--accent-c5)}
.legend-dot.c0{background:var(--accent-c0)}.legend-dot.c1{background:var(--accent-c1)}.legend-dot.c2{background:var(--accent-c2)}.legend-dot.c3{background:var(--accent-c3)}.legend-dot.c4{background:var(--accent-c4)}.legend-dot.c5{background:var(--accent-c5)}
.dash-col-hdr.c0{border-color:var(--accent-c0);color:var(--accent-c0)}.dash-col-hdr.c1{border-color:var(--accent-c1);color:var(--accent-c1)}.dash-col-hdr.c2{border-color:var(--accent-c2);color:var(--accent-c2)}.dash-col-hdr.c3{border-color:var(--accent-c3);color:var(--accent-c3)}.dash-col-hdr.c4{border-color:var(--accent-c4);color:var(--accent-c4)}.dash-col-hdr.c5{border-color:var(--accent-c5);color:var(--accent-c5)}
.theme-dot{width:10px;height:10px;border-radius:50%;background:var(--accent-bh);border:1px solid var(--border);flex-shrink:0}
.theme-toggle:hover{color:var(--text);border-color:var(--text-dim)}
.version-label{font-family:var(--font-mono);font-size:var(--fs-2xs);color:var(--text-muted);white-space:nowrap}
.subtitle{color:var(--text-dim);font-size:var(--fs-xs);margin-bottom:22px}
.tabs{display:flex;gap:2px;margin-bottom:22px;background:var(--surface);border-radius:var(--r-m);padding:3px;width:fit-content;border:1px solid var(--border);flex-wrap:wrap}
.tab{padding:7px 14px;border:none;background:0;color:var(--text-dim);font-family:var(--font-sans);font-size:var(--fs-xs);font-weight:600;cursor:pointer;border-radius:var(--r-s);transition:color var(--t-fast) var(--ease),background var(--t-fast) var(--ease)}
.tab:hover{color:var(--text)}.tab.active{background:var(--surface3);color:var(--text)}
.view{display:none}.view.active{display:block}
/* ---- Responsive navigation: mobile-first, swaps at 820px ---- */
.nav-ico,.bn-ico{flex-shrink:0}
.nav-icon{display:inline-block;width:22px;height:22px;flex-shrink:0;background-color:var(--text-dim);-webkit-mask:var(--icon) center/contain no-repeat;mask:var(--icon) center/contain no-repeat}
.bn-item .nav-icon{width:24px;height:24px}
.bn-item .nav-face{gap:3px;padding:0}
.nav-item:hover .nav-icon,.nav-item.active .nav-icon,.bn-item.active .nav-icon{background-color:var(--text)}
/* The side nav is the bottom bar transposed (v12.2): the same slots, the same faces, one cell each,
   dividing the full height between them however many there are — `flex:1` and nothing hardcoded, so
   adding a fifth pair needs no layout change. Before this it was a list of buttons at the top with
   the last pair marooned at the foot after a spacer, which read as two navigations rather than one.
   The active marker is the bottom bar's rule rotated a quarter turn: a bar on the leading edge. */
.sidenav{display:none;flex:0 0 208px;background:var(--surface);border-right:1px solid var(--border);flex-direction:column;padding:14px 10px;gap:6px;z-index:40;overflow-y:auto}
.sidenav-title{font-family:var(--font-sans);font-weight:700;font-size:var(--fs-2xs);color:var(--text-muted);letter-spacing:.05em;text-transform:uppercase;padding:4px 8px 10px;flex:0 0 auto}
.nav-item{flex:1 1 0;min-height:64px;display:flex;align-items:center;justify-content:center;width:100%;background:0;border:0;border-left:3px solid transparent;color:var(--text-dim);font-family:var(--font-sans);font-size:var(--fs-s);font-weight:600;padding:6px;border-radius:var(--r-m);cursor:pointer;transition:color var(--t-fast) var(--ease)}
/* The cell divides the height; the FACE is what gets marked. Filling a cell a fifth of the screen
   tall with the active colour reads as a slab, so the ground sits on the icon-and-label group and
   the cell keeps only the leading bar — the bottom bar's active rule, rotated. */
.nav-face{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 20px;border-radius:var(--r-m);transition:background var(--t-fast) var(--ease)}
.nav-item .nav-icon{width:26px;height:26px}
.nav-item:hover .nav-face{background:var(--surface2)}
.nav-item:hover{color:var(--text)}
.nav-item.active{color:var(--text);border-left-color:var(--accent-ab)}
.nav-item.active .nav-face{background:var(--surface3)}
/* In flow at the foot of the shell — not fixed, so there is no viewport for it to be stranded
   outside of. It keeps the safe-area inset as padding, for a phone with a home indicator. */
.bottomnav{flex:0 0 auto;display:flex;background:var(--surface);border-top:1px solid var(--border);z-index:40;padding-bottom:env(safe-area-inset-bottom,0)}
.bn-item{flex:1;display:flex;align-items:center;justify-content:center;background:0;border:0;border-top:2px solid transparent;color:var(--text-dim);font-family:var(--font-sans);font-size:var(--fs-2xs);font-weight:600;padding:8px 2px 7px;cursor:pointer}
.bn-item.active{color:var(--text);border-top-color:var(--accent-ab)}
.bn-item .bn-ico{font-size:var(--fs-l);line-height:1}

@media(min-width:820px){
  .sidenav{display:flex}
  .bottomnav{display:none}
  .app{padding-bottom:80px}
}
/* A quiet way in, in the header, which every tab already has. */
.hdr-icon-btn{display:flex;align-items:center;justify-content:center;width:30px;height:30px;flex-shrink:0;
  background:0;border:1px solid var(--border);border-radius:var(--r-s);color:var(--text-dim);cursor:pointer;
  transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
.hdr-icon-btn:hover{background:var(--surface2);color:var(--text)}
.hdr-icon-btn .mi{width:15px;height:15px}

/* ---- Find (v12.2) ---------------------------------------------------------------------------- */
/* The find bar is pinned to the top of the viewport, not to a tab: one bar searches whichever tab is
   open, and with "all tabs" ticked it carries on into the next. It sits above the sticky almanac
   flanks and below the modals. */
/* Everything in the bar except the query is a control, not text: no selection, no copy/paste
   callout on a long press, no tap highlight, and `touch-action:manipulation` so a quick second tap
   on next/prev is another press rather than a double-tap zoom — which is what was blowing the page
   up and pushing the close button off the edge. */
.findbar,.findbar *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
.findbar input{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
/* A flex child at the top of the shell rather than an overlay: it takes its own height and the
   frame below simply gets shorter, so nothing needs padding to compensate. */
.findbar{flex:0 0 auto;z-index:55;display:none;align-items:center;gap:8px;
  padding:8px 12px calc(8px + env(safe-area-inset-top,0));background:var(--surface);
  border-bottom:1px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,.18)}
.findbar.open{display:flex}
.findbar .find-ico{width:16px;height:16px;color:var(--text-muted);flex-shrink:0}
#findInput{flex:1 1 auto;min-width:0;background:var(--surface2);border:1px solid var(--border);
  color:var(--text);font-family:var(--font-sans);font-size:var(--fs-s);padding:7px 10px;border-radius:var(--r-s)}
/* 16px is the threshold under which a phone zooms the page when the field takes focus. */
@media(pointer:coarse){#findInput{font-size:16px}}
#findInput:focus{outline:2px solid var(--accent-ab);outline-offset:-1px}
.find-count{font-family:var(--font-mono);font-size:var(--fs-2xs);color:var(--text-dim);white-space:nowrap;flex-shrink:0;min-width:52px;text-align:right}
.find-count.none{color:var(--danger)}
.find-btn{display:flex;align-items:center;justify-content:center;width:30px;height:30px;flex-shrink:0;
  background:0;border:1px solid var(--border);border-radius:var(--r-s);color:var(--text-dim);cursor:pointer}
.find-btn:hover{background:var(--surface2);color:var(--text)}
.find-btn .mi{width:14px;height:14px}
.find-down{transform:rotate(180deg)}
.find-all{display:flex;align-items:center;gap:5px;font-size:var(--fs-2xs);color:var(--text-dim);white-space:nowrap;cursor:pointer;flex-shrink:0}
/* Body-scoped so a mark can be found inside any tab; the current one is the only strong colour, so
   the eye lands on it and the rest read as a trail. */
mark.find-hit{background:var(--warning-dim);color:inherit;border-radius:2px;padding:0 1px}
mark.find-hit.cur{background:var(--warning);color:var(--bg);box-shadow:0 0 0 2px var(--warning)}
@media(max-width:700px){.findbar{gap:6px;padding-left:8px;padding-right:8px}.findbar .find-ico{display:none}
  .find-count{min-width:40px}.find-all{gap:3px}.find-all .find-all-long{display:none}}
.find-all-short{display:none}
@media(max-width:700px){.find-all-short{display:inline}}


.legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);width:fit-content;max-width:100%}
.legend-item{display:flex;align-items:center;gap:6px;font-size:var(--fs-xs);font-weight:600;color:var(--text-dim)}
.legend-dot{width:10px;height:10px;border-radius:var(--r-s)}
.legend-dot.life{background:var(--accent-life)}.legend-dot.events{background:var(--warning)}.legend-dot.custom{background:var(--text-muted)}
.hide-day-btn{font-size:var(--fs-2xs);padding:1px 5px;border:1px solid var(--border);border-radius:var(--r-s);background:var(--surface2);color:var(--text-muted);cursor:pointer;margin-top:2px;opacity:.5;transition:opacity var(--t-fast) var(--ease)}.hide-day-btn:hover{opacity:1}
.expand-week-btn{font-size:var(--fs-2xs);padding:1px 6px;border:1px solid var(--border);border-radius:var(--r-s);background:var(--surface2);color:var(--text-muted);cursor:pointer;margin-left:8px;opacity:.6;transition:opacity var(--t-fast) var(--ease)}.expand-week-btn:hover{opacity:1}
.legend-hint{font-size:var(--fs-2xs);color:var(--text-muted);font-style:italic}

/* Dashboard */
.dash-table{display:grid;gap:10px;margin-bottom:24px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.dash-col-hdrs,.dash-grid-row{display:grid;gap:8px;padding:0 4px}
.dash-col-hdr{font-family:var(--font-serif);font-size:var(--fs-m);font-weight:600;text-align:center;padding:8px 4px;border-bottom:2px solid;border-radius:var(--r-s) var(--r-s) 0 0;min-width:130px}
.dash-col-hdr.custom{border-color:var(--text-muted);color:var(--text-dim)}
.dash-cell{background:var(--surface);border-radius:var(--r-m);padding:10px 12px;text-align:center;border:1px solid var(--border);min-height:60px;min-width:130px;display:flex;flex-direction:column;justify-content:center}
.dc-title{font-family:var(--font-serif);font-size:var(--fs-s);font-weight:600;margin-bottom:4px;word-wrap:break-word;overflow-wrap:break-word}
.dash-cell-empty{background:0;border:1px dashed var(--border);opacity:.3}
.dc-due{font-family:var(--font-mono);font-size:var(--fs-2xs);color:var(--text-dim)}
.dc-days{margin-top:2px;align-self:flex-start}
.dash-past{opacity:.4}
.dash-cell{position:relative}.dash-cell .dc-close{display:none;position:absolute;top:4px;right:4px;background:var(--surface3);border:1px solid var(--border);color:var(--text-muted);width:20px;height:20px;border-radius:50%;font-size:var(--fs-2xs);cursor:pointer;align-items:center;justify-content:center;line-height:1;z-index:5;transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease)}.dash-cell .dc-close:hover{background:var(--danger-dim);color:var(--danger);border-color:var(--danger)}.dash-cell.dc-active .dc-close{display:flex}
.dc-tag{display:inline-block;font-size:var(--fs-2xs);font-weight:700;text-transform:uppercase;padding:1px 5px;border-radius:var(--r-s);margin-top:4px}
.notes-box{background:var(--surface);border-radius:var(--r-m);padding:14px 18px;margin-bottom:20px;border:1px solid var(--border)}
.notes-box-title{font-weight:700;font-size:var(--fs-2xs);text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-bottom:6px}
.notes-box-text{font-size:var(--fs-s);color:var(--text-dim);line-height:1.7}
.notes-box-text strong{color:var(--text)}

/* Sprint */
.week-section{margin-bottom:26px}
.week-hdr{display:flex;align-items:baseline;gap:9px;margin-bottom:10px;padding-bottom:5px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.week-hdr .chip{font-size:var(--fs-2xs)}
.week-hdr.alloc-target{cursor:pointer}
.week-hdr.alloc-highlight{background:var(--warning-dim);border-radius:var(--r-s)}
.week-hdr .add-day-btn{font-size:var(--fs-2xs);padding:0 5px;line-height:1.4}
.week-hdr-title{font-family:var(--font-serif);font-size:var(--fs-l);font-weight:600}
.week-hdr-dates{font-family:var(--font-mono);font-size:var(--fs-2xs);color:var(--text-dim)}
.week-badge{font-size:var(--fs-2xs);font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:var(--r-s)}
.week-badge.current{color:var(--warning);background:var(--warning-dim)}.week-badge.break{color:var(--ok);background:var(--ok-dim)}

.task-bank{background:var(--surface);border:1px solid var(--accent-life);border-radius:var(--r-m);padding:10px 14px;margin-bottom:14px}
.task-bank-title{font-size:var(--fs-2xs);font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-life);margin-bottom:8px}
.bank-items{display:flex;flex-wrap:wrap;gap:6px}
.bank-chip{font-size:var(--fs-s);padding:9px 11px;border-radius:var(--r-m);font-weight:500;line-height:1.3;display:inline-flex;align-items:center;gap:6px;background:var(--accent-life-dim);color:var(--accent-life);border:1px solid transparent}
.bank-chip.allocating{border:1px solid var(--accent-life);animation:pulse2 1.2s infinite}
@keyframes pulse2{0%,100%{opacity:1}50%{opacity:.5}}
.bank-btn{width:24px;height:24px;border-radius:50%;border:none;font-size:var(--fs-2xs);cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--surface3);color:var(--text-dim);transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease);flex-shrink:0}
.bank-btn:hover{color:var(--text);background:var(--border)}
.bank-btn.alloc{background:var(--accent-life-dim);color:var(--accent-life)}.bank-btn.alloc:hover{background:var(--accent-life);color:#fff}
.bank-btn.done-btn{background:var(--ok-dim);color:var(--ok)}.bank-btn.done-btn:hover{background:var(--ok);color:#fff}
.bank-btn.remove-btn:hover{background:var(--danger-dim);color:var(--danger)}
.bank-empty{font-size:var(--fs-2xs);color:var(--text-muted);font-style:italic}

.day-row{display:grid;grid-template-columns:78px 1fr auto;gap:8px;margin-bottom:5px;padding:8px 10px;background:var(--surface);border-radius:var(--r-m);min-height:42px;border:2px solid transparent;transition:border-color var(--t-fast) var(--ease),background var(--t-fast) var(--ease);cursor:default}
.day-row.alloc-target{cursor:pointer}.day-row.alloc-target:hover{border-color:var(--accent-life);background:var(--surface2)}
.day-row.alloc-highlight{border-color:var(--accent-life);background:var(--surface2)}
.day-row.is-today{border-left:3px solid var(--warning)}
.day-left{display:flex;flex-direction:column;gap:1px}
.day-name{font-family:var(--font-serif);font-weight:600;font-size:var(--fs-m)}
.day-meta{font-family:var(--font-mono);font-size:var(--fs-2xs);color:var(--text-dim)}
.day-right{display:flex;align-items:center;gap:6px;min-width:70px;justify-content:flex-end}

/* Round + add button */
.add-day-btn{width:26px;height:26px;border-radius:50%;border:1px dashed var(--border);background:0;color:var(--text-muted);font-size:var(--fs-s);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:color var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease),background var(--t-fast) var(--ease);flex-shrink:0}
.add-day-btn:hover{color:var(--text-dim);border-color:var(--text-muted);background:var(--surface2)}

.day-tasks-area{display:flex;flex-wrap:wrap;gap:5px;min-height:28px;align-content:flex-start}

.chip{font-size:var(--fs-s);padding:9px 11px;border-radius:var(--r-m);font-weight:500;line-height:1.3;display:inline-flex;align-items:center;gap:5px;cursor:grab;position:relative;max-width:100%;transition:opacity var(--t-fast) var(--ease),transform var(--t-fast) var(--ease);user-select:none}
.chip:active{cursor:grabbing}.chip.dragging{opacity:.3;transform:scale(.95)}
/* The class colours are slots (c0..c5, above) filled by the workbook. These three are the kinds
   that are not classes — and Custom is also what anything the workbook does not name falls back to,
   so a record tagged by a term that has ended still draws as a pill rather than as bare text. */
.chip.life{background:var(--accent-life-dim);color:var(--accent-life)}.chip.events{background:var(--warning-dim);color:var(--warning)}.chip.custom{background:var(--surface2);color:var(--text-dim)}
.chip.high{border:1px solid;font-weight:700}.chip.done{opacity:.35;text-decoration:line-through}
.chip[data-tip]::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);padding:3px 8px;background:var(--text);color:var(--bg);font-size:var(--fs-2xs);font-weight:600;border-radius:var(--r-s);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity var(--t-fast) var(--ease);z-index:20}
.chip[data-tip]:hover::after{opacity:1}
.chip-acts{display:none;position:absolute;top:-5px;right:-5px;gap:2px;z-index:10}
.chip:hover .chip-acts,.chip.menu-open .chip-acts{display:flex}
.chip.menu-activating .chip-acts{pointer-events:none}
.chip-btn:hover{opacity:1}
.chip-btn.life-return{background:var(--accent-life);color:#fff}
.chip-btn.life-complete{background:var(--ok);color:#fff}
.chip-btn.life-remove{background:var(--danger-dim);color:var(--danger)}.chip-btn.life-remove:hover{background:var(--danger);color:#fff}
.chip.drop-before{box-shadow:-3px 0 0 0 var(--accent-bh)}.chip.drop-after{box-shadow:3px 0 0 0 var(--accent-bh)}

/* ---- Almanac (v9.1): day-cell footers + the continuous solar-term ribbon ----
   Every week lives in one .weeks-grid so a term ribbon can span week headers. Column-1
   items (headers, mobile summaries, day rows) carry an explicit grid-row, so hiding the
   summary at desktop width leaves an empty zero-height track instead of shifting rows.
   Names wrap rather than ellipsize — 天氣上升地氣下降 is eight characters and clipping a
   hou name is worse than an uneven row. */
/* grid-template-columns is written inline per tab: one ribbon column for Week, up to four for
   Season, and none at all when every ribbon layer is switched off. */
.weeks-grid{display:grid;column-gap:var(--alm-col-gap);row-gap:0;--alm-col-gap:var(--sp-2);--alm-stack-w:34px;--alm-lane-w:28px}
.week-section{display:contents}
/* Descendant, not child: .week-section is display:contents, so these are grid items but their
   DOM parent is the section. A child combinator here silently matches nothing and the rows fall
   to auto-placement, which lands them in the left flank's column. */
.weeks-grid .week-hdr,.weeks-grid .day-row,.weeks-grid .season-row{grid-column:var(--alm-content-col,1);min-width:0}
.week-section .week-hdr{margin-top:26px}
.weeks-grid .week-section:first-child .week-hdr{margin-top:0}
.day-almanac{grid-column:1/-1;display:flex;flex-direction:column;gap:2px;margin-top:5px;padding-top:5px;border-top:1px dotted var(--border)}
.alm-mk{display:inline-flex;align-items:baseline;gap:6px;flex-wrap:wrap;background:0;border:0;padding:0;margin:0;text-align:left;font-family:var(--font-sans);color:var(--text-dim);cursor:default}
.alm-tc{font-family:var(--font-serif);letter-spacing:.04em}
.alm-en{font-size:var(--fs-2xs);color:var(--text-muted)}
/* Day cells read English-first (v9.5), so the English carries the weight and the Chinese trails
   it a shade quieter. The vertical pills keep the opposite order and their own styling. */
.alm-mk.term{color:var(--accent-bh)}
.alm-mk.term .alm-en{font-size:var(--fs-s);font-weight:700;color:var(--accent-bh)}
.alm-mk.term .alm-tc{font-size:var(--fs-xs);font-weight:600;opacity:.85}
.alm-mk.hou .alm-en{font-size:var(--fs-xs);font-weight:600;color:var(--text-dim)}
.alm-mk.hou .alm-tc{font-size:var(--fs-xs);font-weight:600;color:var(--text-muted)}
/* The opening day of a 候 is called out; the days that merely continue it stay quiet. */
.alm-mk.hou.hou-start .alm-en{color:var(--accent-wh);font-weight:700}
.alm-mk.hou.hou-start .alm-tc{color:var(--accent-wh);opacity:.9}
/* Moon quarters carry no TC (v9.2), so the icon plus the English name IS the label — it is
   never the thing hidden behind a tap on mobile, or the marker would read as a bare glyph. */
.alm-mk.moon{color:var(--text-dim)}
.alm-mk.moon .alm-en{font-size:var(--fs-xs);font-weight:600;color:var(--text-dim)}
.alm-moon-ico{display:inline-flex;align-items:center;color:var(--text-dim);opacity:.85;transform:translateY(2px)}

/* The running solar-term ribbon. One element per unbroken run of days in a term, spanning its
   grid rows — including any week-header row it crosses, which is what keeps it continuous.
   The label is absolutely positioned so the ribbon contributes NO intrinsic height: a one-day
   run must never stretch its day row to fit a vertical name. */
/* Clipped with clip-path, NOT overflow:hidden: an overflow:hidden box is a scroll container, and
   the sticky label below would then stick to a box that never scrolls. clip-path only clips paint. */
/* Both flanks are parallel track strips (v10.3); the nested container/sub-pill construction that
   lived here through v10.2 is gone, along with its pod and cap roles. */
.alm-pill{position:relative;min-height:0;margin-bottom:5px;
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-m);
  clip-path:inset(0 round var(--r-m))}
/* The label is absolutely positioned so a pill contributes NO intrinsic height: a one-day run
   must never stretch its row to fit a vertical name. Clipped with clip-path rather than
   overflow:hidden — an overflow:hidden box is a scroll container, and the sticky label below
   would then stick to a box that never scrolls. */
.alm-ribbon-inner{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center}
/* A pill can run weeks tall, so the name is sticky rather than centred once. */
/* padding-top is inline-start in vertical-rl, so this is the gap above the first glyph. It is
   set a little larger than the side padding: a circular sign like ♌ otherwise reads as crowded
   into the corner radius rather than sitting inside the pill. */
.alm-ribbon-label{position:sticky;top:92px;display:flex;align-items:center;justify-content:center;
  gap:6px;padding:13px 0 11px;writing-mode:vertical-rl;text-orientation:mixed}
/* English rides the vertical-rl flow with text-orientation:mixed. The TC is stacked one character
   per line in horizontal-tb instead of leaning on text-orientation:upright — same upright column
   visually, but it does not depend on the CJK font shipping vertical metrics, which some engines
   lack (the glyphs then collapse to zero advance). */
.alm-ribbon-label .alm-tc{writing-mode:horizontal-tb;font-size:var(--fs-m);font-weight:700;width:1em;
  word-break:break-all;line-height:1.15;text-align:center;letter-spacing:0}
.alm-ribbon-label .alm-en{font-size:var(--fs-2xs);white-space:nowrap;letter-spacing:.02em;opacity:.85}
/* One glyph per span: paired symbols in a single span do not reliably wrap inside a 1em box,
   so they get their own boxes and stack along the label's vertical flow. */
.alm-ribbon-label .alm-glyph{writing-mode:horizontal-tb;font-size:var(--fs-s);line-height:1.05;text-align:center}
/* The nested pod/cap layout was retired in v10.3 — both flanks are parallel track strips now, so
   there is no container needing a spine left showing along the column edge. */
.alm-pill.terms{background:var(--accent-bh-dim);border-color:var(--accent-bh-dim)}
.alm-pill.terms .alm-ribbon-label{color:var(--accent-bh)}
.alm-pill.branch .alm-ribbon-label{color:var(--text-dim)}
.alm-pill.branch .alm-en{font-family:var(--font-serif);font-size:var(--fs-2xs);font-style:italic}
.alm-pill.branch .alm-tc{font-size:var(--fs-m);font-weight:700}
.alm-pill.zodiac .alm-ribbon-label{color:var(--text-dim)}
.alm-pill.zodiac .alm-en{font-size:var(--fs-2xs);letter-spacing:.09em;text-transform:uppercase}
.alm-pill.moonsign{background:var(--surface);border-color:var(--border)}
/* The Moon track had `position:static` here from v10.1 to v10.3, which made it the one lane whose
   label did not ride down with the scroll like every other pill's — it sat at the top of its run
   and slid away. It is sticky again, exactly like the other five. A Moon run is short, so its
   label has less distance to travel than the Sun's, but that is the run length talking, not a
   difference in behaviour.
   Horizontal centring is a separate matter and comes from justify-content on .alm-ribbon-inner:
   that box is a row-direction flexbox, so justify-content is its HORIZONTAL axis, and setting it
   to flex-start (the v10.1 bug) pushed the label off-centre against the pill's left border. */
/* Set by almFitLabels() when the name cannot fit the pill without being clipped. */
.alm-pill.no-name .alm-en{display:none}
.alm-pill.tight .alm-ribbon-label{padding:4px 0}
/* Phase between the quarters: the same reading, one step quieter than a quarter event. */
.alm-mk.phase{color:var(--text-muted)}
.alm-mk.phase .alm-en{font-size:var(--fs-xs);font-weight:500;color:var(--text-muted)}
.alm-mk.phase .alm-moon-ico{opacity:.7}
.alm-pill.moonsign .alm-ribbon-label{color:var(--text-muted)}
/* Both flanks: three parallel tracks of one strip, pulled together over the column gaps so they
   meet on seams. Only the outer edges of the strip are rounded. Each track is told apart by its
   position, its fill, and the sticky glyph tag below — never by a glyph repeated on every pill.
   A track's label is always centred: it must sit an equal distance from both of its borders. */
.alm-pill.track .alm-ribbon-inner{justify-content:center}
.alm-pill.track .alm-ribbon-label{padding-left:0;padding-right:0}
.alm-pill.track{border-color:var(--border)}
/* Seam edges are made TRANSPARENT rather than removed. Dropping a border shortens the content box
   on that side only, which pushes the centred label a border-width off the pill's visual middle —
   the asymmetry that made the ☽ glyph look badly padded. A transparent border keeps the box
   symmetric and still reads as seamless, since the background paints under it. */
.alm-pill.track.first{margin-right:calc(var(--alm-col-gap) / -2);border-right-color:transparent;
  border-radius:var(--r-m) 0 0 var(--r-m);clip-path:inset(0 round var(--r-m) 0 0 var(--r-m))}
.alm-pill.track.mid{margin-left:calc(var(--alm-col-gap) / -2);margin-right:calc(var(--alm-col-gap) / -2);
  border-left-color:transparent;border-right-color:transparent;border-radius:0;clip-path:none}
.alm-pill.track.last{margin-left:calc(var(--alm-col-gap) / -2);border-left-color:transparent;
  border-radius:0 var(--r-m) var(--r-m) 0;clip-path:inset(0 round 0 var(--r-m) var(--r-m) 0)}
/* The tonal ramp runs the same way on both flanks: the slowest layer is the deepest fill on the
   outside, lightening inward to the fastest. That ramp is the mirror — a track's shade tells you
   its rate of change, on whichever side of the day cell you are reading.
     west  ☉ sun -> ☿ mercury -> ☽ moon
     east  建 branch -> 節 term -> 候 pentad                                                     */
.alm-pill.track.sun,.alm-pill.track.branch{background:var(--surface3)}
.alm-pill.track.merc,.alm-pill.track.term{background:var(--surface2)}
.alm-pill.track.moon,.alm-pill.track.hou{background:var(--surface)}
.alm-pill.track .alm-ribbon-label{color:var(--text-dim)}
/* Three classes, so these beat the .alm-pill.terms accent fill that the Week ribbon still uses. */
.alm-pill.track.term{border-color:var(--border)}
.alm-pill.track.term .alm-ribbon-label{color:var(--accent-bh)}
.alm-pill.track.sun .alm-en{font-size:var(--fs-2xs);letter-spacing:.09em;text-transform:uppercase}
/* The two flanks' innermost tracks carry the most text per pixel, so their names are set a shade
   smaller than the outer ones rather than being dropped by almFitLabels() more often. */
.alm-pill.track.hou .alm-en,.alm-pill.track.moon .alm-en{font-size:var(--fs-2xs)}
.alm-pill.track.branch .alm-en{font-family:var(--font-serif);font-style:italic}
/* Retrograde is a modifier on Mercury's own pills: the ℞ plus a lighter, recessed fill. */
.alm-rx{writing-mode:horizontal-tb;font-family:var(--font-serif);font-size:var(--fs-s);font-weight:700;
  line-height:1;color:var(--danger)}
/* Sticky track tags. Emitted after the pills so they float above them, and pinned higher than the
   pill labels so the two never collide. */
.alm-lane-tag{position:relative;pointer-events:none;display:flex;justify-content:center}
/* The tag is the tap target for its whole track, so it is sized deliberately: a square the width
   of its own lane, centred on the glyph, rather than a text box whose height follows the font.
   Left to line-height it came out 43px tall for a 17px glyph — a hit area that looked like a
   mistake. min-height keeps it reachable on the narrowest phones, where the lane is 19px. */
.alm-lane-glyph{position:sticky;top:52px;pointer-events:auto;cursor:pointer;
  display:flex;align-items:center;justify-content:center;align-self:flex-start;
  width:100%;aspect-ratio:1;min-height:24px;padding:0;
  font-size:var(--fs-m);line-height:1;color:var(--text-muted);
  background:var(--bg);border-radius:var(--r-pill);text-align:center}

/* ---- Season rows (v9.4; recomposed v10.3) ----
   A centred column with two corners (v10.5). The corners carry the badges; the centre line
   carries everything that is read as a statement about the day.

     top-left corner  : the moon, now nearly all icon
     top-right corner : `today`, the one row that needs calling out
     centre line      : date, the solar openings, then the event chips

   v10.4 left-aligned the two lower bands on the theory that a list reads off a straight edge.
   In a cell this narrow they are one or two items, not a list, and the ragged left edge under a
   centred date read as a mistake rather than as structure. Only a chip's OWN text stays
   left-aligned, because a two-line event title set ragged-centre inside its own ground does look
   wrong.

   The corners are cells of a three-column head, not absolute boxes: the head then takes the
   height of whichever corner is tallest and the date stays optically centred against it, which
   absolute positioning would not survive on a phone. The side columns are `1fr` and equal, so the
   date sits on the true centre line however lopsided the corners are. */
/* margin-bottom, not the grid's row-gap, sets the space between day cells: the grid keeps
   row-gap:0 so a flank run stays one seamless pill across the rows it spans, while each day cell
   carries its own trailing gap. Bumped to 14px (v10.7) so one day is easier to tell from the
   next; the flank tracks grow with the taller grid rows and stay continuous. */
.season-row{display:flex;flex-direction:column;align-items:stretch;gap:3px;
  margin-bottom:14px;padding:8px 12px;background:var(--surface);border-radius:var(--r-s);
  border-left:3px solid transparent;border-right:3px solid transparent}
.season-row.is-today{border-left-color:var(--warning);border-right-color:var(--warning);background:var(--surface2)}
.season-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;
  gap:var(--sp-2);min-width:0}
.season-corner{display:flex;flex-direction:column;gap:2px;min-width:0}
.season-corner.right{align-items:flex-end}
.season-date{font-family:var(--font-serif);font-weight:600;font-size:var(--fs-s);
  color:var(--text-dim);white-space:nowrap;text-align:center;padding-top:1px}
.season-row.is-today .season-date{color:var(--text);font-weight:700}
.today-tag{font-size:var(--fs-2xs);font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--warning);white-space:nowrap}

/* The solar openings. A 候 or a 節氣 turning over is the one thing the flanks cannot show — they
   carry the running state, not the moment it changes — so the opening day still says so here, and
   only the opening day. Centred with the rest of the body: these are one or two short statements,
   not a list, so there is no straight edge worth aligning them to. */
.season-opens{display:flex;flex-direction:column;align-items:center;gap:1px;
  min-width:0;margin-top:2px}
.season-opens .alm-mk{justify-content:center;text-align:center}

/* The moon, stated once for every reckoning that agrees, and stripped to almost pure icon
   (v10.3). `shared` marks a reading more than one tradition holds, so it carries a shade more
   weight than a lone one. The emblems ARE the attribution — see calMoonRowHtml. */
.moon-cluster{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.moon-row{display:inline-flex;flex-wrap:wrap;align-items:center;gap:1px var(--sp-1);
  font-size:var(--fs-2xs);font-weight:600;line-height:1.2;color:var(--text-dim)}
/* Only a local quarter is ever named. In a corner this narrow the name may take two lines on a
   phone; that is why it is set tight and centred rather than left to straggle. */
.moon-name{text-align:left}
.moon-row .alm-moon-ico{color:inherit;opacity:.9}
.moon-row .cal-emblem{transform:none}
.moon-row .cal-emblem .mi{width:13px;height:13px}
.moon-row .cal-emblem.abh{color:var(--accent-ab)}
.moon-row .cal-emblem.drba{color:var(--accent-cn)}
.moon-row.mid{font-weight:500;color:var(--text-muted)}
.moon-row.mid .alm-moon-ico{opacity:.7}
.moon-row.shared{color:var(--text)}

/* Events. These are the only things in the cell that are appointments, so they get a chip: a
   tinted ground in the publishing tradition's own colour, its emblem, and text at the cell's
   largest size. Nothing else in the Season row is chipped, so an event is unmistakable. */
.season-events{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;
  min-width:0;margin-top:6px;padding-top:7px;border-top:1px solid var(--border)}
.cal-evt{display:inline-flex;align-items:baseline;gap:7px;max-width:100%;min-width:0;
  padding:4px 11px 5px;border-radius:var(--r-s);font-size:var(--fs-s);font-weight:600;
  line-height:1.35;text-align:left}
/* The chip is centred in the cell, but its own text stays left-aligned: a two-line event title
   set ragged-centre inside its own ground reads worse than one with a straight edge. */
.cal-evt-name{min-width:0}
.cal-emblem{display:inline-flex;align-items:center;flex-shrink:0;transform:translateY(2px)}
.cal-emblem .mi{width:15px;height:15px;vertical-align:0}
.cal-evt.abh{background:var(--accent-ab-dim,var(--surface2));color:var(--accent-ab)}
.cal-evt.drba{background:var(--accent-cn-dim,var(--surface2));color:var(--accent-cn)}
/* Mirrored to the Week tab (v11.2, reworked v11.3). The action slot is on EVERY chip at every
   moment and is always the same width — only its contents change, from nothing to → to ×. An idle
   slot is hidden with visibility rather than display, so it still takes its space. That is the
   whole trick: the pill cannot change size when it is clicked or sent, because nothing about its
   box depends on either state. The sent outline is an inset box-shadow for the same reason — a
   border would add a pixel and reflow the text. */
.cal-evt{position:relative;cursor:pointer}
.cal-evt.sent{box-shadow:inset 0 0 0 1px currentColor}
.cal-act{flex:0 0 17px;width:17px;height:17px;align-self:center;
  display:inline-flex;align-items:center;justify-content:center;
  margin:-1px -4px -1px 0;padding:0;border:0;border-radius:var(--r-pill);
  background:0;color:inherit;font-family:var(--font-sans);font-size:var(--fs-s);line-height:1;
  cursor:pointer;
  /* Idle uses opacity, not visibility, so arming can be transitioned. The slot keeps its width
     either way; pointer-events is what makes an invisible one untouchable. */
  opacity:0;transform:scale(.72);pointer-events:none;
  transition:opacity var(--t-fast) var(--ease),transform var(--t-fast) var(--ease),
             background var(--t-fast) var(--ease)}
.cal-evt.armed .cal-act,.cal-evt.sent .cal-act{opacity:1;transform:scale(1);pointer-events:auto}
.cal-evt.armed .cal-act{background:currentColor}
.cal-evt.armed .cal-act .cal-act-ico{color:var(--surface);font-weight:700}
.cal-evt.sent .cal-act{opacity:.65}
.cal-evt.sent .cal-act:hover{opacity:1;background:var(--surface3)}
.cal-act-ico{display:block;transform:translateY(-.5px)}
/* The chip itself eases between its states rather than snapping. box-shadow is what carries the
   sent outline, so it is the thing that has to transition. */
.cal-evt{transition:box-shadow var(--t-med) var(--ease),background var(--t-med) var(--ease)}

/* Send and cancel replace the node, so there is nothing to transition FROM — the changed chip is
   marked for one beat and animated in instead. Only that chip carries the class, so an unrelated
   re-render never sets the whole column moving. */
@keyframes calMark{from{opacity:0;transform:scale(.5) rotate(-25deg)}
                   60%{opacity:1;transform:scale(1.14) rotate(0)}
                   to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes calSettle{from{box-shadow:inset 0 0 0 2.5px currentColor}
                     to{box-shadow:inset 0 0 0 1px currentColor}}
.cal-flash .cal-act-ico{animation:calMark 340ms var(--ease) both}
.cal-evt.sent.cal-flash{animation:calSettle 420ms var(--ease)}
.evt-chip.cal-flash{animation:calSettle 420ms var(--ease)}
@media(prefers-reduced-motion:reduce){
  .cal-act{transition:none}
  .cal-flash .cal-act-ico,.cal-evt.sent.cal-flash,.evt-chip.cal-flash{animation:none}
}

/* The Wan Phra observance is the moon's own occasion rather than a scheduled gathering, so it is
   outlined instead of filled — present and legible, but not competing with a talk or a festival. */
.cal-evt.obs{background:0;box-shadow:inset 0 0 0 1px currentColor;padding:3px 10px 4px;
  font-size:var(--fs-xs);letter-spacing:.05em;text-transform:uppercase}
/* Which 72 候 list is running, named at the top of the tab. The classical list gets a quieter,
   neutral treatment; the local one is tinted, because it is the default and the claim it makes —
   these are the phenomena HERE — is the more particular of the two. */
.hou-src{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 3px;border-radius:var(--r-pill);
  font-size:var(--fs-2xs);font-weight:600;letter-spacing:.04em;white-space:nowrap;
  background:var(--surface2);color:var(--text-muted);border:1px solid var(--border)}
.hou-src.ukiah{background:var(--accent-wh-dim,var(--surface2));color:var(--accent-wh);border-color:transparent}
.hou-src-tc{font-family:var(--font-serif);font-size:var(--fs-xs);font-weight:700}
/* Every flank pill opens a reading, so every flank pill says so on hover (v11.0). */
.alm-pill.track{cursor:pointer}
.alm-pill.hou.track:hover{border-color:var(--accent-wh)}
.alm-pill.terms.track:hover{border-color:var(--accent-bh)}
.alm-pill.branch.track:hover{border-color:var(--accent-cn)}
.alm-pill.zodiac.track:hover,.alm-pill.mercury.track:hover,.alm-pill.moonsign.track:hover{border-color:var(--accent-ab)}
.alm-lane-glyph:hover{color:var(--text);background:var(--surface2)}
/* ℞ is a target inside a target: it explains retrograde, the pill around it explains the sign. */
.alm-rx{cursor:pointer}
.alm-rx:hover{color:var(--text)}

/* The shared reading card. */
.alm-pop-main{display:block;font-family:var(--font-serif);font-size:var(--fs-xl);font-weight:700;
  letter-spacing:.04em;line-height:1.15;display:flex;align-items:baseline;gap:9px}
.alm-pop-tc{font-family:var(--font-serif);letter-spacing:.08em}
.alm-pop-glyph{font-size:var(--fs-xl);line-height:1}
.alm-pop-glyph.rx{color:var(--danger)}
.alm-pop-sub{display:block;font-family:var(--font-sans);font-size:var(--fs-s);font-weight:500;
  color:var(--text-dim);margin-top:4px;line-height:1.3}
.alm-pop-dig{font-size:var(--fs-2xs);font-style:italic;letter-spacing:.06em;text-transform:uppercase;
  color:var(--accent-bh)}
/* A labelled paragraph — the retrograde card stacks six of them. */
.alm-pop-para{font-size:var(--fs-xs);color:var(--text-dim);line-height:1.5;margin:0 0 var(--sp-3)}
.alm-pop-label{display:block;font-size:var(--fs-2xs);font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--text-muted);margin-bottom:2px}
.alm-pop-src{font-size:var(--fs-2xs);color:var(--text-muted);letter-spacing:.04em}
/* The honesty note: the astronomy is exact, the reading is an attribution. Set apart so it is not
   mistaken for more of the interpretation. */
.alm-pop-caveat{display:block;font-size:var(--fs-2xs);color:var(--text-muted);line-height:1.45;
  font-style:italic;border-top:1px solid var(--border);padding-top:var(--sp-2)}
.pop-actions{flex-wrap:wrap}
.season-hdr{margin-bottom:6px}
/* Season now carries SIX lanes, three a side, so a lane has to be narrower than it was when the
   right flank was one wide stack. --alm-stack-w survives only for the Week tab's lone ribbon. */
.season-grid{--alm-lane-w:26px}
.season-grid .week-section .week-hdr{margin-top:20px}
@media(max-width:700px){
  /* The composition is the same at every width; a phone gets a narrower panel and more wrapping.
     Six lanes plus gaps is the one thing that genuinely has to shrink — at 360px they would
     otherwise take more than half the row. */
  .season-row{padding:7px 9px}
  .weeks-grid{--alm-stack-w:30px;--alm-col-gap:5px}
  .season-grid{--alm-lane-w:21px;--alm-col-gap:4px}   /* after .weeks-grid: later rule wins */
  /* A 1em TC box at --fs-m is ~17px and would not fit a 21px lane once the border is counted. */
  .season-grid .alm-ribbon-label .alm-tc{font-size:var(--fs-s)}
}
@media(max-width:380px){
  .season-grid{--alm-lane-w:19px;--alm-col-gap:3px}
  .season-grid .alm-ribbon-label .alm-tc{font-size:var(--fs-xs)}
}

/* Mobile carries the same almanac as the desktop (v9.3): the same ribbons, and both names on
   every marker. There is no narrow-width variant, no tap-to-reveal and no summary line — the
   earlier shorthand made the phone read differently from the browser. The only concession is
   letting the day-cell markers wrap onto a second line, which they already do. */

/* Life Tasks */
.life-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.life-title{font-family:var(--font-serif);font-size:var(--fs-l);font-weight:600}
.life-add-form{display:flex;gap:5px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.life-input{background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:var(--font-sans);font-size:var(--fs-s);padding:7px 10px;border-radius:var(--r-s)}
.life-input:focus{outline:0;border-color:var(--text-dim)}.life-input::placeholder{color:var(--text-muted)}
.life-select{background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:var(--font-sans);font-size:var(--fs-s);padding:6px 8px;border-radius:var(--r-s)}
.life-cat-group{margin-bottom:16px}
.life-cat-hdr{font-size:var(--fs-2xs);font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-bottom:6px;padding-bottom:3px;border-bottom:1px solid var(--border)}
.life-item{display:grid;grid-template-columns:auto 1fr auto auto auto auto auto;gap:6px;align-items:center;padding:9px 12px;background:var(--surface);border-radius:var(--r-m);border-left:3px solid var(--accent-life);margin-bottom:5px;min-height:44px}
.life-item.done-item{opacity:.4}.life-item.done-item .li-name{text-decoration:line-through}
.li-check{width:20px;height:20px;border-radius:var(--r-s);border:2px solid var(--border);background:0;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ok);font-size:var(--fs-2xs);transition:border-color var(--t-fast) var(--ease),background var(--t-fast) var(--ease);flex-shrink:0}
.li-check:hover{border-color:var(--ok)}.li-check.checked{background:var(--ok-dim);border-color:var(--ok)}
.li-name{font-size:var(--fs-s);font-weight:500}
.li-meta{font-family:var(--font-mono);font-size:var(--fs-2xs);color:var(--text-dim)}

.li-pri{font-size:var(--fs-2xs);font-weight:700;text-transform:uppercase;padding:2px 6px;border-radius:var(--r-s)}
.li-pri.high{background:var(--danger-dim);color:var(--danger)}.li-pri.med{background:var(--warning-dim);color:var(--warning)}.li-pri.low{background:var(--surface3);color:var(--text-muted)}
.li-send{width:28px;height:28px;border-radius:50%;border:1px solid var(--accent-life);background:var(--accent-life-dim);color:var(--accent-life);font-size:var(--fs-2xs);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease);flex-shrink:0;position:relative}
.li-send:hover{background:var(--accent-life);color:#fff}
.li-send.in-sprint{background:var(--surface3);border-color:var(--text-muted);color:var(--text-muted)}.li-send.in-sprint:hover{background:var(--warning-dim);color:var(--warning);border-color:var(--warning)}
.li-send[data-tip]::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);padding:3px 8px;background:var(--text);color:var(--bg);font-size:var(--fs-2xs);font-weight:600;border-radius:var(--r-s);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity var(--t-fast) var(--ease);z-index:20}
.li-send[data-tip]:hover::after{opacity:1}
.li-btns{display:flex;gap:3px}

/* Modal */
.modal-overlay{display:flex;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity var(--t-med) var(--ease)}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-l);padding:22px;width:340px;max-width:90vw;transform:scale(.95) translateY(6px);opacity:0;transition:transform var(--t-med) var(--ease),opacity var(--t-med) var(--ease);box-shadow:0 18px 50px rgba(0,0,0,.28)}
.modal-overlay.open .modal{transform:scale(1) translateY(0);opacity:1}
.modal-x{position:absolute;top:10px;right:10px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-s);color:var(--text-muted);line-height:1;cursor:pointer;padding:0;transition:color var(--t-fast) var(--ease),background var(--t-fast) var(--ease)}
.modal-x:hover{color:var(--text);background:var(--surface3)}
/* Syllabus quick-view popup (.pop) — centered, per proof-sheet-v8.1 */
.pop-scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity var(--t-med) var(--ease);z-index:110}
.pop-scrim.open{opacity:1;pointer-events:auto}
.pop{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-l);padding:var(--sp-5);width:min(440px,94vw);max-height:84vh;overflow-y:auto;transform:scale(.95) translateY(6px);opacity:0;transition:transform var(--t-med) var(--ease),opacity var(--t-med) var(--ease);box-shadow:0 18px 50px rgba(0,0,0,.28)}
.pop-scrim.open .pop{transform:scale(1) translateY(0);opacity:1}
.pop-head{display:flex;align-items:flex-start;gap:var(--sp-2)}
.pop-title{font-family:var(--font-serif);font-size:var(--fs-l);font-weight:600;line-height:1.2;flex:1}
.pop-x{flex-shrink:0;width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-s);color:var(--text-muted);cursor:pointer;padding:0}
.pop-x:hover{color:var(--text);background:var(--surface3)}
.pop-meta{display:flex;align-items:center;gap:var(--sp-2);margin:var(--sp-3) 0;flex-wrap:wrap}
.pop-due{font-family:var(--font-serif);font-weight:600;font-size:var(--fs-m)}
.pop-tag{font-family:var(--font-mono);font-size:var(--fs-2xs);font-weight:600;padding:3px 9px;border-radius:var(--r-pill)}
.pop-detail{font-size:var(--fs-s);color:var(--text-dim);white-space:pre-line;border-left:2px solid var(--border);padding-left:var(--sp-3);margin:var(--sp-3) 0 var(--sp-4);line-height:1.5}
.pop-detail .syl-bullet{padding-left:10px}.pop-detail .syl-sub-bullet{padding-left:22px;opacity:.85}
.pop-actions{display:flex;gap:var(--sp-2);flex-wrap:wrap}
.mi-lg{width:22px;height:22px}
.days.urgent{color:var(--danger)}.days.soon{color:var(--warning)}.days.ok{color:var(--ok)}.days.past{color:var(--text-muted);text-decoration:line-through}
.days{font-family:var(--font-mono);font-size:var(--fs-2xs);font-weight:600}
/* Brief highlight pulse on the target row when jumping Week -> Syllabus */
.syl-pulse td{animation:rowpulse 1.6s var(--ease)}
@keyframes rowpulse{0%{background-color:transparent}18%{background-color:var(--pulse-color,var(--accent-ab-dim))}100%{background-color:transparent}}
.evt-pulse{animation:evtpulse 1.6s var(--ease)}
@keyframes evtpulse{0%{box-shadow:0 0 0 0 var(--pulse-color,var(--accent-ab-dim))}22%{box-shadow:0 0 0 6px var(--pulse-color,var(--accent-ab-dim))}100%{box-shadow:0 0 0 0 transparent}}
/* Unified buttons (proof-sheet .btn system) */
.btn{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-sans);font-size:var(--fs-xs);font-weight:600;padding:8px 15px;border-radius:var(--r-s);cursor:pointer;border:1px solid transparent;transition:opacity var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease),background var(--t-fast) var(--ease)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--text);color:var(--bg)}
.btn-primary:hover{opacity:.85}
.btn-quiet{background:transparent;color:var(--text-dim);border-color:var(--border)}
.btn-quiet:hover{color:var(--text);border-color:var(--text-dim)}
.btn-danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn-ghost{width:32px;height:32px;padding:0;justify-content:center;background:transparent;color:var(--text-muted);border:0;border-radius:var(--r-s);cursor:pointer}
.btn-ghost:hover{background:var(--surface2);color:var(--text)}
.btn-ghost .mi{width:16px;height:16px}
/* Form grammar (.field/.frow) */
.frow{display:flex;gap:var(--sp-2);flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:3px}
.field>label{font-family:var(--font-mono);font-size:var(--fs-2xs);color:var(--text-muted);letter-spacing:.03em;text-transform:uppercase}
.field input,.field select{background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:var(--font-sans);font-size:var(--fs-s);padding:8px 11px;border-radius:var(--r-s);outline:none;transition:border-color var(--t-fast) var(--ease)}
.field input:focus,.field select:focus{border-color:var(--text-dim)}
.field .chk{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-s);cursor:pointer;padding:6px 0}
/* Single "optional" block wrapping the quieter event fields */
.opt-block{position:relative;border:1px dashed var(--border);background:var(--surface2);border-radius:var(--r-m);padding:15px 12px 12px;margin-top:12px}
.opt-block .opt-cap{position:absolute;top:-8px;left:12px;background:var(--surface);padding:0 6px;font-family:var(--font-mono);font-size:var(--fs-2xs);font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}
.evt-form{margin-bottom:18px}
.modal h3{font-family:var(--font-serif);font-size:var(--fs-l);margin-bottom:12px}
.modal label{display:block;font-family:var(--font-mono);font-size:var(--fs-2xs);font-weight:600;color:var(--text-muted);letter-spacing:.03em;text-transform:uppercase;margin-bottom:3px;margin-top:8px}
.modal textarea{resize:vertical;min-height:54px}
.modal input,.modal select,.modal textarea{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:var(--font-sans);font-size:var(--fs-s);padding:8px 11px;border-radius:var(--r-s);outline:none;transition:border-color var(--t-fast) var(--ease)}
.modal input:focus,.modal select:focus,.modal textarea:focus{outline:0;border-color:var(--text-dim)}
.modal-btns{display:flex;gap:7px;margin-top:14px;justify-content:flex-end}
.step-btn{width:34px;height:34px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:var(--fs-m);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background var(--t-fast) var(--ease)}
.step-btn:first-child{border-radius:var(--r-s) 0 0 var(--r-s)}.step-btn:last-child{border-radius:0 var(--r-s) var(--r-s) 0}
.step-btn:hover{background:var(--surface3)}
.pri-toggle{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-pill);overflow:hidden;cursor:pointer;user-select:none;width:100%}
.pri-toggle .pri-option{padding:7px 16px;font-size:var(--fs-xs);font-weight:600;font-family:var(--font-sans);transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease);color:var(--text-muted);flex:1;text-align:center}
.pri-toggle .pri-option.active{background:var(--surface3);color:var(--text);border-radius:var(--r-pill)}
.pri-toggle.high .pri-option:last-child{background:var(--danger-dim);color:var(--danger);border-radius:var(--r-pill)}
.pri-toggle.high .pri-option:first-child{color:var(--text-muted)}

/* Notes */
.note-entry{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);padding:12px 14px;margin-bottom:8px;position:relative}
.note-preview{font-size:var(--fs-s);color:var(--text);line-height:1.7;padding:6px 2px;white-space:pre-wrap;word-break:break-word;cursor:text}
.note-preview ul{margin:0 0 0 1.2em;padding:0;list-style:disc}
.note-preview li{margin:0}
.note-hdr{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.note-ts{font-family:var(--font-mono);font-size:var(--fs-2xs);color:var(--text-dim)}
.note-label{font-size:var(--fs-2xs);color:var(--text-muted);font-style:italic}
.note-title-input{background:0;border:0;border-bottom:1px solid transparent;color:var(--text);font-family:var(--font-serif);font-size:var(--fs-s);font-weight:600;padding:0 2px 1px;flex:1;min-width:60px;outline:0;transition:border-color var(--t-fast) var(--ease)}
.note-title-input:focus{border-bottom-color:var(--text-dim)}
.note-title-input::placeholder{color:var(--text-muted);font-weight:400}
.note-body{position:relative}
.note-text{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:var(--font-sans);font-size:var(--fs-s);padding:8px 10px;border-radius:var(--r-s);resize:vertical;min-height:50px;line-height:1.6}
.note-text:focus{outline:0;border-color:var(--text-dim)}
.note-resize-btns{position:absolute;bottom:6px;right:6px;display:flex;gap:2px}

/* Events */
.evt-list{margin-bottom:16px}
.evt-item{display:grid;grid-template-columns:90px 1fr auto auto;gap:8px;align-items:center;padding:10px 12px;background:var(--surface);border-radius:var(--r-m);border-left:3px solid var(--warning);margin-bottom:5px}
.evt-item.past-evt{opacity:.4}
.evt-month{font-family:var(--font-serif);font-size:var(--fs-m);font-weight:600;margin:14px 0 6px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.evt-month::after{content:'';flex:1 1 auto;height:1px;background:var(--border)}
.evt-cont{font-family:var(--font-mono);font-size:var(--fs-2xs);font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);border:1px solid var(--border);border-radius:var(--r-s);padding:0 4px;margin-left:6px;vertical-align:1px}
.evt-date{font-family:var(--font-mono);font-size:var(--fs-2xs);color:var(--text-dim)}
.evt-info{display:flex;flex-direction:column;gap:2px}
.evt-name{font-size:var(--fs-s);font-weight:600}
.evt-loc{font-family:var(--font-mono);font-size:var(--fs-2xs);color:var(--text-muted);font-style:italic}
.evt-meta{font-family:var(--font-mono);font-size:var(--fs-2xs);color:var(--text-dim)}
.evt-btns{display:flex;gap:3px}
.parsed-evt{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);padding:10px 12px;margin-top:8px}
.parsed-evt.needs-date{border-color:var(--danger)}

.parsed-evt input:focus{outline:0;border-color:var(--text-dim)}

.evt-add-form{display:flex;gap:5px;align-items:flex-end;margin-bottom:18px;flex-wrap:wrap}
.evt-add-form input,.evt-add-form select{background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:var(--font-sans);font-size:var(--fs-s);padding:7px 10px;border-radius:var(--r-s)}

/* Event chips in sprint */
.evt-chip{font-size:var(--fs-2xs);padding:6px 10px;border-radius:var(--r-m);font-weight:500;line-height:1.3;display:inline-flex;align-items:center;gap:4px;background:var(--warning-dim);color:var(--warning);border:1px dashed var(--warning);cursor:default;position:relative;user-select:none}
/* Same construction as the syllabus pill: the title is its own item, so a title too long for a
   phone's day column wraps against a straight left edge rather than setting itself ragged around
   the emblem. The pill does not wrap onto a second line the way a syllabus pill does — an emblem is
   narrow enough to leave the title its width, and reads better beside the title than stranded on a
   line of its own — so the title shrinks past its content width (min-width:0) and wraps inside. */
.evt-title{flex:1 1 auto;min-width:0;text-align:left;overflow-wrap:anywhere}
/* The clock is a zone at the end of the title, inside it rather than beside it, so it flows with
   the text like a last word: it never takes width away from the name, and it cannot be stranded on
   a line of its own however narrow the day column gets. */
.pill-zone.evt-when{white-space:nowrap;margin-left:2px;font-weight:500}
.evt-chip[draggable="true"]{cursor:grab}
.evt-chip.dragging{opacity:.4}
.evt-chip.evt-past{opacity:.35;text-decoration:line-through}
/* A mirrored calendar event in the Week tab (v11.2): it wears the publishing tradition's emblem in
   place of the generic bell, and carries a standing x. Deleting here only removes the copy — the
   published entry in Season is a read-only table and is never touched. */
/* Drawn as its Season original (v11.4): the tradition's own colours and emblem, and an outlined
   ground for an observance, so a mirrored item is recognisably the same object in both tabs. */
.evt-chip.evt-cal.obs{background:transparent!important;box-shadow:inset 0 0 0 1px currentColor}
.evt-chip.evt-cal{transition:box-shadow var(--t-med) var(--ease)}
/* The x rides in the pill's top-right corner rather than in the text flow: now that a title can
   take a line of its own, a trailing button in flow lands stranded on a line below it. The pill
   reserves the width on its right, so the x never sits on the title. */
.evt-chip.evt-cal{padding-right:26px}
.evt-cal-x{position:absolute;top:3px;right:3px;display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;
  padding:0;border:0;border-radius:var(--r-s);background:0;color:inherit;
  opacity:.55;cursor:pointer;z-index:2}
.evt-cal-x:hover{opacity:1;background:var(--surface3)}
.evt-cal-x .mi{width:10px;height:10px;vertical-align:0}
.evt-chip .chip-acts{display:none;position:absolute;top:-5px;right:-5px;gap:2px;z-index:10}
.evt-chip:hover .chip-acts,.evt-chip.menu-open .chip-acts{display:flex}
.evt-chip.menu-activating .chip-acts{pointer-events:none}
.evt-chip[data-tip]::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);padding:3px 8px;background:var(--text);color:var(--bg);font-size:var(--fs-2xs);font-weight:600;border-radius:var(--r-s);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity var(--t-fast) var(--ease);z-index:20}
.evt-chip[data-tip]:hover::after{opacity:1}

/* Task drag in Tasks tab */
.life-cat-hdr{cursor:grab;user-select:none}
.life-cat-hdr.drag-over{border-bottom:2px solid var(--warning)}
.life-item{cursor:grab}
.life-item.dragging{opacity:.3}
.life-item.drag-over-item{box-shadow:0 -2px 0 0 var(--warning)}

/* Syllabus */
.syl-week-section{margin-bottom:24px}
.syl-week-hdr{font-family:var(--font-serif);font-size:var(--fs-m);font-weight:600;padding-bottom:4px;border-bottom:1px solid var(--border);margin-bottom:8px;display:flex;align-items:baseline;gap:8px}
.syl-week-dates{font-family:var(--font-mono);font-size:var(--fs-2xs);color:var(--text-dim)}
.syl-table{width:100%;border-collapse:collapse;margin-bottom:8px}
.syl-table td{padding:8px 8px;vertical-align:top;font-size:var(--fs-s)}
/* The title column takes whatever the fixed-width columns leave: without this it is the column that
   yields, and on a phone the actions cell alone can squeeze it down to a few characters a line. */
.syl-title-cell{width:100%}
.syl-table tr{border-bottom:1px solid var(--border)}
.syl-table tr.done td{opacity:.4}
.syl-table tr.done .syl-title-text{text-decoration:line-through}
.syl-class-cell{font-size:var(--fs-2xs);font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;width:44px}
.syl-dot{width:8px;height:8px;border-radius:var(--r-s);display:inline-block;margin-right:4px;vertical-align:middle}
.syl-due-cell{font-family:var(--font-serif);font-size:var(--fs-s);font-weight:600;color:var(--text-dim);width:64px;max-width:72px}
.syl-due-dow{display:block;font-family:var(--font-mono);font-size:var(--fs-2xs);color:var(--text-muted);font-weight:400}
.syl-due-cell .days{display:inline-block;margin-top:2px}
.syl-title-text{font-weight:500;overflow-wrap:anywhere}
.syl-type-tag{font-size:var(--fs-2xs);font-weight:700;text-transform:uppercase;padding:1px 5px;border-radius:var(--r-s);margin-left:6px;vertical-align:middle;display:inline-block}
.syl-type-tag.reading{background:var(--surface3);color:var(--text-dim)}.syl-type-tag.paper{background:var(--danger-dim);color:var(--danger)}.syl-type-tag.exam{background:var(--warning-dim);color:var(--warning)}.syl-type-tag.presentation{background:var(--accent-ab-dim);color:var(--accent-ab)}.syl-type-tag.custom{background:var(--surface3);color:var(--text-muted)}.syl-type-tag.note{background:transparent;color:var(--text-muted);border:1px solid var(--border)}
.syl-meta{margin-left:6px;display:inline-flex;gap:4px;flex-wrap:wrap;vertical-align:middle}
.syl-meta-tag{font-family:var(--font-mono);font-size:var(--fs-2xs);color:var(--text-muted);background:var(--surface2);border-radius:var(--r-s);padding:1px 5px;white-space:nowrap}
a.syl-meta-tag.link{color:var(--text-dim);text-decoration:none}a.syl-meta-tag.link:hover{color:var(--text)}
.syl-feed-mark{font-family:var(--font-mono);font-size:var(--fs-2xs);color:var(--text-muted);opacity:.55;cursor:help;letter-spacing:.04em}
/* "feed" is a quiet provenance note; "edited" is a state, so it is coloured rather than muted. Both
   are dropped on a phone, where the actions cell has no width to spare and the reset button — which
   exists only on an edited row — already says the same thing. */
.syl-feed-mark.edited{color:var(--accent-life);opacity:.9}
.syl-feed-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:var(--fs-2xs);color:var(--text-muted);font-family:var(--font-mono);margin:-6px 0 12px}
.syl-feed-bar.err{color:var(--danger)}
.syl-feed-bar button{background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);border-radius:var(--r-s);padding:2px 8px;font-family:var(--font-mono);font-size:var(--fs-2xs);cursor:pointer}
.syl-feed-bar button:hover{color:var(--text)}
.syl-detail-text{font-size:var(--fs-xs);color:var(--text-dim);margin-top:4px;line-height:1.6;overflow-wrap:anywhere}
.syl-detail-edit{width:100%;margin-top:4px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:var(--font-sans);font-size:var(--fs-s);padding:5px 8px;border-radius:var(--r-s);resize:vertical;min-height:28px;line-height:1.5}
.syl-detail-edit:focus{outline:0;border-color:var(--text-dim)}
.syl-title-edit{background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:var(--font-sans);font-size:var(--fs-s);padding:2px 6px;border-radius:var(--r-s);width:100%}
.syl-title-edit:focus{outline:0;border-color:var(--text-dim)}
.syl-check{width:16px;height:16px;border-radius:var(--r-s);border:2px solid var(--border);background:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--ok);font-size:var(--fs-2xs);transition:border-color var(--t-fast) var(--ease),background var(--t-fast) var(--ease);flex-shrink:0;vertical-align:middle}
.syl-check:hover{border-color:var(--ok)}.syl-check.checked{background:var(--ok-dim);border-color:var(--ok)}
.syl-btns-cell{width:44px;white-space:nowrap}
.syl-add-form{display:flex;gap:5px;align-items:flex-end;margin-bottom:18px;flex-wrap:wrap}
.syl-add-form input,.syl-add-form select{background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:var(--font-sans);font-size:var(--fs-s);padding:7px 10px;border-radius:var(--r-s)}
.syl-hl-btn{background:0;border:0;cursor:pointer;font-size:var(--fs-2xs);padding:1px 3px;border-radius:var(--r-s);opacity:.3;transition:opacity var(--t-fast) var(--ease);line-height:1}
.syl-hl-btn:hover{opacity:.7}.syl-hl-btn.on{opacity:1}
/* A starred entry is marked on its OWN cell, never on the whole row. A day's entries are grouped
   and share their class and due cells through `rowspan`, so a row-wide tint belongs to whichever
   row owns those shared cells: starring the first entry of a group bled the tint down the entire
   group (every entry looked starred), and starring a later one left a hole across the middle where
   the shared cells sit. The title cell is the one cell that is the entry itself, so the tint and
   its accent edge go there — correct for the first row of a group and for every row after it. */
.syl-table tr.syl-row-hl>.syl-title-cell{background:var(--warning-dim);box-shadow:inset 3px 0 0 var(--warning)}
.syl-bullet{display:block;padding-left:14px;position:relative}.syl-bullet::before{content:'•';position:absolute;left:4px}
.syl-sub-bullet{display:block;padding-left:28px;position:relative;font-size:var(--fs-2xs)}.syl-sub-bullet::before{content:'◦';position:absolute;left:16px}
.chip.syl-mirror{cursor:pointer;opacity:.75;font-size:var(--fs-2xs);padding:5px 9px;border:1px dashed}
.chip.syl-mirror:hover{opacity:1}
.chip.syl-mirror .chip-acts{display:none!important}
/* A completed entry stays on the Week tab — the week is a record of what was due, not only of what
   is left — so it is struck through in place rather than removed. Three classes deep, because the
   .syl-mirror opacity above would otherwise win over .chip.done on source order alone. */
.chip.syl-mirror.done{opacity:.4;text-decoration:line-through}
/* The cut mark for a middle-truncated title: dimmer than the text it stands in for, and never
   broken across a line, so it reads as one piece of punctuation rather than as three characters
   the spreadsheet happened to contain. */
.syl-cut{opacity:.55;white-space:nowrap}

/* What a pill says *about* an entry — which class it belongs to, when an event runs — sits in a
   zone of its own: a soft block of the pill's own accent, no border, no second typeface, no
   brackets. It is a part of the pill rather than something stuck onto it, and because the ground is
   the accent the pill is already tinted with, the zone reads as the same object at a different
   depth. Both pill kinds use it, which is what makes them look like one family. */
.pill-zone{display:inline-block;padding:1px 6px;border-radius:var(--r-s);font-size:var(--fs-2xs);font-weight:600;letter-spacing:.01em;
  background:var(--surface2);background:color-mix(in srgb,currentColor 16%,transparent)}

/* A syllabus pill is a tag and a title, not one run of inline scraps. The tag — the type's symbol,
   the class's alias from the workbook in its own zone, and the star if the entry carries one —
   holds everything that says *which* entry this is, apart from *what* it is.
   The pill wraps, and that is what makes it work in a day column barely 150px wide on a phone: the
   title's base size is its own width, so where the pill has room the tag and the title sit inline,
   and where it does not the title takes a line of its own at the pill's full width with the tag
   above it as an eyebrow. One rule, no media query, and the title is never squeezed into the ragged
   two-word column that made these unreadable. (Do not pin the title to a fixed flex-basis to force
   the break: an intrinsically-sized pill then measures itself against that basis instead of its
   text, and short titles wrap while long ones stay inline — exactly backwards.) */
.chip.syl-mirror{flex-wrap:wrap;row-gap:1px}
.syl-tab{display:flex;align-items:center;gap:5px;flex:0 0 auto}
.syl-tab .mi{width:13px;height:13px}
.syl-pill-title{flex:1 1 auto;min-width:0;text-align:left;overflow-wrap:anywhere}
.syl-hl-mark{width:9px;height:9px;vertical-align:0;flex-shrink:0}
/* --- The syllabus pill's actions live on the pill itself (v11.7). Tapping a pill lifts a rail of
   three targets over it: highlight, complete, open in Syllabus. The rail is absolutely positioned
   and overhangs the pill on every side, so it can be thumb-sized without the pill changing size and
   without reflowing the day row — the pill under it keeps its exact footprint. --- */
.chip.syl-mirror.acting{opacity:1;z-index:14}
.chip.syl-mirror.acting[data-tip]::after{display:none}
.syl-acts{position:absolute;left:-3px;right:-3px;top:-7px;bottom:-7px;min-height:42px;z-index:15;display:flex;gap:3px;padding:3px;border-radius:var(--r-m);background:var(--surface);border:1px solid currentColor;box-shadow:0 7px 20px rgba(0,0,0,.3);opacity:0;transform:scale(.94);pointer-events:none;transition:opacity var(--t-fast) var(--ease),transform var(--t-fast) var(--ease)}
.chip.syl-mirror.acting .syl-acts{opacity:1;transform:none;pointer-events:auto}
.syl-act{flex:1;min-width:38px;display:flex;align-items:center;justify-content:center;padding:0;border:0;border-radius:var(--r-s);background:var(--surface2);color:var(--text-dim);cursor:pointer;transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
.syl-act:hover{background:var(--surface3);color:var(--text)}
.syl-act .mi{width:15px;height:15px}
.syl-act.on{background:var(--warning-dim);color:var(--warning)}
.syl-act.is-done{background:var(--ok);color:#fff}
@media(prefers-reduced-motion:reduce){.syl-acts{transition:none}}
@keyframes halo-breathe{0%,100%{box-shadow:0 0 4px 1px var(--halo-color)}50%{box-shadow:0 0 8px 3px var(--halo-color)}}
.chip.task-halo{--halo-color:rgba(201,162,39,.5);border-left:3px solid #c9a227;animation:halo-breathe 3s ease-in-out infinite}
.settings-section{margin-bottom:18px}
.settings-section label{display:block;font-size:var(--fs-xs);font-weight:600;color:var(--text-dim);margin:10px 0 4px}

.hdr-row1,.hdr-row2{display:contents}

/* ============================================================
   v8 CONSOLIDATED COMPONENTS (proof-sheet-v8.1)
   Old class names are aliased in so markup keeps working while
   styling has a single source of truth. Handlers untouched.
   ============================================================ */
/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-sans);font-size:var(--fs-xs);font-weight:600;padding:8px 15px;border-radius:var(--r-s);cursor:pointer;border:1px solid transparent;transition:opacity var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease),background var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
.btn:active{transform:scale(.97)}

.btn-ghost.xs .mi{width:14px;height:14px}

.cal-pick-btn{border-left:0;border-radius:0 var(--r-s) var(--r-s) 0;padding:4px 8px;font-size:var(--fs-2xs)}
.syl-btns-cell .btn-ghost{opacity:.4;padding:1px 4px}.syl-btns-cell .btn-ghost:hover{opacity:1}
.note-move{line-height:1}.note-move:disabled{opacity:.2;cursor:default}
.note-del{margin-left:auto}

/* chip overlay micro-controls (no proof-sheet counterpart; deliberately kept specialized) */
.chip-btn{display:flex;align-items:center;justify-content:center;width:20px;height:20px;padding:0;border:0;cursor:pointer;border-radius:50%;background:var(--text);color:var(--bg);opacity:.85;font-size:var(--fs-2xs);transition:opacity var(--t-fast) var(--ease)}.chip-btn:hover{opacity:1;background:var(--text);color:var(--bg)}

/* countdown badges — one component, standardized thresholds */

.frow{display:flex;gap:var(--sp-2);flex-wrap:wrap;align-items:flex-end}

.field input,.field select{background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:var(--font-sans);font-size:var(--fs-s);padding:8px 11px;border-radius:var(--r-s);outline:none;transition:border-color var(--t-fast) var(--ease)}

@media(max-width:700px){.day-row{grid-template-columns:66px 1fr auto}.life-item{grid-template-columns:auto 1fr auto auto}.li-days{display:none}.li-send{width:24px;height:24px;font-size:var(--fs-2xs)}.evt-item{grid-template-columns:1fr auto auto;gap:4px}.evt-item .evt-date{grid-column:1/-1}.evt-info{text-align:left}.header{gap:4px;flex-wrap:wrap}.hdr-row1{display:flex;align-items:center;gap:6px;width:100%;flex-shrink:0}.hdr-row1 .combined-status{margin-left:auto}.hdr-row2{display:flex;align-items:center;gap:6px;width:100%}.hdr-row2 .theme-toggle{margin-left:auto}.syl-class-cell{white-space:normal;overflow-wrap:anywhere;width:62px;min-width:62px;max-width:62px;letter-spacing:0}.syl-class-cell .syl-dot{float:left;margin-top:4px}.syl-add-form .field label{display:none}.note-text{resize:both}.view[data-tab="syllabus"] .syl-table-wrap,.syl-table-outer{overflow-x:auto;-webkit-overflow-scrolling:touch}.syl-table{font-size:var(--fs-2xs)}.syl-table td{padding:5px 4px}.syl-feed-mark{display:none}}

@media (prefers-reduced-motion:reduce){.modal-overlay,.modal{transition-duration:1ms!important}}

<body>
<!-- THE SHELL (v12.5). The app is a column exactly one viewport tall: a find bar, a frame, and the
     tab bar. The frame is a row: the desktop rail, and the one element in the app that scrolls.
     Nothing here is `position:fixed`, and that is the whole point. A bar fixed to the bottom is
     positioned against the layout viewport, which is not the viewport you can see on a phone — the
     browser keeps the taller URL-bar-hidden height there — so the bar hung below the screen with
     its labels cut off, and no amount of measuring it back into place from JS could win against a
     compositor that moves fixed elements itself during a fling. In flow at the end of a column
     100dvh tall, the bar cannot be anywhere but on screen: no listeners, no correction, no race.
     The cost is that the URL bar no longer auto-hides while scrolling, since the document itself no
     longer scrolls — and it does not apply at all once the app is installed to the home screen. -->

const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im54anlwamdxc3l3eHVrY25jaG1oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxMTAzNzQsImV4cCI6MjA4OTY4NjM3NH0.Hh1GErLUxJbswFJGi8xVEzD60AUkRX0JVPgo91pdVKY';
