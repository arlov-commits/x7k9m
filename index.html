     toolbar/address-bar (and PWA status bar) background to the current theme color, updated
     live by updateThemeColor() on every render/theme switch. Default = ember theme --bg.
     NOTE: the Android navigation-button GLYPHS (back/home/recents) are OS-drawn and cannot

<meta name="mobile-web-app-capable" content="yes">

*{margin:0;padding:0;box-sizing:border-box}
/* Background also on <html> (carries data-theme): Chrome/Android tints the bottom OS nav bar from the root bg. */
html{background:var(--bg);transition:background var(--t-med) var(--ease)}
body{font-family:var(--font-sans);font-size:var(--fs-s);background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh;transition:background var(--t-med) var(--ease),color var(--t-med) var(--ease)}
.app{max-width:900px;margin:0 auto;padding:var(--sp-6) var(--sp-4) 80px}
.header{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:30px;flex-wrap:wrap}
.header h1{font-family:var(--font-serif);font-size:var(--fs-xl);font-weight:600;letter-spacing:-.02em}
.today-badge{font-family:var(--font-mono);font-size:var(--fs-2xs);color:var(--text-dim);background:var(--surface2);padding:3px 9px;border-radius:var(--r-pill)}
.combined-status{font-family:var(--font-mono);font-size:var(--fs-2xs);display:inline-flex;align-items:center;gap:5px;min-width:90px;transition:color var(--t-med) var(--ease)}
.status-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;transition:background var(--t-med) var(--ease)}
.combined-status.saved-online{color:var(--ok)}.combined-status.saved-online .status-dot{background:var(--ok)}
.combined-status.saving{color:var(--warning)}.combined-status.saving .status-dot{background:var(--warning);animation:pulse .8s infinite alternate}
.combined-status.syncing{color:var(--warning)}.combined-status.syncing .status-dot{background:var(--warning);animation:pulse .8s infinite alternate}
.combined-status.offline{color:var(--text-muted)}.combined-status.offline .status-dot{background:var(--danger)}
.combined-status.error{color:var(--danger)}.combined-status.error .status-dot{background:var(--danger)}
@keyframes pulse{from{opacity:.4}to{opacity:1}}
.theme-toggle{display:inline-flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);padding:5px 12px;border-radius:var(--r-pill);cursor:pointer;font-family:var(--font-sans);font-size:var(--fs-xs);font-weight:500;transition:color var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease)}
.theme-dot{width:10px;height:10px;border-radius:50%;background:var(--accent-bh);border:1px solid var(--border);flex-shrink:0}
.theme-toggle:hover{color:var(--text);border-color:var(--text-dim)}
.version-label{font-family:var(--font-mono);font-size:var(--fs-2xs);color:var(--text-muted);white-space:nowrap}
.subtitle{color:var(--text-dim);font-size:var(--fs-xs);margin-bottom:22px}
.tabs{display:flex;gap:2px;margin-bottom:22px;background:var(--surface);border-radius:var(--r-m);padding:3px;width:fit-content;border:1px solid var(--border);flex-wrap:wrap}
.tab{padding:7px 14px;border:none;background:0;color:var(--text-dim);font-family:var(--font-sans);font-size:var(--fs-xs);font-weight:600;cursor:pointer;border-radius:var(--r-s);transition:color var(--t-fast) var(--ease),background var(--t-fast) var(--ease)}
.tab:hover{color:var(--text)}.tab.active{background:var(--surface3);color:var(--text)}
.view{display:none}.view.active{display:block}
/* ---- Responsive navigation: mobile-first, swaps at 820px ---- */
.nav-ico,.bn-ico{flex-shrink:0}
.nav-icon{display:inline-block;width:22px;height:22px;flex-shrink:0;background-color:var(--text-dim);-webkit-mask:var(--icon) center/contain no-repeat;mask:var(--icon) center/contain no-repeat}
.bn-item .nav-icon{width:24px;height:24px}
.more-sheet-item .nav-icon{width:24px;height:24px;background-color:var(--text)}
.nav-item:hover .nav-icon,.nav-item.active .nav-icon,.bn-item.active .nav-icon{background-color:var(--text)}
.sidenav{display:none;position:fixed;top:0;left:0;bottom:0;width:208px;background:var(--surface);border-right:1px solid var(--border);flex-direction:column;padding:18px 12px;gap:3px;z-index:40;overflow-y:auto}
.sidenav-title{font-family:var(--font-sans);font-weight:700;font-size:var(--fs-2xs);color:var(--text-muted);letter-spacing:.05em;text-transform:uppercase;padding:4px 12px 14px}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:0;border:0;border-left:3px solid transparent;color:var(--text-dim);font-family:var(--font-sans);font-size:var(--fs-s);font-weight:600;padding:11px 12px;border-radius:var(--r-m);cursor:pointer;transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--surface3);color:var(--text);border-left-color:var(--accent-ab)}
.nav-item .nav-ico{font-size:var(--fs-m);width:22px;text-align:center}
.nav-spacer{flex:1 1 auto;min-height:8px}
.bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);z-index:40;padding-bottom:env(safe-area-inset-bottom,0)}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:0;border:0;border-top:2px solid transparent;color:var(--text-dim);font-family:var(--font-sans);font-size:var(--fs-2xs);font-weight:600;padding:8px 2px 7px;cursor:pointer}
.bn-item.active{color:var(--text);border-top-color:var(--accent-ab)}
.bn-item .bn-ico{font-size:var(--fs-l);line-height:1}
.more-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60}
.more-overlay.open{display:block}
.more-sheet{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);border-radius:var(--r-l) var(--r-l) 0 0;padding:8px 12px calc(14px + env(safe-area-inset-bottom,0));z-index:61;box-shadow:0 -6px 20px rgba(0,0,0,.3)}
.more-sheet-grip{width:40px;height:4px;border-radius:var(--r-pill);background:var(--surface3);margin:4px auto 8px}
.more-sheet-item{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:0;border:0;color:var(--text);font-family:var(--font-sans);font-size:var(--fs-s);font-weight:600;padding:14px 12px;border-radius:var(--r-m);cursor:pointer}
.more-sheet-item:hover,.more-sheet-item:active{background:var(--surface2)}
.more-sheet-item.active{background:var(--surface3)}
.more-sheet-item .nav-ico{font-size:var(--fs-m);width:24px;text-align:center}
.app{padding-bottom:calc(74px + env(safe-area-inset-bottom,0))}
@media(min-width:820px){
  .sidenav{display:flex}
  .bottomnav{display:none}
  body{padding-left:208px}
  .app{padding-bottom:80px}
  .more-overlay{display:none!important}
}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);width:fit-content;max-width:100%}
.legend-item{display:flex;align-items:center;gap:6px;font-size:var(--fs-xs);font-weight:600;color:var(--text-dim)}
.legend-dot{width:10px;height:10px;border-radius:var(--r-s)}
.legend-dot.bh{background:var(--accent-bh)}.legend-dot.wh{background:var(--accent-wh)}.legend-dot.cn{background:var(--accent-cn)}.legend-dot.ab{background:var(--accent-ab)}.legend-dot.life{background:var(--accent-life)}.legend-dot.events{background:var(--warning)}
.hide-day-btn{font-size:var(--fs-2xs);padding:1px 5px;border:1px solid var(--border);border-radius:var(--r-s);background:var(--surface2);color:var(--text-muted);cursor:pointer;margin-top:2px;opacity:.5;transition:opacity var(--t-fast) var(--ease)}.hide-day-btn:hover{opacity:1}
.expand-week-btn{font-size:var(--fs-2xs);padding:1px 6px;border:1px solid var(--border);border-radius:var(--r-s);background:var(--surface2);color:var(--text-muted);cursor:pointer;margin-left:8px;opacity:.6;transition:opacity var(--t-fast) var(--ease)}.expand-week-btn:hover{opacity:1}
.legend-hint{font-size:var(--fs-2xs);color:var(--text-muted);font-style:italic}

/* Dashboard */
.dash-table{display:grid;gap:10px;margin-bottom:24px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.dash-col-hdrs,.dash-grid-row{display:grid;gap:8px;padding:0 4px}
.dash-col-hdr{font-family:var(--font-serif);font-size:var(--fs-m);font-weight:600;text-align:center;padding:8px 4px;border-bottom:2px solid;border-radius:var(--r-s) var(--r-s) 0 0;min-width:130px}
.dash-col-hdr.bh{border-color:var(--accent-bh);color:var(--accent-bh)}.dash-col-hdr.wh{border-color:var(--accent-wh);color:var(--accent-wh)}.dash-col-hdr.cn{border-color:var(--accent-cn);color:var(--accent-cn)}.dash-col-hdr.ab{border-color:var(--accent-ab);color:var(--accent-ab)}
.dash-cell{background:var(--surface);border-radius:var(--r-m);padding:10px 12px;text-align:center;border:1px solid var(--border);min-height:60px;min-width:130px;display:flex;flex-direction:column;justify-content:center}
.dc-title{font-family:var(--font-serif);font-size:var(--fs-s);font-weight:600;margin-bottom:4px;word-wrap:break-word;overflow-wrap:break-word}
.dash-cell-empty{background:0;border:1px dashed var(--border);opacity:.3}
.dc-due{font-family:var(--font-mono);font-size:var(--fs-2xs);color:var(--text-dim)}
.dc-days{margin-top:2px;align-self:flex-start}
.dash-past{opacity:.4}
.dash-cell{position:relative}.dash-cell .dc-close{display:none;position:absolute;top:4px;right:4px;background:var(--surface3);border:1px solid var(--border);color:var(--text-muted);width:20px;height:20px;border-radius:50%;font-size:var(--fs-2xs);cursor:pointer;align-items:center;justify-content:center;line-height:1;z-index:5;transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease)}.dash-cell .dc-close:hover{background:var(--danger-dim);color:var(--danger);border-color:var(--danger)}.dash-cell.dc-active .dc-close{display:flex}
.dc-tag{display:inline-block;font-size:var(--fs-2xs);font-weight:700;text-transform:uppercase;padding:1px 5px;border-radius:var(--r-s);margin-top:4px}
.notes-box{background:var(--surface);border-radius:var(--r-m);padding:14px 18px;margin-bottom:20px;border:1px solid var(--border)}
.notes-box-title{font-weight:700;font-size:var(--fs-2xs);text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-bottom:6px}
.notes-box-text{font-size:var(--fs-s);color:var(--text-dim);line-height:1.7}
.notes-box-text strong{color:var(--text)}

/* Sprint */
.week-section{margin-bottom:26px}
.week-hdr{display:flex;align-items:baseline;gap:9px;margin-bottom:10px;padding-bottom:5px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.week-hdr .chip{font-size:var(--fs-2xs)}
.week-hdr.alloc-target{cursor:pointer}
.week-hdr.alloc-highlight{background:var(--warning-dim);border-radius:var(--r-s)}
.week-hdr .add-day-btn{font-size:var(--fs-2xs);padding:0 5px;line-height:1.4}
.week-hdr-title{font-family:var(--font-serif);font-size:var(--fs-l);font-weight:600}
.week-hdr-dates{font-family:var(--font-mono);font-size:var(--fs-2xs);color:var(--text-dim)}
.week-badge{font-size:var(--fs-2xs);font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:var(--r-s)}
.week-badge.current{color:var(--warning);background:var(--warning-dim)}.week-badge.break{color:var(--ok);background:var(--ok-dim)}

.task-bank{background:var(--surface);border:1px solid var(--accent-life);border-radius:var(--r-m);padding:10px 14px;margin-bottom:14px}
.task-bank-title{font-size:var(--fs-2xs);font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-life);margin-bottom:8px}
.bank-items{display:flex;flex-wrap:wrap;gap:6px}
.bank-chip{font-size:var(--fs-s);padding:9px 11px;border-radius:var(--r-m);font-weight:500;line-height:1.3;display:inline-flex;align-items:center;gap:6px;background:var(--accent-life-dim);color:var(--accent-life);border:1px solid transparent}
.bank-chip.allocating{border:1px solid var(--accent-life);animation:pulse2 1.2s infinite}
@keyframes pulse2{0%,100%{opacity:1}50%{opacity:.5}}
.bank-btn{width:24px;height:24px;border-radius:50%;border:none;font-size:var(--fs-2xs);cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--surface3);color:var(--text-dim);transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease);flex-shrink:0}
.bank-btn:hover{color:var(--text);background:var(--border)}
.bank-btn.alloc{background:var(--accent-life-dim);color:var(--accent-life)}.bank-btn.alloc:hover{background:var(--accent-life);color:#fff}
.bank-btn.done-btn{background:var(--ok-dim);color:var(--ok)}.bank-btn.done-btn:hover{background:var(--ok);color:#fff}
.bank-btn.remove-btn:hover{background:var(--danger-dim);color:var(--danger)}
.bank-empty{font-size:var(--fs-2xs);color:var(--text-muted);font-style:italic}

.day-row{display:grid;grid-template-columns:78px 1fr auto;gap:8px;margin-bottom:5px;padding:8px 10px;background:var(--surface);border-radius:var(--r-m);min-height:42px;border:2px solid transparent;transition:border-color var(--t-fast) var(--ease),background var(--t-fast) var(--ease);cursor:default}
.day-row.alloc-target{cursor:pointer}.day-row.alloc-target:hover{border-color:var(--accent-life);background:var(--surface2)}
.day-row.alloc-highlight{border-color:var(--accent-life);background:var(--surface2)}
.day-row.is-today{border-left:3px solid var(--warning)}
.day-left{display:flex;flex-direction:column;gap:1px}
.day-name{font-family:var(--font-serif);font-weight:600;font-size:var(--fs-m)}
.day-meta{font-family:var(--font-mono);font-size:var(--fs-2xs);color:var(--text-dim)}
.day-right{display:flex;align-items:center;gap:6px;min-width:70px;justify-content:flex-end}

/* Round + add button */
.add-day-btn{width:26px;height:26px;border-radius:50%;border:1px dashed var(--border);background:0;color:var(--text-muted);font-size:var(--fs-s);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:color var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease),background var(--t-fast) var(--ease);flex-shrink:0}
.add-day-btn:hover{color:var(--text-dim);border-color:var(--text-muted);background:var(--surface2)}

.day-tasks-area{display:flex;flex-wrap:wrap;gap:5px;min-height:28px;align-content:flex-start}

.chip{font-size:var(--fs-s);padding:9px 11px;border-radius:var(--r-m);font-weight:500;line-height:1.3;display:inline-flex;align-items:center;gap:5px;cursor:grab;position:relative;max-width:100%;transition:opacity var(--t-fast) var(--ease),transform var(--t-fast) var(--ease);user-select:none}
.chip:active{cursor:grabbing}.chip.dragging{opacity:.3;transform:scale(.95)}
.chip.bh{background:var(--accent-bh-dim);color:var(--accent-bh)}.chip.wh{background:var(--accent-wh-dim);color:var(--accent-wh)}.chip.cn{background:var(--accent-cn-dim);color:var(--accent-cn)}.chip.ab{background:var(--accent-ab-dim);color:var(--accent-ab)}.chip.life{background:var(--accent-life-dim);color:var(--accent-life)}.chip.events{background:var(--warning-dim);color:var(--warning)}
.chip.high{border:1px solid;font-weight:700}.chip.done{opacity:.35;text-decoration:line-through}
.chip[data-tip]::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);padding:3px 8px;background:var(--text);color:var(--bg);font-size:var(--fs-2xs);font-weight:600;border-radius:var(--r-s);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity var(--t-fast) var(--ease);z-index:20}
.chip[data-tip]:hover::after{opacity:1}
.chip-acts{display:none;position:absolute;top:-5px;right:-5px;gap:2px;z-index:10}
.chip:hover .chip-acts,.chip.menu-open .chip-acts{display:flex}
.chip.menu-activating .chip-acts{pointer-events:none}
.chip-btn:hover{opacity:1}
.chip-btn.life-return{background:var(--accent-life);color:#fff}
.chip-btn.life-complete{background:var(--ok);color:#fff}
.chip-btn.life-remove{background:var(--danger-dim);color:var(--danger)}.chip-btn.life-remove:hover{background:var(--danger);color:#fff}
.chip.drop-before{box-shadow:-3px 0 0 0 var(--accent-bh)}.chip.drop-after{box-shadow:3px 0 0 0 var(--accent-bh)}

.day-note-row{grid-column:1/-1;margin-top:1px}
.day-note-btn{font-size:var(--fs-2xs);color:var(--text-muted);cursor:pointer;background:0;border:0;font-family:var(--font-sans);padding:1px 0}.day-note-btn:hover{color:var(--text-dim)}
.day-note-input{width:100%;margin-top:3px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:var(--font-sans);font-size:var(--fs-s);padding:5px 9px;border-radius:var(--r-s);resize:vertical;min-height:28px}
.day-note-input:focus{outline:0;border-color:var(--text-dim)}

/* ---- Almanac (v9.1): day-cell footers + the continuous solar-term ribbon ----
   Every week lives in one .weeks-grid so a term ribbon can span week headers. Column-1
   items (headers, mobile summaries, day rows) carry an explicit grid-row, so hiding the
   summary at desktop width leaves an empty zero-height track instead of shifting rows.
   Names wrap rather than ellipsize — 天氣上升地氣下降 is eight characters and clipping a
   hou name is worse than an uneven row. */
/* grid-template-columns is written inline per tab: one ribbon column for Week, up to four for
   Season, and none at all when every ribbon layer is switched off. */
.weeks-grid{display:grid;column-gap:var(--alm-col-gap);row-gap:0;--alm-col-gap:var(--sp-2);--alm-stack-w:34px;--alm-lane-w:26px}
.week-section{display:contents}
/* Descendant, not child: .week-section is display:contents, so these are grid items but their
   DOM parent is the section. A child combinator here silently matches nothing and the rows fall
   to auto-placement, which lands them in the left flank's column. */
.weeks-grid .week-hdr,.weeks-grid .day-row,.weeks-grid .season-row{grid-column:var(--alm-content-col,1);min-width:0}
.week-section .week-hdr{margin-top:26px}
.weeks-grid .week-section:first-child .week-hdr{margin-top:0}
.day-almanac{grid-column:1/-1;display:flex;flex-direction:column;gap:2px;margin-top:5px;padding-top:5px;border-top:1px dotted var(--border)}
.alm-mk{display:inline-flex;align-items:baseline;gap:6px;flex-wrap:wrap;background:0;border:0;padding:0;margin:0;text-align:left;font-family:var(--font-sans);color:var(--text-dim);cursor:default}
.alm-tc{font-family:var(--font-serif);letter-spacing:.04em}
.alm-en{font-size:var(--fs-2xs);color:var(--text-muted)}
/* Day cells read English-first (v9.5), so the English carries the weight and the Chinese trails
   it a shade quieter. The vertical pills keep the opposite order and their own styling. */
.alm-mk.term{color:var(--accent-bh)}
.alm-mk.term .alm-en{font-size:var(--fs-s);font-weight:700;color:var(--accent-bh)}
.alm-mk.term .alm-tc{font-size:var(--fs-xs);font-weight:600;opacity:.85}
.alm-mk.hou .alm-en{font-size:var(--fs-xs);font-weight:600;color:var(--text-dim)}
.alm-mk.hou .alm-tc{font-size:var(--fs-xs);font-weight:600;color:var(--text-muted)}
/* The opening day of a 候 is called out; the days that merely continue it stay quiet. */
.alm-mk.hou.hou-start .alm-en{color:var(--accent-wh);font-weight:700}
.alm-mk.hou.hou-start .alm-tc{color:var(--accent-wh);opacity:.9}
/* Moon quarters carry no TC (v9.2), so the icon plus the English name IS the label — it is
   never the thing hidden behind a tap on mobile, or the marker would read as a bare glyph. */
.alm-mk.moon{color:var(--text-dim)}
.alm-mk.moon .alm-en{font-size:var(--fs-xs);font-weight:600;color:var(--text-dim)}
.alm-moon-ico{display:inline-flex;align-items:center;color:var(--text-dim);opacity:.85;transform:translateY(2px)}

/* The running solar-term ribbon. One element per unbroken run of days in a term, spanning its
   grid rows — including any week-header row it crosses, which is what keeps it continuous.
   The label is absolutely positioned so the ribbon contributes NO intrinsic height: a one-day
   run must never stretch its day row to fit a vertical name. */
/* Clipped with clip-path, NOT overflow:hidden: an overflow:hidden box is a scroll container, and
   the sticky label below would then stick to a box that never scrolls. clip-path only clips paint. */
/* Nested stacks (v9.8). Container and sub-pills share a grid column and overlap by design:
   the container paints first and the subs sit on top, inset, so the containment is literal.
   A container is only ever as tall as the runs it holds, so no z-index games are needed —
   DOM order alone puts the subs in front. */
.alm-pill{position:relative;min-height:0;margin-bottom:5px;
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-pill);
  clip-path:inset(0 round var(--r-pill))}
.alm-pill.pod{background:var(--surface3);border-color:var(--surface3)}
/* The label is absolutely positioned so a pill contributes NO intrinsic height: a one-day run
   must never stretch its row to fit a vertical name. Clipped with clip-path rather than
   overflow:hidden — an overflow:hidden box is a scroll container, and the sticky label below
   would then stick to a box that never scrolls. */
.alm-ribbon-inner{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center}
/* A pill can run weeks tall, so the name is sticky rather than centred once. */
.alm-ribbon-label{position:sticky;top:92px;display:flex;align-items:center;justify-content:center;
  gap:6px;padding:10px 0;writing-mode:vertical-rl;text-orientation:mixed}
/* English rides the vertical-rl flow with text-orientation:mixed. The TC is stacked one character
   per line in horizontal-tb instead of leaning on text-orientation:upright — same upright column
   visually, but it does not depend on the CJK font shipping vertical metrics, which some engines
   lack (the glyphs then collapse to zero advance). */
.alm-ribbon-label .alm-tc{writing-mode:horizontal-tb;font-size:var(--fs-m);font-weight:700;width:1em;
  word-break:break-all;line-height:1.15;text-align:center;letter-spacing:0}
.alm-ribbon-label .alm-en{font-size:var(--fs-2xs);white-space:nowrap;letter-spacing:.02em;opacity:.85}
/* One glyph per span: paired symbols in a single span do not reliably wrap inside a 1em box,
   so they get their own boxes and stack along the label's vertical flow. */
.alm-ribbon-label .alm-glyph{writing-mode:horizontal-tb;font-size:var(--fs-s);line-height:1.05;text-align:center}
/* Sub-pills are inset on the INNER side only, leaving a strip of the container showing along the
   outer edge of the column — that strip is where the container's own name runs, otherwise the
   subs would tile over it completely and the container would be invisible. */
.alm-pill.cap{margin:3px 3px 8px;border-radius:var(--r-pill);clip-path:inset(0 round var(--r-pill))}
.alm-pill.terms.cap{margin-right:22px}                 /* right column: container spine on the right */
.alm-pill.moonsign.cap{margin-left:22px}               /* left column: container spine on the left  */
.alm-pill.branch .alm-ribbon-inner{justify-content:flex-end}
.alm-pill.zodiac .alm-ribbon-inner{justify-content:flex-start}
.alm-pill.branch .alm-ribbon-label,.alm-pill.zodiac .alm-ribbon-label{padding-left:3px;padding-right:3px}
.alm-pill.terms{background:var(--accent-bh-dim);border-color:var(--accent-bh-dim)}
.alm-pill.terms .alm-ribbon-label{color:var(--accent-bh)}
.alm-pill.branch .alm-ribbon-label{color:var(--text-dim)}
.alm-pill.branch .alm-en{font-family:var(--font-serif);font-size:var(--fs-2xs);font-style:italic}
.alm-pill.branch .alm-tc{font-size:var(--fs-m);font-weight:700}
.alm-pill.zodiac .alm-ribbon-label{color:var(--text-dim)}
.alm-pill.zodiac .alm-en{font-size:var(--fs-2xs);letter-spacing:.09em;text-transform:uppercase}
.alm-pill.moonsign{background:var(--surface);border-color:var(--border)}
.alm-pill.moonsign .alm-ribbon-label{color:var(--text-muted)}
/* Western flank: three parallel tracks of one strip, pulled together over the column gaps so they
   meet on seams. Only the outer edges of the strip are rounded. Each track is told apart by its
   position, its fill, and the sticky glyph tag below — never by a glyph repeated on every pill. */
.alm-pill.track{border-color:var(--border)}
.alm-pill.track.first{margin-right:calc(var(--alm-col-gap) / -2);border-right:0;
  border-radius:var(--r-pill) 0 0 var(--r-pill);clip-path:inset(0 round var(--r-pill) 0 0 var(--r-pill))}
.alm-pill.track.mid{margin-left:calc(var(--alm-col-gap) / -2);margin-right:calc(var(--alm-col-gap) / -2);
  border-left:0;border-right:0;border-radius:0;clip-path:none}
.alm-pill.track.last{margin-left:calc(var(--alm-col-gap) / -2);border-left:0;
  border-radius:0 var(--r-pill) var(--r-pill) 0;clip-path:inset(0 round 0 var(--r-pill) var(--r-pill) 0)}
.alm-pill.track.sun{background:var(--surface3)}
.alm-pill.track.merc{background:var(--surface2)}
.alm-pill.track.moon{background:var(--surface)}
.alm-pill.track .alm-ribbon-label{color:var(--text-dim)}
.alm-pill.track.sun .alm-en{font-size:var(--fs-2xs);letter-spacing:.09em;text-transform:uppercase}
/* Retrograde is a modifier on Mercury's own pills: the ℞ plus a lighter, recessed fill. */
.alm-rx{writing-mode:horizontal-tb;font-family:var(--font-serif);font-size:var(--fs-s);font-weight:700;
  line-height:1;color:var(--danger)}
/* Sticky track tags. Emitted after the pills so they float above them, and pinned higher than the
   pill labels so the two never collide. */
.alm-lane-tag{position:relative;pointer-events:none;display:flex;justify-content:center}
.alm-lane-glyph{position:sticky;top:52px;font-size:var(--fs-m);line-height:1;color:var(--text-muted);
  background:var(--bg);border-radius:var(--r-pill);padding:3px 0 5px;width:100%;text-align:center}

/* Weather in the day cells (v9.8). Numbers use the mono face like every other figure in the app.
   An estimate beyond the forecast horizon is marked with a leading dot and dimmed, so a typical
   value never reads as a forecast. */
.wx{display:inline-flex;align-items:center;gap:9px;font-family:var(--font-mono);font-size:var(--fs-xs);
  color:var(--text-dim);white-space:nowrap}
.wx>span{display:inline-flex;align-items:center;gap:2px}
.wx .mi{width:11px;height:11px;vertical-align:0}
.wx-hi{font-weight:600;color:var(--text-dim)}
.wx-lo{color:var(--text-muted)}
.wx-pop{color:var(--accent-ab);opacity:.9}
.wx-est{opacity:.62;font-style:italic}
.wx-est::before{content:'·';margin-right:2px;font-style:normal;opacity:.8}
.wx-slot{min-width:0;white-space:nowrap}
.season-row .wx{font-size:var(--fs-2xs)}

/* Season rows (v9.4). No academic content means no chips, no note field and no add button, so
   the row collapses to a date plus that day's almanac laid out on one line. */
.season-row{display:grid;grid-template-columns:88px auto 1fr;gap:var(--sp-2);align-items:baseline;
  margin-bottom:3px;padding:5px 10px;background:var(--surface);border-radius:var(--r-s);
  border-left:3px solid transparent}
.season-row.is-today{border-left-color:var(--warning);background:var(--surface2)}
.season-date{font-family:var(--font-serif);font-weight:600;font-size:var(--fs-s);color:var(--text-dim);white-space:nowrap}
.season-row.is-today .season-date{color:var(--text)}
.season-marks{display:flex;flex-wrap:wrap;align-items:baseline;gap:1px var(--sp-3);min-width:0}
.season-hdr{margin-bottom:6px}
.season-grid{--alm-stack-w:46px;--alm-lane-w:26px}
.season-grid .week-section .week-hdr{margin-top:20px}
/* Season carries two ribbons where Week carries one, so on a phone they are narrowed and pulled
   together — otherwise they take a third of the width and the day rows wrap into tall blocks. */
@media(max-width:700px){
  /* Narrow: stack the date and its weather in the left column so the markers keep the width
     they need, rather than three columns fighting over ~240px. */
  .season-row{grid-template-columns:66px 1fr;padding:5px 8px;gap:0 var(--sp-2);align-items:start}
  .season-row .season-date{grid-column:1;grid-row:1}
  .season-row .wx-slot{grid-column:1;grid-row:2}
  .season-row .season-marks{grid-column:2;grid-row:1/3;min-width:0}
  /* Let the reading wrap inside the narrow left column instead of spilling over the markers. */
  .season-row .wx-slot{white-space:normal}
  .season-row .wx{flex-wrap:wrap;white-space:normal}
  .weeks-grid{--alm-stack-w:30px;--alm-col-gap:5px}
  .season-grid{--alm-stack-w:40px}       /* after .weeks-grid: same specificity, later wins */
  .alm-pill.terms.cap{margin-right:18px}
  .alm-pill.moonsign.cap{margin-left:18px}
}

/* Mobile carries the same almanac as the desktop (v9.3): the same ribbons, and both names on
   every marker. There is no narrow-width variant, no tap-to-reveal and no summary line — the
   earlier shorthand made the phone read differently from the browser. The only concession is
   letting the day-cell markers wrap onto a second line, which they already do. */

/* Life Tasks */
.life-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.life-title{font-family:var(--font-serif);font-size:var(--fs-l);font-weight:600}
.life-add-form{display:flex;gap:5px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.life-input{background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:var(--font-sans);font-size:var(--fs-s);padding:7px 10px;border-radius:var(--r-s)}
.life-input:focus{outline:0;border-color:var(--text-dim)}.life-input::placeholder{color:var(--text-muted)}
.life-select{background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:var(--font-sans);font-size:var(--fs-s);padding:6px 8px;border-radius:var(--r-s)}
.life-cat-group{margin-bottom:16px}
.life-cat-hdr{font-size:var(--fs-2xs);font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-bottom:6px;padding-bottom:3px;border-bottom:1px solid var(--border)}
.life-item{display:grid;grid-template-columns:auto 1fr auto auto auto auto auto;gap:6px;align-items:center;padding:9px 12px;background:var(--surface);border-radius:var(--r-m);border-left:3px solid var(--accent-life);margin-bottom:5px;min-height:44px}
.life-item.done-item{opacity:.4}.life-item.done-item .li-name{text-decoration:line-through}
.li-check{width:20px;height:20px;border-radius:var(--r-s);border:2px solid var(--border);background:0;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ok);font-size:var(--fs-2xs);transition:border-color var(--t-fast) var(--ease),background var(--t-fast) var(--ease);flex-shrink:0}
.li-check:hover{border-color:var(--ok)}.li-check.checked{background:var(--ok-dim);border-color:var(--ok)}
.li-name{font-size:var(--fs-s);font-weight:500}
.li-meta{font-family:var(--font-mono);font-size:var(--fs-2xs);color:var(--text-dim)}

.li-pri{font-size:var(--fs-2xs);font-weight:700;text-transform:uppercase;padding:2px 6px;border-radius:var(--r-s)}
.li-pri.high{background:var(--danger-dim);color:var(--danger)}.li-pri.med{background:var(--warning-dim);color:var(--warning)}.li-pri.low{background:var(--surface3);color:var(--text-muted)}
.li-send{width:28px;height:28px;border-radius:50%;border:1px solid var(--accent-life);background:var(--accent-life-dim);color:var(--accent-life);font-size:var(--fs-2xs);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease);flex-shrink:0;position:relative}
.li-send:hover{background:var(--accent-life);color:#fff}
.li-send.in-sprint{background:var(--surface3);border-color:var(--text-muted);color:var(--text-muted)}.li-send.in-sprint:hover{background:var(--warning-dim);color:var(--warning);border-color:var(--warning)}
.li-send[data-tip]::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);padding:3px 8px;background:var(--text);color:var(--bg);font-size:var(--fs-2xs);font-weight:600;border-radius:var(--r-s);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity var(--t-fast) var(--ease);z-index:20}
.li-send[data-tip]:hover::after{opacity:1}
.li-btns{display:flex;gap:3px}

/* Modal */
.modal-overlay{display:flex;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity var(--t-med) var(--ease)}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-l);padding:22px;width:340px;max-width:90vw;transform:scale(.95) translateY(6px);opacity:0;transition:transform var(--t-med) var(--ease),opacity var(--t-med) var(--ease);box-shadow:0 18px 50px rgba(0,0,0,.28)}
.modal-overlay.open .modal{transform:scale(1) translateY(0);opacity:1}
.modal-x{position:absolute;top:10px;right:10px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-s);color:var(--text-muted);line-height:1;cursor:pointer;padding:0;transition:color var(--t-fast) var(--ease),background var(--t-fast) var(--ease)}
.modal-x:hover{color:var(--text);background:var(--surface3)}
/* Syllabus quick-view popup (.pop) — centered, per proof-sheet-v8.1 */
.pop-scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity var(--t-med) var(--ease);z-index:110}
.pop-scrim.open{opacity:1;pointer-events:auto}
.pop{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-l);padding:var(--sp-5);width:min(440px,94vw);max-height:84vh;overflow-y:auto;transform:scale(.95) translateY(6px);opacity:0;transition:transform var(--t-med) var(--ease),opacity var(--t-med) var(--ease);box-shadow:0 18px 50px rgba(0,0,0,.28)}
.pop-scrim.open .pop{transform:scale(1) translateY(0);opacity:1}
.pop-head{display:flex;align-items:flex-start;gap:var(--sp-2)}
.pop-title{font-family:var(--font-serif);font-size:var(--fs-l);font-weight:600;line-height:1.2;flex:1}
.pop-x{flex-shrink:0;width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-s);color:var(--text-muted);cursor:pointer;padding:0}
.pop-x:hover{color:var(--text);background:var(--surface3)}
.pop-meta{display:flex;align-items:center;gap:var(--sp-2);margin:var(--sp-3) 0;flex-wrap:wrap}
.pop-due{font-family:var(--font-serif);font-weight:600;font-size:var(--fs-m)}
.pop-tag{font-family:var(--font-mono);font-size:var(--fs-2xs);font-weight:600;padding:3px 9px;border-radius:var(--r-pill)}
.pop-detail{font-size:var(--fs-s);color:var(--text-dim);white-space:pre-line;border-left:2px solid var(--border);padding-left:var(--sp-3);margin:var(--sp-3) 0 var(--sp-4);line-height:1.5}
.pop-detail .syl-bullet{padding-left:10px}.pop-detail .syl-sub-bullet{padding-left:22px;opacity:.85}
.pop-actions{display:flex;gap:var(--sp-2);flex-wrap:wrap}
.pop-btn{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-sans);font-size:var(--fs-s);font-weight:600;padding:8px 13px;border-radius:var(--r-s);border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;transition:background var(--t-fast) var(--ease)}
.pop-btn:hover{background:var(--surface3)}
.pop-btn.primary{background:var(--ok);border-color:var(--ok);color:#fff}
.pop-btn.on{background:var(--warning-dim);border-color:var(--warning);color:var(--warning)}
.pop-btn .mi{width:15px;height:15px}
.mi-lg{width:22px;height:22px}
.days.urgent{color:var(--danger)}.days.soon{color:var(--warning)}.days.ok{color:var(--ok)}.days.past{color:var(--text-muted);text-decoration:line-through}
.days{font-family:var(--font-mono);font-size:var(--fs-2xs);font-weight:600}
/* Brief highlight pulse on the target row when jumping Week -> Syllabus */
.syl-pulse td{animation:rowpulse 1.6s var(--ease)}
@keyframes rowpulse{0%{background-color:transparent}18%{background-color:var(--pulse-color,var(--accent-ab-dim))}100%{background-color:transparent}}
.evt-pulse{animation:evtpulse 1.6s var(--ease)}
@keyframes evtpulse{0%{box-shadow:0 0 0 0 var(--pulse-color,var(--accent-ab-dim))}22%{box-shadow:0 0 0 6px var(--pulse-color,var(--accent-ab-dim))}100%{box-shadow:0 0 0 0 transparent}}
/* Unified buttons (proof-sheet .btn system) */
.btn{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-sans);font-size:var(--fs-xs);font-weight:600;padding:8px 15px;border-radius:var(--r-s);cursor:pointer;border:1px solid transparent;transition:opacity var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease),background var(--t-fast) var(--ease)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--text);color:var(--bg)}
.btn-primary:hover{opacity:.85}
.btn-quiet{background:transparent;color:var(--text-dim);border-color:var(--border)}
.btn-quiet:hover{color:var(--text);border-color:var(--text-dim)}
.btn-danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn-ghost{width:32px;height:32px;padding:0;justify-content:center;background:transparent;color:var(--text-muted);border:0;border-radius:var(--r-s);cursor:pointer}
.btn-ghost:hover{background:var(--surface2);color:var(--text)}
.btn-ghost .mi{width:16px;height:16px}
/* Form grammar (.field/.frow) */
.frow{display:flex;gap:var(--sp-2);flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:3px}
.field>label{font-family:var(--font-mono);font-size:var(--fs-2xs);color:var(--text-muted);letter-spacing:.03em;text-transform:uppercase}
.field input,.field select{background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:var(--font-sans);font-size:var(--fs-s);padding:8px 11px;border-radius:var(--r-s);outline:none;transition:border-color var(--t-fast) var(--ease)}
.field input:focus,.field select:focus{border-color:var(--text-dim)}
.field .chk{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-s);cursor:pointer;padding:6px 0}
/* Single "optional" block wrapping the quieter event fields */
.opt-block{position:relative;border:1px dashed var(--border);background:var(--surface2);border-radius:var(--r-m);padding:15px 12px 12px;margin-top:12px}
.opt-block .opt-cap{position:absolute;top:-8px;left:12px;background:var(--surface);padding:0 6px;font-family:var(--font-mono);font-size:var(--fs-2xs);font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}
.evt-form{margin-bottom:18px}
.modal h3{font-family:var(--font-serif);font-size:var(--fs-l);margin-bottom:12px}
.modal label{display:block;font-family:var(--font-mono);font-size:var(--fs-2xs);font-weight:600;color:var(--text-muted);letter-spacing:.03em;text-transform:uppercase;margin-bottom:3px;margin-top:8px}

.syl-detail-edit:focus{outline:0;border-color:var(--text-dim)}

.syl-title-edit:focus{outline:0;border-color:var(--text-dim)}

   Old class names are aliased in so markup keeps working while
   styling has a single source of truth. Handlers untouched.

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-sans);font-size:var(--fs-xs);font-weight:600;padding:8px 15px;border-radius:var(--r-s);cursor:pointer;border:1px solid transparent;transition:opacity var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease),background var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
.btn:active{transform:scale(.97)}

.cal-pick-btn{border-left:0;border-radius:0 var(--r-s) var(--r-s) 0;padding:4px 8px;font-size:var(--fs-2xs)}
.syl-btns-cell .btn-ghost{opacity:.4;padding:1px 4px}.syl-btns-cell .btn-ghost:hover{opacity:1}
.note-move{line-height:1}.note-move:disabled{opacity:.2;cursor:default}
.note-del{margin-left:auto}

/* chip overlay micro-controls (no proof-sheet counterpart; deliberately kept specialized) */
.chip-btn{display:flex;align-items:center;justify-content:center;width:20px;height:20px;padding:0;border:0;cursor:pointer;border-radius:50%;background:var(--text);color:var(--bg);opacity:.85;font-size:var(--fs-2xs);transition:opacity var(--t-fast) var(--ease)}.chip-btn:hover{opacity:1;background:var(--text);color:var(--bg)}

.days.done{background:var(--ok-dim);color:var(--ok)}

/* fields — .field / .frow grammar */
.frow{display:flex;gap:var(--sp-2);flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-family:var(--font-mono);font-size:var(--fs-2xs);color:var(--text-muted);letter-spacing:.03em}
.field input,.field select{background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:var(--font-sans);font-size:var(--fs-s);padding:8px 11px;border-radius:var(--r-s);outline:none;transition:border-color var(--t-fast) var(--ease)}
.field input:focus,.field select:focus{border-color:var(--text-dim)}

@media(max-width:700px){.day-row{grid-template-columns:66px 1fr auto}.life-item{grid-template-columns:auto 1fr auto auto}.li-days{display:none}.li-send{width:24px;height:24px;font-size:var(--fs-2xs)}.evt-item{grid-template-columns:1fr auto auto;gap:4px}.evt-item .evt-date{grid-column:1/-1}.evt-info{text-align:left}.header{gap:4px;flex-wrap:wrap}.hdr-row1{display:flex;align-items:center;gap:6px;width:100%;flex-shrink:0}.hdr-row1 .combined-status{margin-left:auto}.hdr-row2{display:flex;align-items:center;gap:6px;width:100%}.hdr-row2 .theme-toggle{margin-left:auto}.syl-add-form .field label{display:none}.note-text{resize:both}.view[data-tab="syllabus"] .syl-table-wrap,.syl-table-outer{overflow-x:auto;-webkit-overflow-scrolling:touch}.syl-table{font-size:var(--fs-2xs)}.syl-table td{padding:5px 4px}}

@media (prefers-reduced-motion:reduce){.modal-overlay,.modal{transition-duration:1ms!important}}

function generateWeeks(){const weeks=[];
  // Window end: always at least 8 weeks past today, regardless of a stale maxFutureDate.
  const minEnd=new Date(TODAY);minEnd.setDate(minEnd.getDate()+8*7);
  const maxFut=state.maxFutureDate?parseDate(state.maxFutureDate):null;
  const end=(maxFut&&maxFut>minEnd)?maxFut:minEnd;
  // Window start: aligned semester start so past weeks remain available to expand,
  // but never later than the current week (so "this week" is always present).
  let curWeekStart=new Date(TODAY);curWeekStart.setDate(curWeekStart.getDate()-weekStartOffset(curWeekStart));
  let cur=alignedSemStart();if(cur>curWeekStart)cur=new Date(curWeekStart);
  let wk=semesterWeekNum(cur);
  while(cur<=end){const days=[];for(let i=0;i<7;i++){const d=new Date(cur);d.setDate(d.getDate()+i);if(d>end)break;days.push({date:isoDate(d),dateObj:new Date(d)})}weeks.push({num:wk,start:new Date(cur),end:new Date(cur.getTime()+6*864e5),days});cur.setDate(cur.getDate()+7);wk++}return weeks}

  perWeek.forEach(s=>{s.hdrRow=++row;s.days.forEach(d=>{rowOf[d.date]=++row})});
  return{alm,rowOf,allDays};
}

// The days of a week that actually reach the screen: manually hidden days and the not-yet-expanded
// past days of the current week drop out.
function visibleWeekDays(wk){
  const todayStr=isoDate(TODAY);
  const isCur=TODAY>=wk.start&&TODAY<=wk.end;
  const expandedPastDays=state.expandedPastDays||[];
  return wk.days.filter(day=>{
    if((state.hiddenDays||[]).includes(day.date))return false;
    if(isCur&&day.date<todayStr&&!expandedPastDays.includes(day.date))return false;
    return true;
  });
}

/* ============================================================
   ALMANAC (v9.1) — three cyclical layers over the Week tab.
   Both solar layers come from one number, the Sun's apparent ecliptic longitude λ☉: a
   solar term every 15°, a hou every 5°. Moon quarters come from the separate Meeus ch.49
   routine. Both name tables start at 立春 (λ=315°) and run forward.

   Where each layer lives:
     · solar term 節氣 — the running vertical ribbon, plus a marker on the day it flips
     · hou 候        — named at the base of every day cell, repeated for each of its days
     · moon quarter  — a marker on the day it falls (icon + English; no TC, per v9.2)

   One 5° pass covers both solar layers: every hou boundary is a crossing, and every third
   one opens a term, so there is deliberately no second pass at 15°. The tropical zodiac
   was dropped in v9.1; its table still ships in almanac-data.js and test-almanac.js still
   checks the 中氣 pairing.

   A day is one Newton solve at ~0.16 ms. Do not add caching or precomputed tables.
   ============================================================ */
const almWrap=l=>(((l-315)%360)+360)%360;              // degrees travelled since 立春
const almTermIndex=l=>Math.floor(almWrap(l)/15);        // -> AlmanacData.TERMS
const almHouIndex=l=>Math.floor(almWrap(l)/5);          // -> AlmanacData.HOU
function almReady(){return typeof Almanac!=='undefined'&&typeof AlmanacData!=='undefined'}
function almNextDay(key){const d=parseDate(key);d.setDate(d.getDate()+1);return isoDate(d)}

// Markers (what flips) + per-day ambient state, computed once for the whole visible run of days.
// Returns null whenever the almanac cannot be drawn, so callers just render nothing.
function computeWeekAlmanac(days,tab){
  if(!almReady()||!days||!days.length)return null;
  const L=almLayers();
  if(!L.terms&&!L.hou&&!L.moon&&!L.branch&&!L.zodiac&&!L.moonsign&&!L.mercury)return null;
  const tz=almTz();
  try{
    const jd0=Almanac.localNoonJD(days[0].date,tz)-0.5;                    // local midnight, first day
    const jd1=Almanac.localNoonJD(days[days.length-1].date,tz)+0.5;        // local midnight, day after last
    const markers={},crossings=[];
    if(L.terms||L.hou){
      for(const c of Almanac.longitudeCrossings(jd0,jd1,5)){
        const key=Almanac.localDateKey(c.jd,tz);
        const i=almHouIndex(c.deg+1e-6);                                   // epsilon guards the boundary:
        crossings.push({key,hou:i});                                       // λ returns equal to it within noise
        if(i%3===0&&L.terms)(markers[key]||(markers[key]=[])).push({kind:'term',index:i/3});
      }                                                                    // i%3===0 => this hou opens a term
    }
    if(L.moon){
      for(const m of Almanac.moonQuartersInRange(jd0,jd1)){
        const key=Almanac.localDateKey(m.jd,tz);
        (markers[key]||(markers[key]=[])).push({kind:'moon',index:m.phase});
      }
    }
    // A day belongs to the term and hou that BEGAN on or before it — the traditional 節氣日
    // reckoning, and the same day the fixtures record in la_date. So the state carries forward
    // from the last crossing rather than being resampled: a term that starts at 19:18 local
    // owns the whole of that day, which is what puts the ribbon's first day and the day-cell
    // flip marker on the same date instead of one day apart.
    // The baseline comes from LOCAL NOON of the first day (noon is unambiguous across a DST
    // shift, midnight is not); any crossing landing on that first day then overrides it.
    let cur=almHouIndex(Almanac.solarLongitude(Almanac.localNoonJD(days[0].date,tz)));
    let ci=0;
    const ambient=days.map(d=>{
      let opens=false;                                                     // does a hou begin today?
      while(ci<crossings.length&&crossings[ci].key<=d.date){if(crossings[ci].key===d.date)opens=true;cur=crossings[ci].hou;ci++}
      const noon=Almanac.localNoonJD(d.date,tz);
      const west=(tab==='season');
      const ms=(west&&L.moonsign&&Almanac.moonLongitude)?Math.floor(Almanac.moonLongitude(noon)/30):null;
      // Mercury: sign and direction in one key so a run breaks when EITHER changes — retrograde is
      // a modifier on the sign, not a layer of its own.
      const mk=(west&&L.mercury&&Almanac.mercuryLongitude)
        ?Math.floor(Almanac.mercuryLongitude(noon)/30)*2+(Almanac.mercuryRetrograde(noon)?1:0):null;
      return{date:d.date,term:Math.floor(cur/3),hou:cur,houStart:opens,moonSign:ms,merc:mk};
    });
    const byDate={};ambient.forEach(a=>{byDate[a.date]=a});
    return{markers,ambient,byDate};
  }catch(e){console.warn('Almanac unavailable for these weeks:',e);return null}
}


// ---- Almanac settings controls ----
let _almTzFilter='';                                     // filter text only; not part of state
function almTzList(){
  try{if(typeof Intl.supportedValuesOf==='function'){const v=Intl.supportedValuesOf('timeZone');if(v&&v.length)return v}}catch(e){}
  console.warn('Intl.supportedValuesOf("timeZone") unavailable — using the short fallback zone list');
  return ALM_TZ_FALLBACK;
}
function almTzOptionsHtml(filter){
  const cur=almTz(),f=(filter||'').trim().toLowerCase();
  let list=almTzList();
  if(f)list=list.filter(z=>z.toLowerCase().includes(f));
  if(!list.includes(cur))list=[cur,...list];             // the selected zone stays selectable
  const groups={};
  list.forEach(z=>{const r=z.includes('/')?z.split('/')[0]:'Other';(groups[r]||(groups[r]=[])).push(z)});
  return Object.keys(groups).sort().map(r=>`<optgroup label="${r}">${groups[r].map(z=>`<option value="${z}"${z===cur?' selected':''}>${z.replace(/_/g,' ')}</option>`).join('')}</optgroup>`).join('');
}
// Filtering rewrites the options in place — a full render would drop focus mid-typing.
function almTzFilterInput(v){_almTzFilter=v;const s=$('#almTzSelect');if(s)s.innerHTML=almTzOptionsHtml(v)}
function almSetTz(v){if(!v)return;state.almanacTz=v;render();scheduleSave()}
function almSetLayer(k,on){const L=almLayers();L[k]=!!on;state.almanacLayers=L;render();scheduleSave()}

// One day-cell marker. English leads and the Chinese follows (v9.5) — the reverse of the vertical
// pills, where the glyphs come first. `m.start` marks the opening day of a 候, which is styled
// apart from the days that merely continue it.
function almMarkerHtml(m){
  const D=AlmanacData;
  const open='<span class="alm-mk '+m.kind+(m.start?' hou-start':'')+'">'; // both names, every width
  if(m.kind==='term'){const t=D.TERMS[m.index];return open+`<span class="alm-en">${t.en}</span><span class="alm-tc">${t.tc}</span></span>`}
  if(m.kind==='hou'){const x=D.HOU[m.index];return open+`<span class="alm-en">${x.en}</span><span class="alm-tc">${x.tc}</span></span>`}
  const mo=D.MOON[m.index];                                // inline SVG, currentColor — no emoji
  return open+`<span class="alm-moon-ico">${mo.svg}</span><span class="alm-en">${mo.en}</span></span>`;
}

// The markers for one day, as a list. `opts` picks which layers this tab shows: the Week tab is
// academic and carries only the moon, while Season carries the term flip, the hou and the moon.
function almDayMarkers(alm,dateKey,opts){
  if(!alm)return[];
  const L=almLayers(),marks=alm.markers[dateKey]||[],a=alm.byDate[dateKey],out=[];
  if(opts.term)marks.forEach(m=>{if(m.kind==='term')out.push(almMarkerHtml(m))});
  if(opts.hou&&L.hou&&a)out.push(almMarkerHtml({kind:'hou',index:a.hou,start:a.houStart}));
  if(opts.moon)marks.forEach(m=>{if(m.kind==='moon')out.push(almMarkerHtml(m))});
  return out;
}
// Week-tab footer band. Emits nothing on days where nothing falls, so most rows are untouched.
function almDayFooterHtml(alm,dateKey){
  const out=almDayMarkers(alm,dateKey,{term:false,hou:false,moon:true});
  return out.length?`<div class="day-almanac">${out.join('')}</div>`:'';
}

/* Two nested stacks flank the day rows (v9.8). Each is a container pill with sub-pills sitting
   inside it, both placed in the SAME grid column and layered — container behind, subs inset on
   top — so the containment is literal rather than implied by two adjacent lanes.

     right, Chinese : 地支 branch month  contains  two 節氣 solar terms
     left,  western : Sun sign           contains  the Moon signs it spans

   Each pill is one unbroken run of days sharing a value, placed by explicit grid-row, so a run
   spans any week-header rows it crosses and meets its successor exactly as it would mid-week.
   A run still breaks when the visible days are not calendar-consecutive (a collapsed week between
   two expanded ones), since those days are adjacent in the grid but not in time.

   Branch and Sun sign are derived from the solar-term index rather than resampled, so they turn
   over on the same day the term does — the branch at each 節, the sign at each 中氣. The Moon
   sign is the one layer read from its own longitude, at local noon like everything else. */
const almBranchOfTerm=t=>Math.floor(t/2);                    // -> AlmanacData.BRANCHES
const almZodOfTerm=t=>Math.floor(((((t-3)%24)+24)%24)/2);    // -> AlmanacData.ZODIAC
const ALM_SUN='☉︎',ALM_MOON='☽︎',ALM_MERC='☿︎',ALM_RX='℞';   // text presentation, never emoji
const ALM_LANES={
  branch:{get:a=>almBranchOfTerm(a.term),
    lbl:i=>{const b=AlmanacData.BRANCHES[i];return{tip:b.tc+' '+b.en+' · from '+b.term,
      html:`<span class="alm-tc">${b.tc}</span><span class="alm-en">${b.en}</span>`}}},
  terms:{get:a=>a.term,
    lbl:i=>{const t=AlmanacData.TERMS[i];return{tip:t.tc+' · '+t.en,
      html:`<span class="alm-tc">${t.tc}</span><span class="alm-en">${t.en}</span>`}}},
  zodiac:{get:a=>almZodOfTerm(a.term),
    lbl:i=>{const z=AlmanacData.ZODIAC[i];return{tip:'Sun in '+z.name+' · from '+z.term,
      html:`<span class="alm-glyph">${z.glyph}</span><span class="alm-en">${z.name}</span>`}}},
  moonsign:{get:a=>a.moonSign,
    lbl:i=>{const z=AlmanacData.ZODIAC[i];return{tip:'Moon in '+z.name,
      html:`<span class="alm-glyph">${z.glyph}</span>`}}},
  mercury:{get:a=>a.merc,
    lbl:v=>{const z=AlmanacData.ZODIAC[v>>1],rx=v&1;return{tip:'Mercury in '+z.name+(rx?' — retrograde':' — direct'),
      html:`<span class="alm-glyph">${z.glyph}</span>`+(rx?`<span class="alm-rx">${ALM_RX}</span>`:'')}}}
};

// One layer's pills, as unbroken runs. `role` is pod (container), cap (nested) or solo.
function almRunsHtml(alm,rowOf,col,key,role,tab){
  const spec=ALM_LANES[key],runs=[];
  alm.ambient.forEach(a=>{
    const v=spec.get(a),last=runs[runs.length-1];
    if(v==null)return;
    if(last&&last.value===v&&almNextDay(last.endDate)===a.date)last.endDate=a.date;
    else runs.push({value:v,startDate:a.date,endDate:a.date});
  });
  return runs.map((r,ri)=>{
    const n=spec.lbl(r.value),r0=rowOf[r.startDate];
    if(!r0||!rowOf[r.endDate])return'';
    let end=rowOf[r.endDate]+1;
    const next=runs[ri+1];
    if(next&&almNextDay(r.endDate)===next.startDate&&rowOf[next.startDate])end=rowOf[next.startDate];
    // In the Season tab the term's Chinese text — and only that text — opens its reading. It is
    // given no affordance at all: no cursor change, no hover state, no tooltip of its own.
    let html=n.html;
    if(key==='terms'&&tab==='season')
      html=html.replace('<span class="alm-tc">',`<span class="alm-tc" onclick="event.stopPropagation();almOpenTermLink(${r.value})">`);
    return`<div class="alm-pill ${key} ${role}" style="grid-row:${r0}/${end};grid-column:${col}" title="${n.tip}"><div class="alm-ribbon-inner"><div class="alm-ribbon-label">${html}</div></div></div>`;
  }).join('');
}

// A nested stack for one column: container first so the sub-pills paint over it.
function almStackHtml(alm,rowOf,col,containerKey,subKey,tab){
  const L=almLayers();
  const hasC=containerKey&&L[containerKey],hasS=subKey&&L[subKey];
  if(!hasC&&!hasS)return'';
  let h='';
  if(hasC)h+=almRunsHtml(alm,rowOf,col,containerKey,hasS?'pod':'solo',tab);
  if(hasS)h+=almRunsHtml(alm,rowOf,col,subKey,hasC?'cap':'solo',tab);
  return h;
}

/* Builds both flanks plus the grid template.

   Right flank, Chinese: a nested container — 地支 holds its two 節氣, a genuine subset.
   Left flank, western: the Moon is NOT a subset of the Sun, and Mercury is subset of neither, so
   nesting would be a lie. They run instead as three parallel tracks of one strip, ordered slowest
   to fastest outward-to-inward (☉ Sun, ☿ Mercury, ☽ Moon) to match the right flank's logic. Which
   track is which is carried by POSITION plus a sticky glyph tag riding at the top of each track —
   never by a glyph repeated on every pill, which is unreadable once the Moon changes sign every
   two days. Retrograde is a modifier on Mercury's pills, not a track of its own.

   A stack with every layer off takes no column at all rather than leaving an empty gutter, so the
   content column index moves — it is published as --alm-content-col for the row rules to follow. */
const ALM_WEST=[{key:'zodiac',glyph:ALM_SUN,cls:'sun'},
                {key:'mercury',glyph:ALM_MERC,cls:'merc'},
                {key:'moonsign',glyph:ALM_MOON,cls:'moon'}];
function almFlanksHtml(alm,rowOf,tab){
  if(!alm)return{cols:'1fr',content:1,html:''};
  const L=almLayers();
  let west='',lanes=0;
  if(tab==='season'){
    const on=ALM_WEST.filter(w=>L[w.key]);
    on.forEach((w,i)=>{
      const col=1+i;
      const edge=on.length===1?'only':(i===0?'first':(i===on.length-1?'last':'mid'));
      west+=almRunsHtml(alm,rowOf,col,w.key,'track '+w.cls+' '+edge,tab);
      // The tag spans the whole column and is emitted after the pills, so its sticky glyph rides
      // above them and keeps naming the track however far you scroll.
      west+=`<div class="alm-lane-tag ${w.cls}" style="grid-column:${col};grid-row:1/-1" aria-hidden="true"><span class="alm-lane-glyph">${w.glyph}</span></div>`;
      lanes++;
    });
  }
  const contentCol=lanes+1;
  const east=tab==='season'
    ? almStackHtml(alm,rowOf,contentCol+1,'branch','terms',tab)
    : almStackHtml(alm,rowOf,contentCol+1,null,'terms',tab);
  const cols=(lanes?('var(--alm-lane-w) '.repeat(lanes)):'')+'1fr'+(east?' var(--alm-stack-w)':'');
  return{cols,content:contentCol,html:west+east};
}

/* ============================================================
   WEATHER (v9.8) — daily high / low / precipitation chance in the day cells.

   Open-Meteo, which needs no API key and sends CORS headers, so the browser can call it directly.
   Two horizons:
     · days 0-15   real forecast      (api.open-meteo.com/v1/forecast)
     · beyond that day-of-year normal (archive-api.open-meteo.com/v1/archive, last 3 full years
                                       averaged with a +/-3 day window; precipitation becomes the
                                       share of those days that were wet, i.e. a climatological
                                       chance rather than a forecast) — drawn in a quieter style
                                       and labelled as an average, never as a forecast.

   The network is never in the critical path: everything renders from a localStorage cache, a
   refresh is fired in the background, and a failed fetch simply leaves the last good data in
   place. The cache lives under its own key rather than in `state` so it never enters the sync
   snapshot or the change-detection diff — only the ZIP itself is user data.
   ============================================================ */
let _wx=null,_wxBusy=false;
function wxCache(){
  if(_wx)return _wx;
  try{_wx=JSON.parse(localStorage.getItem(WX_KEY)||'null')}catch(e){_wx=null}
  return _wx||(_wx={});
}
function wxSave(){try{localStorage.setItem(WX_KEY,JSON.stringify(_wx))}catch(e){}}

// ZIP -> coordinates. Open-Meteo's geocoder indexes postcodes; zippopotam is the fallback.
async function wxGeocode(zip){
  try{
    const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${zip}&count=1&country=US&language=en&format=json`);
    if(r.ok){const d=await r.json();const p=d&&d.results&&d.results[0];
      if(p)return{lat:p.latitude,lon:p.longitude,place:p.name+(p.admin1?', '+p.admin1:'')}}
  }catch(e){}
  try{
    const r=await fetch(`https://api.zippopotam.us/us/${zip}`);
    if(r.ok){const d=await r.json();const p=d&&d.places&&d.places[0];
      if(p)return{lat:+p.latitude,lon:+p.longitude,place:p['place name']+', '+p['state abbreviation']}}
  }catch(e){}
  return null;
}

async function wxRefresh(force){
  if(_wxBusy||!navigator.onLine)return;
  const zip=wxZip(),c=wxCache(),now=Date.now();
  const stale=force||c.zip!==zip||!c.days||(now-(c.fetchedAt||0))>WX_FRESH_MS;
  const normalsStale=force||c.zip!==zip||!c.normals||(now-(c.normalsAt||0))>WX_NORMALS_MS;
  if(!stale&&!normalsStale)return;
  _wxBusy=true;
  try{
    if(c.zip!==zip||!c.lat){
      const g=await wxGeocode(zip);
      if(!g){_wxBusy=false;return}
      _wx={zip,lat:g.lat,lon:g.lon,place:g.place};      // new place: drop the old readings
    }
    const{lat,lon}=_wx;
    if(stale){
      const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
        +`&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max`
        +`&temperature_unit=fahrenheit&timezone=auto&forecast_days=16`;
      const r=await fetch(u);
      if(r.ok){
        const d=(await r.json()).daily||{},days={};
        (d.time||[]).forEach((t,i)=>{days[t]={hi:d.temperature_2m_max[i],lo:d.temperature_2m_min[i],pop:d.precipitation_probability_max[i]}});
        if(Object.keys(days).length){_wx.days=days;_wx.fetchedAt=Date.now()}
      }
    }
    if(normalsStale){
      const y=new Date().getFullYear()-1;                // last three COMPLETE years
      const u=`https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}`
        +`&start_date=${y-2}-01-01&end_date=${y}-12-31`
        +`&daily=temperature_2m_max,temperature_2m_min,precipitation_sum`
        +`&temperature_unit=fahrenheit&timezone=auto`;
      const r=await fetch(u);
      if(r.ok){
        const d=(await r.json()).daily||{},bins={};
        (d.time||[]).forEach((t,i)=>{
          const hi=d.temperature_2m_max[i],lo=d.temperature_2m_min[i],pr=d.precipitation_sum[i];
          if(hi==null||lo==null)return;
          const md=t.slice(5);
          (bins[md]||(bins[md]=[])).push([hi,lo,pr>=0.2?1:0]);   // 0.2mm ~ a measurable day
        });
        const keys=Object.keys(bins);
        if(keys.length>300){
          const normals={};
          keys.forEach(md=>{
            const win=[];                                 // +/- 3 days smooths the sample
            for(let o=-3;o<=3;o++){
              const dt=new Date(Date.UTC(2001,+md.slice(0,2)-1,+md.slice(3)+o));
              const k=String(dt.getUTCMonth()+1).padStart(2,'0')+'-'+String(dt.getUTCDate()).padStart(2,'0');
              if(bins[k])win.push(...bins[k]);
            }
            if(!win.length)return;
            const n=win.length;
            normals[md]={hi:win.reduce((s,x)=>s+x[0],0)/n,lo:win.reduce((s,x)=>s+x[1],0)/n,
                         pop:win.reduce((s,x)=>s+x[2],0)/n*100};
          });
          _wx.normals=normals;_wx.normalsAt=Date.now();
        }
      }
    }
    wxSave();safeRender();
  }catch(e){/* offline or rate-limited: the cache stands */}
  _wxBusy=false;
}

// Reading for one day: the forecast if it reaches, otherwise the day-of-year normal.
function wxFor(dateKey){
  const c=wxCache();
  if(c.zip!==wxZip())return null;                        // cache belongs to a different ZIP
  const f=c.days&&c.days[dateKey];
  if(f&&f.hi!=null)return{hi:f.hi,lo:f.lo,pop:f.pop,est:false};
  const n=c.normals&&c.normals[dateKey.slice(5)];
  if(n)return{hi:n.hi,lo:n.lo,pop:n.pop,est:true};
  return null;
}
function wxSetZip(v){
  const z=(v||'').trim();
  if(!/^\d{5}$/.test(z)){safeRender();return}          // ignore junk, put the old value back
  if(z===wxZip())return;
  state.weatherZip=z;render();scheduleSave();wxRefresh(true);
}
function wxStatusText(){
  const c=wxCache();
  if(c.zip!==wxZip())return 'Looking up '+wxZip()+'…';
  const bits=[];
  if(c.place)bits.push(c.place);
  if(c.fetchedAt)bits.push('forecast updated '+new Date(c.fetchedAt).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}));
  else bits.push('no forecast yet');
  if(c.normals)bits.push('averages loaded');
  return bits.join(' · ');
}
/* Marks come from the app's own engraved icon set: the existing chevron for the high, the same
   chevron flipped for the low, and a new raindrop for precipitation. Anything under 10% is left
   off entirely — a 3% chance is noise, not information. */
function wxCellHtml(dateKey){
  const w=wxFor(dateKey);
  if(!w)return'';
  const pop=(w.pop!=null&&Math.round(w.pop)>=10)
    ?`<span class="wx-pop"><span class="mi" style="--ic:var(--ic-drop)"></span>${Math.round(w.pop)}%</span>`:'';
  return`<span class="wx${w.est?' wx-est':''}" title="${w.est?'Typical for this date — average of the last three years, not a forecast':'Forecast'}">`
    +`<span class="wx-hi"><span class="mi" style="--ic:var(--ic-up)"></span>${Math.round(w.hi)}°</span>`
    +`<span class="wx-lo"><span class="mi mi-flip" style="--ic:var(--ic-up)"></span>${Math.round(w.lo)}°</span>${pop}</span>`;
}

/* ---- Season tab (v9.4) ----
   The same weeks and the same days as the Week tab, so the two views stay row-for-row aligned,
   but with no academic content: each row is just the date and that day's almanac, which lets the
   cell be a fraction of the height. Ribbons: term, branch, sign, season. */
function renderSeason(){
  const sel=almWeekSelection();
  let h=`<div class="life-header"><span class="life-title">Season</span><span class="legend-hint">節氣 · 候 · 月建 · sign · moon</span></div>`;

/* Week and Season share one nav slot (v9.7). The slot remembers which of the two it is showing,
   so leaving for another tab and coming back returns to that same face; only pressing the slot
   while already on Week or Season flips it. Stored in state, hence localStorage — it is a
   per-device UI mode, so it is deliberately NOT in PROFILE_FIELDS and never syncs. */
function almSlot(){return state.weekSlot==='season'?'season':'sprints'}
function almSlotPress(){
  if(state.activeTab==='sprints'||state.activeTab==='season')almSwapTab();
  else switchTab(almSlot());
}

/* Crossing between the two keeps your place. The anchor is the first row fully in view; after the
   swap the page is scrolled so that same date sits back at the same offset. Both tabs draw the
   same days, so the date is normally present in both — the search for the next date on or after
   the anchor only matters if that ever stops being true. */
const ALM_ROWS='.day-row[data-date],.season-row[data-date]';
// Puts `date` back at `top` pixels down the viewport. Works from the row's absolute document
// offset (rect.top + scrollY) and scrolls to an absolute position: a relative scrollBy would be
// measured against a scroll offset the browser is about to clamp, because swapping tabs changes
// the document height under us.
function almAlignTo(date,top){
  const to=document.querySelector('.view.active');
  if(!to)return;
  const rows=[...to.querySelectorAll(ALM_ROWS)];
  const el=rows.find(r=>r.dataset.date===date)||rows.find(r=>r.dataset.date>=date)||rows[rows.length-1];
  if(!el)return;
  window.scrollTo(0,Math.max(0,el.getBoundingClientRect().top+window.scrollY-top));
}
function almSwapTab(){
  const from=document.querySelector('.view.active');
  let anchor=null;
  if(from){                                                  // anchor on the first row fully in view
    const rows=[...from.querySelectorAll(ALM_ROWS)];
    const hit=rows.find(r=>r.getBoundingClientRect().top>=0)||rows[rows.length-1];
    if(hit)anchor={date:hit.dataset.date,top:hit.getBoundingClientRect().top};
  }
  state.weekSlot=state.activeTab==='season'?'sprints':'season';   // set before render: the slot's
  switchTab(state.weekSlot);                                      // own label and icon change too
  if(!anchor)return;
  almAlignTo(anchor.date,anchor.top);                        // once now,
  requestAnimationFrame(()=>almAlignTo(anchor.date,anchor.top)); // once more after the reflow settles
}

let _evtColorMap=new Map();

function getSylForDate(dateStr){
  const chips=[];
  (state.syllabus||[]).forEach(s=>{
    if(s.done)return;
    const start=s.due,end=s.dueEnd||s.due;
    if(dateStr>=start&&dateStr<=end){
      const startD=parseDate(start),endD=parseDate(end),curD=parseDate(dateStr);
      const total=Math.round((endD-startD)/864e5)+1;
      const day=Math.round((curD-startD)/864e5)+1;
      const label=total>1?` (${day}/${total})`:'';
      chips.push({entry:s,label,cat:s.cat,type:s.type,title:s.title,dueTime:s.dueTime||''});
    }
  });
  return chips;
}

function normalizeDateInput(val){
  if(!val)return val;
  if(/^\d{4}-\d{2}-\d{2}$/.test(val))return val;
  const m=val.match(/^(\d{1,2})[\/\-](\d{1,2})$/);
  if(m)return new Date().getFullYear()+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0');
  const m2=val.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(m2){let y=parseInt(m2[3]);if(y<100)y+=2000;return y+'-'+m2[1].padStart(2,'0')+'-'+m2[2].padStart(2,'0')}
  return val;
}

function openCalPick(targetId){

  if(!picker){picker=document.createElement('input');picker.type='date';picker.id='_calPicker';picker.style.cssText='position:fixed;opacity:0;pointer-events:none;width:0;height:0;top:0;left:0';document.body.appendChild(picker)}
  const target=document.getElementById(targetId);
  const cur=target?normalizeDateInput(target.value.trim()):'';
  picker.value=cur||isoDate(TODAY);
  picker.onchange=()=>{if(target&&picker.value){target.value=picker.value}};
  picker.showPicker()
}

function parsedPreviewHtml(){if(!_parsedEvents.length)return'';let h=`<div class="parsed-hdr">${_parsedEvents.length} staged event${_parsedEvents.length>1?'s':''} — edit, merge, or remove before confirming</div>`;_parsedEvents.forEach((e,i)=>{const nd=!e.date;const canMerge=i<_parsedEvents.length-1;h+=`<div class="parsed-evt${nd?' needs-date':''}"><button class="btn-ghost xs del parsed-evt-del" onclick="removeParsedEvent(${i})" title="Remove"><span class="mi" style="--ic:var(--ic-x)"></span></button><div class="parsed-evt-grid"><div><span class="parsed-evt-label">Name</span><input value="${(e.name||'').replace(/"/g,'&quot;')}" oninput="_parsedEvents[${i}].name=this.value"/></div><div><span class="parsed-evt-label">Date${nd?' <span class="needs-date-flag">needs date</span>':''}</span><input type="date" value="${e.date}" oninput="_parsedEvents[${i}].date=this.value"/></div><div><span class="parsed-evt-label">End Date</span><input type="date" value="${e.endDate||''}" oninput="_parsedEvents[${i}].endDate=this.value"/></div><div><span class="parsed-evt-label">Start</span><input type="time" value="${e.startTime}" oninput="_parsedEvents[${i}].startTime=this.value"/></div><div><span class="parsed-evt-label">End</span><input type="time" value="${e.endTime}" oninput="_parsedEvents[${i}].endTime=this.value"/></div><div><span class="parsed-evt-label">Location</span><input value="${(e.location||'').replace(/"/g,'&quot;')}" oninput="_parsedEvents[${i}].location=this.value"/></div></div><div class="parsed-evt-acts">${canMerge?`<button class="btn btn-quiet parsed-act-btn" onclick="mergeDownParsed(${i})" title="Combine with the row below (fills blanks)"><span class="mi" style="--ic:var(--ic-merge)"></span> Merge down</button>`:''}<button class="btn btn-quiet parsed-act-btn" id="trainBtn-${i}" onclick="copyTrainingCase(${i})" title="Copy raw + parsed JSON for a training case"><span class="mi" style="--ic:var(--ic-dup)"></span> Copy training case</button></div></div>`});h+=`<div class $('#sDel').onclick=()=>{if(!confirm('Delete syllabus entry?'))return;state.syllabus=(state.syllabus||[]).filter(s=>s.id!==editSylId);$('#sylModal').classList.remove('open');render();scheduleSave()}
$('#sCanc').onclick=()=>{$('#sylModal').classList.remove('open')}
$('#sylModal').onclick=e=>{if(e.target.id==='sylModal')$('#sylModal').classList.remove('open')}

// ===== EXPORT / IMPORT =====
function exportState(){
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'planner-backup-' + isoDate(new Date()) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importState(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    try {
      const text = await file.text();
      const imported = JSON.parse(text);
      if(imported.tasks && imported.lifeTasks){
        applyChosenState(imported);
        migrateRecordIds();
        stripHoursField();
        render();
        scheduleSave();
        flushQueue();
        alert('Backup restored successfully!');
      } else {
        alert('Invalid backup file.');
      }
    } catch(err){
      alert('Error reading file: ' + err.message);
    }
  };
  input.click();
}
function bumpOverdueTasks(){const todayStr=isoDate(TODAY);let changed=false;const toReturn=state.tasks.filter(t=>!t.done&&t.date<todayStr);toReturn.forEach(t=>{if(t.lifeSourceId){const lt=state.lifeTasks.find(l=>l.id===t.lifeSourceId);if(lt){lt.inBank=true}}else{state.lifeTasks.push({id:genId(),name:t.name,category:'General',priority:t.priority==='high'?'high':'med',due:'',done:false,inBank:true})}changed=true});state.tasks=state.tasks.filter(t=>t.done||t.date>=todayStr);if(changed)scheduleSave()}
function migrateEventTasks(){const evtTasks=state.tasks.filter(t=>t.cat==='events');if(!evtTasks.length)return;if(!state.events)state.events=[];evtTasks.forEach(t=>{const exists=(state.events||[]).some(e=>e.name===t.name&&e.date===t.date);if(!exists){state.events.push({id:genId(),name:t.name,date:t.date,endDate:'',startTime:t.time||'',endTime:'',location:'',allDay:false})}});state.tasks=state.tasks.filter(t=>t.cat!=='events');scheduleSave()}
async function init(){await loadState();bumpOverdueTasks();migrateEventTasks();render();handleUrlAction();updateConn(navigator.onLine?'online':'offline');startSync();
  setInterval(()=>{if(document.visibilityState==='visible'&&navigator.onLine)syncPullAndMerge(false)},30000);
  window.addEventListener('online',()=>{updateConn('online');setTimeout(()=>{flushQueue().then(()=>syncPullAndMerge(false))},500);wxRefresh()});
  wxRefresh();                                    // background: renders from cache until it lands
  setInterval(()=>wxRefresh(),20*60*1000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wxRefresh()});
  window.addEventListener('offline',()=>updateConn('offline'));
  window.addEventListener('pagehide',flushQueueBeacon);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushQueueBeacon();else if(document.visibilityState==='visible'&&navigator.onLine){flushQueue().then(()=>syncPullAndMerge(false))}});
  if('serviceWorker' in navigator){
    const hadController=!!navigator.serviceWorker.controller;let swReloading=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(swReloading||!hadController)return;swReloading=true;location.reload()});
    navigator.serviceWorker.register('sw.js').then(reg=>{if(reg)reg.update()}).catch(e=>console.warn('SW reg failed:',e));
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')navigator.serviceWorker.getRegistration().then(r=>{if(r)r.update()})});
  }}
init();

</script>
