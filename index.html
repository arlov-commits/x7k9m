// ---- Per-record sync configuration ----
// Synced record collections: state key -> Supabase table (id text PK, data jsonb, updated_at, deleted_at).
const SYNC_COLLECTIONS=[
  {key:'tasks',table:'tasks'},
  {key:'events',table:'events'},
  {key:'syllabus',table:'syllabus'},
  {key:'lifeTasks',table:'life_tasks'},
  {key:'notes',table:'notes'},
  {key:'deliverables',table:'deliverables'}
];
// Data-meaningful singletons synced as one last-write-wins 'profile' row (SYNC_REFERENCE 1.7).
// sylMarks is the user's done/highlighted ticks against feed entries, keyed by the feed's derived
// id; sylFeedRange is the feed date range the semester window was last taken from. Both are
// singletons rather than per-record because neither is a record — they annotate a document that
// lives in the repo, not in the database.
/* sylMarks/sylEdits are per-ENTRY user data living inside a singleton blob, so whole-blob
   last-write-wins loses one device's stars to another's the moment both have pulled. They are
   merged per key instead (v13.4), against a sibling map of per-key write times: sylMarksAt /
   sylEditsAt. The stamps sit beside the values rather than inside them so sylMark()/sylEdit()/
   sylFeedEntries() keep their existing shapes, and so a key ABSENT from the value map but PRESENT
   in the stamp map is a tombstone — which is what lets un-starring propagate instead of being
   read as "this device just has nothing to say about that entry". Everything else here is a real
   singleton (one term, one timezone) where last-write-wins is the right answer. */
const PROFILE_MERGED={sylMarks:'sylMarksAt',sylEdits:'sylEditsAt'};
const PROFILE_FIELDS=['semesterStart','maxFutureDate','catOrder','hiddenDays','almanacTz','almanacLayers','houList','sylMarks','sylMarksAt','sylEdits','sylEditsAt','sylFeedRange'];
const SB_HEADERS={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};
const SEED_FLAG=SKEY+'-perrecord-seeded';
/* The profile is one last-write-wins blob, so a device that has never PULLED it must never push
   one: its push replaces the real row with this device's defaults. That is not hypothetical — a
   Cloudflare preview URL is a fresh ORIGIN, so localStorage is empty, and the syllabus feed (same
   host, edge-cached) beats Supabase every time. The feed lands, sylAdoptRange dirties the profile,
   and the queued push goes out carrying sylMarks:{} — every star and every feed edit gone, on every
   device. Worse, detectAndQueue stamps profileTs on the way, so the pull that finally arrives is
   declined as "not newer" and the emptiness sticks.
   So: hold the profile push until this origin has pulled once. An absent or older remote row still
   counts as pulled — a genuinely first device must be able to push. The change is kept locally and
   goes out as soon as the gate opens. */
const PROFILE_PULLED=SKEY+'-profilePulled';
function profilePullDone(){try{return !!localStorage.getItem(PROFILE_PULLED)}catch(e){return false}}
function markProfilePulled(){try{localStorage.setItem(PROFILE_PULLED,'1')}catch(e){}}
// Collision-resistant, client-generated, immutable record id (large Number; stored as text PK).
// Monotonic within a session (no same-device collisions); time+random keeps it unique across devices.
let _lastGen=0;
function genId(){let v=Date.now()*1000+Math.floor(Math.random()*1000);if(v<=_lastGen)v=_lastGen+1;_lastGen=v;return v}
// Deterministic id for legacy records that lack one (same across devices -> no duplicates on re-seed).
function deterministicId(coll,rec){const c={};for(const k in rec){if(k!=='updatedAt'&&k!=='id')c[k]=rec[k]}const s=coll+'|'+stableStringify(c);let h=5381;for(let i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))|0}return coll+'_'+(h>>>0).toString(36)}
// ---- Low-level REST: one row by id ----
async function sbUpsertRow(table,id,data,mode){const pref=mode==='ignore'?'resolution=ignore-duplicates':'resolution=merge-duplicates';try{const r=await fetch(SB_URL+'/rest/v1/'+table,{method:'POST',headers:{...SB_HEADERS,'Prefer':pref+',return=minimal'},body:JSON.stringify({id:String(id),data})});return r.ok}catch(e){return false}}
async function sbTombstoneRow(table,id){try{const r=await fetch(SB_URL+'/rest/v1/'+table+'?id=eq.'+encodeURIComponent(String(id)),{method:'PATCH',headers:{...SB_HEADERS,'Prefer':'return=minimal'},body:JSON.stringify({deleted_at:new Date().toISOString()})});return r.ok}catch(e){return false}}
async function sbPushProfile(mode){const data={};PROFILE_FIELDS.forEach(k=>{data[k]=state[k]});return sbUpsertRow('profile','default',data,mode)}
async function sbPull(table,wm){try{const q=wm?'?updated_at=gt.'+encodeURIComponent(wm)+'&select=*':'?select=*';const r=await fetch(SB_URL+'/rest/v1/'+table+q,{headers:SB_HEADERS});if(!r.ok)return null;return await r.json()}catch(e){return null}}
const TODAY=new Date();TODAY.setHours(0,0,0,0);
// Not classes: the two kinds a Week-tab pill can be that are not readings, plus the Custom bucket.
// Classes themselves are never named here — they are whatever the workbook's sheets are called, and
// the four hardcoded ones this app shipped with (bh/wh/cn/ab, spring 2026) are gone with the term
// they belonged to. A record still carrying one of those tags reads as Custom rather than as a
// stray token; nothing is rewritten in storage for it.
const CAT_NAMES={custom:'Custom',life:'Task',events:'Event'};
const CAT_SHORT={custom:'✎',life:'TSK',events:'EVT'};
const PRI_ORDER={high:0,med:1,low:2,normal:3};
// ---- Almanac settings (v9.0) ----
// Scope is the almanac strip ONLY. Tasks, events, countdowns and week boundaries keep using
// local browser time exactly as before — almanacTz must never leak into them.
const ALM_TZ_DEFAULT='America/Los_Angeles';
// terms/hou/moon apply to both tabs; branch and zodiac are the two halves of Season's merged pill.
// abhayagiri/drba are the two monastery calendars, Season tab only.
const ALM_LAYER_DEFAULT={terms:true,hou:true,moon:true,branch:true,zodiac:true,moonsign:true,mercury:true,
                         abhayagiri:true,drba:true};
// Fallback zone list for engines without Intl.supportedValuesOf (Safari < 15.4).
const ALM_TZ_FALLBACK=['America/Los_Angeles','America/Denver','America/Chicago','America/New_York',
  'America/Sao_Paulo','UTC','Europe/London','Europe/Paris','Europe/Berlin','Europe/Moscow',
  'Asia/Jerusalem','Asia/Kolkata','Asia/Bangkok','Asia/Shanghai','Asia/Hong_Kong','Asia/Taipei',
  'Asia/Tokyo','Asia/Seoul','Australia/Sydney','Pacific/Auckland'];
/* Which 72 候 list names the pentads. The Ukiah Valley list is the DEFAULT: this planner is used
   in one place, and a phenological calendar is only worth anything where its phenomena happen.
   The classical Chinese list stays selectable and is still what the fixtures verify — the two are
   interchangeable slot for slot, both starting at 立春 and running in 5° steps, so switching
   changes only the names, never a date. */
const ALM_HOU_DEFAULT='ukiah';
function almHouList(){return state.houList==='chinese'?'chinese':ALM_HOU_DEFAULT}
function almHouTable(){
  const D=(typeof AlmanacData!=='undefined')?AlmanacData:null;
  if(!D)return null;
  return(almHouList()==='ukiah'&&D.HOU_UKIAH)?D.HOU_UKIAH:D.HOU;
}
const ALM_HOU_LABEL={ukiah:'Ukiah Valley',chinese:'Classical Chinese'};
function almSetHouList(v){state.houList=(v==='chinese')?'chinese':'ukiah';render();scheduleSave()}
// Synced state can predate these keys; an undefined zone throws inside Intl.DateTimeFormat, so
// every read goes through these accessors rather than touching state directly.
function almTz(){const t=state.almanacTz;return(typeof t==='string'&&t)?t:ALM_TZ_DEFAULT}

function almLayers(){return{...ALM_LAYER_DEFAULT,...(state.almanacLayers||{})}}
function daysBetween(a,b){return Math.ceil((b-a)/864e5)}
function fmtDate(d){return['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]+' '+(d.getMonth()+1)+'/'+d.getDate()}
function fmtDateShort(d){return(d.getMonth()+1)+'/'+d.getDate()}
function isoDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parseDate(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function sameDay(a,b){return isoDate(a)===isoDate(b)}

function getSemStart(){return parseDate(state.semesterStart||'2026-01-17')}
function weekStartOffset(d){return(d.getDay()-state.weekStartDay+7)%7}
function alignedSemStart(){const s=getSemStart();const off=weekStartOffset(s);const d=new Date(s);d.setDate(d.getDate()-off);return d}
function semesterWeekNum(d){const diff=Math.round((d-alignedSemStart())/864e5);return Math.floor(diff/7)+1}
function semesterWeekStart(wkN){const s=alignedSemStart();const d=new Date(s);d.setDate(d.getDate()+(wkN-1)*7);return d}

function generateWeeks(){const weeks=[];
  // Window end: always at least 8 weeks past today, regardless of a stale maxFutureDate.
  const minEnd=new Date(TODAY);minEnd.setDate(minEnd.getDate()+8*7);
  const maxFut=state.maxFutureDate?parseDate(state.maxFutureDate):null;
  const end=(maxFut&&maxFut>minEnd)?maxFut:minEnd;
  // Window start: aligned semester start so past weeks remain available to expand,
  // but never later than the current week (so "this week" is always present).
  let curWeekStart=new Date(TODAY);curWeekStart.setDate(curWeekStart.getDate()-weekStartOffset(curWeekStart));
  let cur=alignedSemStart();if(cur>curWeekStart)cur=new Date(curWeekStart);
  let wk=semesterWeekNum(cur);
  while(cur<=end){const days=[];for(let i=0;i<7;i++){const d=new Date(cur);d.setDate(d.getDate()+i);if(d>end)break;days.push({date:isoDate(d),dateObj:new Date(d)})}weeks.push({num:wk,start:new Date(cur),end:new Date(cur.getTime()+6*864e5),days});cur.setDate(cur.getDate()+7);wk++}return weeks}

function defaultTasks(){return[]}

/* Nothing is seeded any more. A collection seeded here is not inert: on a device whose stored
   payload lacks the key, the seed rows are given ids and pushed as real records, so last spring's
   demo tasks, events and deliverables could reappear on every device at once. The planner's content
   comes from the workbook and from the user; a fresh install starts empty and syncs. */
function defaultLifeTasks(){return[]}
// Never rendered anywhere since v11.5 — the collection stays wired for sync so existing rows are
// not deleted out from under other devices, but nothing new is ever seeded into it.
function defaultDeliverables(){return[]}

function defaultEvents(){return[]}

// syllabus.js and merged in at render time. state.syllabus holds only what the user adds by hand
// here in the app, so a new term is a new spreadsheet rather than a new commit.
function defaultSyllabus(){return[]}

let state={theme:'ember',activeTab:'sprints',tasks:defaultTasks(),lifeTasks:defaultLifeTasks(),deliverables:defaultDeliverables(),events:defaultEvents(),syllabus:defaultSyllabus(),notes:[],catOrder:[],hiddenDays:[],sylMarks:{},sylMarksAt:{},sylEdits:{},sylEditsAt:{},sylFeedRange:'',nextId:4000,weekStartDay:6,semesterStart:'2026-01-17',maxFutureDate:'2026-05-30',weekSlot:'sprints',sylSlot:'syllabus',evtSlot:'events',miscSlot:'notes',almanacTz:ALM_TZ_DEFAULT,houList:ALM_HOU_DEFAULT,almanacLayers:{...ALM_LAYER_DEFAULT}};
let saveTimer=null,lastSaveTime=null,saveStatus='saved';
// localStorage is the source of truth: write there synchronously, then diff & queue per-record pushes.
function persistLocal(){try{localStorage.setItem(SKEY,JSON.stringify(state));localStorage.setItem(SKEY+'-time',new Date().toISOString())}catch(e){throw e}}
function scheduleSave(){saveStatus='saving';updateSI();try{detectAndQueue();persistLocal();lastSaveTime=new Date();saveStatus='saved';updateSI()}catch(e){saveStatus='error';updateSI()}if(saveTimer)clearTimeout(saveTimer);saveTimer=setTimeout(()=>{flushQueue()},800)}
// ---- Change detection: canonical snapshot (id -> content sans updatedAt) per collection ----
let _snap=null;
// Order-independent JSON: keys sorted at every level so field ORDER never affects a record's
// signature. Without this, the same logical record reshaped on another device (e.g. via
// applyChosenState's {lifeSourceId,...t}) hashed differently -> spurious re-uploads and,
// for id-less records, divergent deterministic ids -> cross-device duplicates.
function stableStringify(v){if(v===null||typeof v!=='object')return JSON.stringify(v);if(Array.isArray(v))return '['+v.map(stableStringify).join(',')+']';return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+stableStringify(v[k])).join(',')+'}'}
function canonRec(rec){const c={};for(const k in rec){if(k!=='updatedAt')c[k]=rec[k]}return stableStringify(c)}
// Content signature ignoring id + updatedAt: groups records that are the same logical row.
function contentSig(rec){const c={};for(const k in rec){if(k!=='updatedAt'&&k!=='id')c[k]=rec[k]}return stableStringify(c)}
function isDetId(key,id){return String(id).startsWith(key+'_')}
// stableStringify, not JSON.stringify: after a merge two devices hold the same logical maps in
// whatever key order each happened to build them. Hashing that order would make every pull look
// like a change and push it straight back — a ping-pong between devices that never settles.
function canonProfile(){const o={};PROFILE_FIELDS.forEach(k=>{o[k]=state[k]});return stableStringify(o)}
function rebuildSnapshot(){_snap={profile:canonProfile()};for(const c of SYNC_COLLECTIONS){const m=new Map();(state[c.key]||[]).forEach(r=>{if(r.id!=null)m.set(String(r.id),canonRec(r))});_snap[c.key]=m}}
function detectAndQueue(){if(!_snap)rebuildSnapshot();for(const c of SYNC_COLLECTIONS){const arr=state[c.key];if(!Array.isArray(arr))continue;const snapMap=_snap[c.key]||(_snap[c.key]=new Map());const seen=new Set();arr.forEach(rec=>{if(rec.id==null)rec.id=deterministicId(c.key,rec);const sid=String(rec.id);seen.add(sid);const cur=canonRec(rec);if(snapMap.get(sid)!==cur){rec.updatedAt=Date.now();enqueue({op:'upsert',table:c.table,id:sid,data:rec});snapMap.set(sid,canonRec(rec))}});for(const sid of Array.from(snapMap.keys())){if(!seen.has(sid)){snapMap.delete(sid);enqueue({op:'delete',table:c.table,id:sid});addTombstone(c.key,sid)}}}const cp=canonProfile();
  // Leaving _snap.profile alone while gated is the point: the difference stays pending, so the
  // first detectAndQueue after the gate opens enqueues it. Stamping profileTs here would also
  // poison sbPullProfile's freshness test, so that waits too.
  if(cp!==_snap.profile&&profilePullDone()){_snap.profile=cp;localStorage.setItem(SKEY+'-profileTs',String(Date.now()));enqueue({op:'profile'})}}
// ---- Tombstones (local memory of deletions until they propagate) ----
function loadTomb(){try{return JSON.parse(localStorage.getItem(SKEY+'-tomb')||'{}')}catch(e){return{}}}

  for(let r=0;r<mx;r++){h+=`<div class="dash-grid-row" style="display:grid;grid-template-columns:${gc};gap:8px;margin-top:6px">`;activeCats.forEach(c=>{const s=groups[c][r];if(!s){h+=`<div class="dash-cell dash-cell-empty"></div>`;return}const dd=parseDate(s.due),dl=daysBetween(TODAY,dd),uc=dl<0?'past':dl===0?'today':dl<=3?'urgent':dl<=7?'soon':'ok',ds=dl<0?Math.abs(dl)+'d ago':dl===0?'TODAY':dl+'d';h+=`<div class="dash-cell${uc==='past'?' dash-past':''}" onclick="this.classList.toggle('dc-active')"><button class="dc-close" onclick="event.stopPropagation();dashUnstar(${s.id})" title="Un-highlight"><span class="mi" style="--ic:var(--ic-x)"></span></button><div class="dc-title">${escHtml(s.title)}</div><div class="dc-due">${fmtDate(dd)}</div><div class="days dc-days ${uc}">${ds}</div><span class="dc-tag" style="background:var(--accent-${c}-dim,var(--surface3));color:var(--accent-${c},var(--text-dim))">${s.type}</span></div>`});h+='</div>'}
  h+='</div>';return h}

function renderSprints(){const weeks=generateWeeks();const bankTasks=state.lifeTasks.filter(t=>t.inBank&&!t.done&&!state.tasks.some(s=>s.lifeSourceId===t.id));
// The legend follows the feed: one entry per class the spreadsheet defines, in its sheet order.
let h=`<div class="legend">${sylClasses().map(c=>`<div class="legend-item"><span class="legend-dot ${c.cat}"></span>${escHtml(c.alias)}</div>`).join('')}<div class="legend-item"><span class="legend-dot events"></span>Events</div><div class="legend-item"><span class="legend-dot life"></span>Tasks</div></div>`;
if(bankTasks.length||allocatingId){h+=`<div class="task-bank"><div class="task-bank-title">Task Bank${allocatingId?' — click a day to place':''}</div><div class="bank-items">`;if(!bankTasks.length)h+=`<span class="bank-empty">All placed. Send more from Tasks tab.</span>`;bankTasks.forEach(t=>{const isA=allocatingId===t.id;h+=`<div class="bank-chip ${isA?'allocating':''}">${t.name}<button class="bank-btn alloc" onclick="startAllocate(${t.id})" title="Place on a day"><span class="mi mi-flip" style="--ic:var(--ic-up)"></span></button><button class="bank-btn done-btn" onclick="bankComplete(${t.id})" title="Done"><span class="mi" style="--ic:var(--ic-check)"></span></button><button class="bank-btn remove-btn" onclick="bankRemove(${t.id})" title="Remove"><span class="mi" style="--ic:var(--ic-x)"></span></button></div>`});h+=`</div></div>`}
const sel=almWeekSelection();
if(sel.collapsedCount>0)h+=`<div style="margin-bottom:12px"><button class="expand-week-btn" onclick="expandAllPastWeeks()" style="font-size:var(--fs-2xs);padding:3px 10px">▼ ${sel.collapsedCount} past week${sel.collapsedCount>1?'s':''} (show)</button></div>`;

// Every week goes into ONE grid so a solar-term ribbon can span week headers without breaking.
// Ribbons are placed by explicit grid-row, so the run from the first to the last day of a term
// is a single element even when week headers sit between those rows. Headers and day rows carry
// an explicit grid-row too, so nothing is left to auto-placement alongside the spanning ribbons.
const g=almGridPlan(sel.perWeek,'sprints');
const fl=almFlanksHtml(g.alm,g.rowOf,'sprints');             // Week keeps only the 24 terms
h+=`<div class="weeks-grid" style="grid-template-columns:${fl.cols};--alm-content-col:${fl.content}">`;
sel.perWeek.forEach(s=>{h+=renderWeekSection(s.wk,s.days,g.alm,s.hdrRow)});
h+=fl.html+`</div>`;
return h}

// Which weeks and days reach the screen. Week and Season share this so their rows correspond
// one-to-one, which is what lets the term ribbon carry a scroll position between the two tabs.
function almWeekSelection(){
  const weeks=generateWeeks();
  const expandedPastWeeks=state.expandedPastWeeks||[];
  const pastWeeks=weeks.filter(wk=>wk.end<TODAY),activeWeeks=weeks.filter(wk=>wk.end>=TODAY);
  const epw=pastWeeks.filter(wk=>expandedPastWeeks.includes(wk.num));
  const shown=epw.concat(activeWeeks);
  return{perWeek:shown.map(wk=>({wk,days:visibleWeekDays(wk)})),collapsedCount:pastWeeks.length-epw.length};
}

// Assigns every header and day row its grid row, and computes the almanac once for the run.
function almGridPlan(perWeek,tab){
  const allDays=perWeek.reduce((a,s)=>a.concat(s.days),[]);
  const alm=computeWeekAlmanac(allDays,tab);
  const rowOf={};
  let row=0;
  perWeek.forEach(s=>{s.hdrRow=++row;s.days.forEach(d=>{rowOf[d.date]=++row})});
  return{alm,rowOf,allDays};
}

// The days of a week that actually reach the screen: manually hidden days and the not-yet-expanded
// past days of the current week drop out.
function visibleWeekDays(wk){
  const todayStr=isoDate(TODAY);
  const isCur=TODAY>=wk.start&&TODAY<=wk.end;
  const expandedPastDays=state.expandedPastDays||[];
  return wk.days.filter(day=>{
    if((state.hiddenDays||[]).includes(day.date))return false;
    if(isCur&&day.date<todayStr&&!expandedPastDays.includes(day.date))return false;
    return true;
  });
}

/* ============================================================
   ALMANAC (v9.1) — three cyclical layers over the Week tab.
   Both solar layers come from one number, the Sun's apparent ecliptic longitude λ☉: a
   solar term every 15°, a hou every 5°. Moon quarters come from the separate Meeus ch.49
   routine. Both name tables start at 立春 (λ=315°) and run forward.

   Where each layer lives:
     · solar term 節氣 — the running vertical ribbon, plus a marker on the day it flips
     · hou 候        — named at the base of every day cell, repeated for each of its days
     · moon quarter  — a marker on the day it falls (icon + English; no TC, per v9.2)

   One 5° pass covers both solar layers: every hou boundary is a crossing, and every third
   one opens a term, so there is deliberately no second pass at 15°. The tropical zodiac
   was dropped in v9.1; its table still ships in almanac-data.js and test-almanac.js still
   checks the 中氣 pairing.

   A day is one Newton solve at ~0.16 ms. Do not add caching or precomputed tables.
   ============================================================ */
const almWrap=l=>(((l-315)%360)+360)%360;              // degrees travelled since 立春
const almTermIndex=l=>Math.floor(almWrap(l)/15);        // -> AlmanacData.TERMS
const almHouIndex=l=>Math.floor(almWrap(l)/5);          // -> AlmanacData.HOU
function almReady(){return typeof Almanac!=='undefined'&&typeof AlmanacData!=='undefined'}
function almNextDay(key){const d=parseDate(key);d.setDate(d.getDate()+1);return isoDate(d)}

// Markers (what flips) + per-day ambient state, computed once for the whole visible run of days.
// Returns null whenever the almanac cannot be drawn, so callers just render nothing.
function computeWeekAlmanac(days,tab){
  if(!almReady()||!days||!days.length)return null;
  const L=almLayers();
  if(!L.terms&&!L.hou&&!L.moon&&!L.branch&&!L.zodiac&&!L.moonsign&&!L.mercury)return null;
  const tz=almTz();
  try{
    const jd0=Almanac.localNoonJD(days[0].date,tz)-0.5;                    // local midnight, first day
    const jd1=Almanac.localNoonJD(days[days.length-1].date,tz)+0.5;        // local midnight, day after last
    const markers={},crossings=[];
    if(L.terms||L.hou){
      for(const c of Almanac.longitudeCrossings(jd0,jd1,5)){
        const key=Almanac.localDateKey(c.jd,tz);
        const i=almHouIndex(c.deg+1e-6);                                   // epsilon guards the boundary:
        crossings.push({key,hou:i});                                       // λ returns equal to it within noise
        if(i%3===0&&L.terms)(markers[key]||(markers[key]=[])).push({kind:'term',index:i/3});
      }                                                                    // i%3===0 => this hou opens a term
    }
    if(L.moon){
      for(const m of Almanac.moonQuartersInRange(jd0,jd1)){
        const key=Almanac.localDateKey(m.jd,tz);
        (markers[key]||(markers[key]=[])).push({kind:'moon',index:m.phase});
      }
    }
    // A day belongs to the term and hou that BEGAN on or before it — the traditional 節氣日
    // reckoning, and the same day the fixtures record in la_date. So the state carries forward
    // from the last crossing rather than being resampled: a term that starts at 19:18 local
    // owns the whole of that day, which is what puts the ribbon's first day and the day-cell
    // flip marker on the same date instead of one day apart.
    // The baseline comes from LOCAL NOON of the first day (noon is unambiguous across a DST
    // shift, midnight is not); any crossing landing on that first day then overrides it.
    let cur=almHouIndex(Almanac.solarLongitude(Almanac.localNoonJD(days[0].date,tz)));
    let ci=0;
    const ambient=days.map(d=>{
      let opens=false;                                                     // does a hou begin today?
      while(ci<crossings.length&&crossings[ci].key<=d.date){if(crossings[ci].key===d.date)opens=true;cur=crossings[ci].hou;ci++}
      const noon=Almanac.localNoonJD(d.date,tz);
      const west=(tab==='season');
      const mlon=(west&&(L.moonsign||L.moon)&&Almanac.moonLongitude)?Almanac.moonLongitude(noon):null;
      const ms=(L.moonsign&&mlon!=null)?Math.floor(mlon/30):null;
      // Mercury: sign and direction in one key so a run breaks when EITHER changes — retrograde is
      // a modifier on the sign, not a layer of its own.
      const mk=(west&&L.mercury&&Almanac.mercuryLongitude)
        ?Math.floor(Almanac.mercuryLongitude(noon)/30)*2+(Almanac.mercuryRetrograde(noon)?1:0):null;
      // Elongation quadrant gives the phase between the quarters: 0-90 waxing crescent, 90-180
      // waxing gibbous, 180-270 waning gibbous, 270-360 waning crescent.
      const ph=(L.moon&&mlon!=null)
        ?Math.floor(((mlon-Almanac.solarLongitude(noon))%360+360)%360/90):null;
      return{date:d.date,term:Math.floor(cur/3),hou:cur,houStart:opens,moonSign:ms,merc:mk,phase:ph};
    });
    const byDate={};ambient.forEach(a=>{byDate[a.date]=a});
    return{markers,ambient,byDate};
  }catch(e){console.warn('Almanac unavailable for these weeks:',e);return null}
}


// ---- Almanac settings controls ----
let _almTzFilter='';                                     // filter text only; not part of state
function almTzList(){
  try{if(typeof Intl.supportedValuesOf==='function'){const v=Intl.supportedValuesOf('timeZone');if(v&&v.length)return v}}catch(e){}
  console.warn('Intl.supportedValuesOf("timeZone") unavailable — using the short fallback zone list');
  return ALM_TZ_FALLBACK;
}
function almTzOptionsHtml(filter){
  const cur=almTz(),f=(filter||'').trim().toLowerCase();
  let list=almTzList();
  if(f)list=list.filter(z=>z.toLowerCase().includes(f));
  if(!list.includes(cur))list=[cur,...list];             // the selected zone stays selectable
  const groups={};
  list.forEach(z=>{const r=z.includes('/')?z.split('/')[0]:'Other';(groups[r]||(groups[r]=[])).push(z)});
  return Object.keys(groups).sort().map(r=>`<optgroup label="${r}">${groups[r].map(z=>`<option value="${z}"${z===cur?' selected':''}>${z.replace(/_/g,' ')}</option>`).join('')}</optgroup>`).join('');
}
// Filtering rewrites the options in place — a full render would drop focus mid-typing.
function almTzFilterInput(v){_almTzFilter=v;const s=$('#almTzSelect');if(s)s.innerHTML=almTzOptionsHtml(v)}
function almSetTz(v){if(!v)return;state.almanacTz=v;render();scheduleSave()}
function almSetLayer(k,on){const L=almLayers();L[k]=!!on;state.almanacLayers=L;render();scheduleSave()}

// One day-cell marker. English leads and the Chinese follows (v9.5) — the reverse of the vertical
// pills, where the glyphs come first. `m.start` marks the opening day of a 候, which is styled
// apart from the days that merely continue it.
function almMarkerHtml(m){
  const D=AlmanacData;
  const open='<span class="alm-mk '+m.kind+(m.start?' hou-start':'')+'">'; // both names, every width
  if(m.kind==='term'){const t=D.TERMS[m.index];return open+`<span class="alm-en">${t.en}</span><span class="alm-tc">${t.tc}</span></span>`}
  if(m.kind==='hou'){const x=almHouTable()[m.index];return open+`<span class="alm-en">${x.en}</span><span class="alm-tc">${x.tc}</span></span>`}
  const mo=(m.kind==='phase'?D.MOON_MID:D.MOON)[m.index];  // inline SVG, currentColor — no emoji
  return open+`<span class="alm-moon-ico">${mo.svg}</span><span class="alm-en">${mo.en}</span></span>`;
}

// The markers for one day, as a list. `opts` picks which layers this tab shows: the Week tab is
// academic and carries only the moon, while Season carries the two solar openings and the moon.
// `opts.hou` is the day a 候 OPENS, not every day of it (v10.3) — the running state moved to its
// own vertical lane, so repeating the name in all five day cells was saying it four times too
// often. Both solar layers are therefore now only ever drawn on the day they turn over.
function almDayMarkers(alm,dateKey,opts){
  if(!alm)return[];
  const L=almLayers(),marks=alm.markers[dateKey]||[],a=alm.byDate[dateKey],out=[];
  if(opts.term)marks.forEach(m=>{if(m.kind==='term')out.push(almMarkerHtml(m))});
  if(opts.hou&&L.hou&&a&&a.houStart)out.push(almMarkerHtml({kind:'hou',index:a.hou,start:true}));
  const hadQuarter=marks.some(m=>m.kind==='moon');
  if(opts.moon)marks.forEach(m=>{if(m.kind==='moon')out.push(almMarkerHtml(m))});
  // Between the quarters the Season tab still names the phase; the Week tab shows only the
  // quarters themselves, which are the events worth planning around.
  if(opts.phase&&L.moon&&a&&a.phase!=null&&!hadQuarter)out.push(almMarkerHtml({kind:'phase',index:a.phase}));
  return out;
}
// Week-tab footer band. Emits nothing on days where nothing falls, so most rows are untouched.
function almDayFooterHtml(alm,dateKey){
  const out=almDayMarkers(alm,dateKey,{term:false,hou:false,moon:true,phase:false});
  return out.length?`<div class="day-almanac">${out.join('')}</div>`:'';
}

/* Two nested stacks flank the day rows (v9.8). Each is a container pill with sub-pills sitting
   inside it, both placed in the SAME grid column and layered — container behind, subs inset on
   top — so the containment is literal rather than implied by two adjacent lanes.

     right, Chinese : 地支 branch month  contains  two 節氣 solar terms
     left,  western : Sun sign           contains  the Moon signs it spans

   Each pill is one unbroken run of days sharing a value, placed by explicit grid-row, so a run
   spans any week-header rows it crosses and meets its successor exactly as it would mid-week.
   A run still breaks when the visible days are not calendar-consecutive (a collapsed week between
   two expanded ones), since those days are adjacent in the grid but not in time.

   Branch and Sun sign are derived from the solar-term index rather than resampled, so they turn
   over on the same day the term does — the branch at each 節, the sign at each 中氣. The Moon
   sign is the one layer read from its own longitude, at local noon like everything else. */
const almBranchOfTerm=t=>Math.floor(t/2);                    // -> AlmanacData.BRANCHES
const almZodOfTerm=t=>Math.floor(((((t-3)%24)+24)%24)/2);    // -> AlmanacData.ZODIAC
const ALM_SUN='☉︎',ALM_MOON='☽︎',ALM_MERC='☿︎',ALM_RX='℞';   // text presentation, never emoji
const ALM_LANES={
  branch:{get:a=>almBranchOfTerm(a.term),
    lbl:i=>{const b=AlmanacData.BRANCHES[i];return{tip:'',
      html:`<span class="alm-tc">${b.tc}</span><span class="alm-en">${b.en}</span>`}}},
  terms:{get:a=>a.term,
    lbl:i=>{const t=AlmanacData.TERMS[i];return{tip:'',
      html:`<span class="alm-tc">${t.tc}</span><span class="alm-en">${t.en}</span>`}}},
  // All three western tracks carry their sign's reading FOR THAT PLANET (v11.0): the same twelve
  // signs answer different questions depending on which body is in them, so ☉ Leo and ☽ Leo are
  // not the same statement. The tip is the hover convenience; tapping the pill opens the full card.
  zodiac:{get:a=>almZodOfTerm(a.term),
    lbl:i=>{const z=AlmanacData.ZODIAC[i];return{tip:almSignTip('sun',i),
      html:`<span class="alm-glyph">${z.glyph}</span><span class="alm-en">${z.name}</span>`}}},
  moonsign:{get:a=>a.moonSign,
    lbl:i=>{const z=AlmanacData.ZODIAC[i];return{tip:almSignTip('moon',i),
      html:`<span class="alm-glyph">${z.glyph}</span><span class="alm-en">${z.name}</span>`}}},
  mercury:{get:a=>a.merc,
    lbl:v=>{const z=AlmanacData.ZODIAC[v>>1],rx=v&1;return{tip:almSignTip('merc',v>>1),
      html:`<span class="alm-glyph">${z.glyph}</span>`+(rx?`<span class="alm-rx" title="${calEsc(ALM_RX+' Mercury retrograde — tap for what that means')}">${ALM_RX}</span>`:'')+`<span class="alm-en">${z.name}</span>`}}},
  // 候 is the fastest Chinese layer, the mirror of ☽ on the western side. A pentad name runs up to
  // eight characters in the classical list (天氣上升地氣下降), so the English is printed after it and
  // almFitLabels() takes it away again on any run too short to hold it — the same treatment the
  // Moon sign gets. The pill carries its full description: as a title for hover, and behind a tap
  // for touch, since a title attribute is unreachable without a pointer.
  hou:{get:a=>a.hou,
    lbl:i=>{const x=almHouTable()[i];return{
      tip:x.tc+' — '+x.en+(x.desc?'\n\n'+x.desc:''),
      html:`<span class="alm-tc">${x.tc}</span><span class="alm-en">${x.en}</span>`}}}
};

// One layer's pills, as unbroken runs. `role` is pod (container), cap (nested) or solo.
function almRunsHtml(alm,rowOf,col,key,role,tab){
  const spec=ALM_LANES[key],runs=[];
  alm.ambient.forEach(a=>{
    const v=spec.get(a),last=runs[runs.length-1];
    if(v==null)return;
    if(last&&last.value===v&&almNextDay(last.endDate)===a.date)last.endDate=a.date;
    else runs.push({value:v,startDate:a.date,endDate:a.date});
  });
  return runs.map((r,ri)=>{
    const n=spec.lbl(r.value),r0=rowOf[r.startDate];
    if(!r0||!rowOf[r.endDate])return'';
    let end=rowOf[r.endDate]+1;
    const next=runs[ri+1];
    if(next&&almNextDay(r.endDate)===next.startDate&&rowOf[next.startDate])end=rowOf[next.startDate];
    // In the Season tab the term's Chinese text — and only that text — opens its reading. It is
    // given no affordance at all: no cursor change, no hover state, no tooltip of its own.
    let html=n.html;
    if(key==='terms'&&tab==='season')
      html=html.replace('<span class="alm-tc">',`<span class="alm-tc" onclick="event.stopPropagation();almOpenTermLink(${r.value})">`);
    // Every flank pill is tappable in Season (v11.0), because a hover title is unreachable on a
    // phone and unreadable at four sentences. ℞ gets its own handler INSIDE the Mercury pill, and
    // stops the event so tapping the modifier explains retrograde rather than the sign.
    const SIGN={zodiac:'sun',mercury:'merc',moonsign:'moon'};
    let act='';
    if(tab==='season'){
      if(key==='hou')act=` onclick="event.stopPropagation();almOpenHouPop(${r.value})" role="button" tabindex="0"`;
      else if(SIGN[key])act=` onclick="event.stopPropagation();almOpenSignPop('${SIGN[key]}',${key==='mercury'?(r.value>>1):r.value})" role="button" tabindex="0"`;
    }
    if(key==='mercury'&&tab==='season')
      html=html.replace('<span class="alm-rx"','<span class="alm-rx" onclick="event.stopPropagation();almOpenRetroPop()" role="button" tabindex="0"');
    return`<div class="alm-pill ${key} ${role}" style="grid-row:${r0}/${end};grid-column:${col}"${n.tip?` title="${calEsc(n.tip)}"`:''}${act}><div class="alm-ribbon-inner"><div class="alm-ribbon-label">${html}</div></div></div>`;
  }).join('');
}

/* Builds both flanks plus the grid template.

   The two flanks MIRROR each other (v10.3). Each is a strip of three parallel tracks running
   coarsest on the outside to fastest on the inside, so the two sides read as the same instrument
   pointed at two traditions, and a given distance from the day cell means the same rate of change
   on either side:

     left,  western : ☉ Sun sign  ·  ☿ Mercury  ·  ☽ Moon sign        (~30d · weeks · ~2.5d)
     right, Chinese : 候 pentad   ·  節 solar term  ·  建 branch month  (5d · 15d · ~60d)

   The right flank used to nest 節氣 inside 地支 as a literal subset. That was true but it made the
   two sides look like different kinds of object, and it left the 候 with nowhere to live except
   repeated in every day cell. Parallel tracks on both sides costs the subset relationship — which
   is still exactly recoverable, two terms to a branch — and buys a symmetry that reads instantly.

   Which track is which is carried by POSITION plus a sticky glyph tag riding at the top of each
   one, never by a glyph repeated on every pill. Retrograde stays a modifier on Mercury's pills.

   A flank with every layer off takes no column at all rather than leaving an empty gutter, so the
   content column index moves — it is published as --alm-content-col for the row rules to follow. */
// `key` is the ambient layer this track draws; `pop` is the card it opens. They differ on the
// western side, where the layers are named for what they plot and the cards for the body itself —
// passing `key` where `pop` was wanted is exactly the bug that left these three tags dead.
const ALM_WEST=[{key:'zodiac',pop:'sun',glyph:ALM_SUN,cls:'sun'},
                {key:'mercury',pop:'merc',glyph:ALM_MERC,cls:'merc'},
                {key:'moonsign',pop:'moon',glyph:ALM_MOON,cls:'moon'}];
// Innermost first, so the fastest layer sits against the day cell on both sides.
const ALM_EAST=[{key:'hou',pop:'hou',glyph:'候',cls:'hou'},
                {key:'terms',pop:'terms',glyph:'節',cls:'term'},
                {key:'branch',pop:'branch',glyph:'建',cls:'branch'}];
// One flank: its tracks in column order, each with the sticky tag that names it. The tag is
// emitted after its pills so it floats above them however far you scroll.
function almTrackStripHtml(alm,rowOf,firstCol,lanes,tab){
  let h='';
  lanes.forEach((w,i)=>{
    const col=firstCol+i;
    const edge=lanes.length===1?'only':(i===0?'first':(i===lanes.length-1?'last':'mid'));
    h+=almRunsHtml(alm,rowOf,col,w.key,'track '+w.cls+' '+edge,tab);
    // The tag spans the column so its glyph can stay sticky, but only the glyph takes the tap.
    const pk=w.pop||w.key;
    const lane=(tab==='season')
      ? ` onclick="event.stopPropagation();almOpenLanePop('${pk}')" role="button" tabindex="0" title="${calEsc(almLaneTip(pk))}"`
      : '';
    h+=`<div class="alm-lane-tag ${w.cls}" style="grid-column:${col};grid-row:1/-1"><span class="alm-lane-glyph"${lane}>${w.glyph}</span></div>`;
  });
  return h;
}
function almFlanksHtml(alm,rowOf,tab){
  if(!alm)return{cols:'1fr',content:1,html:''};
  const L=almLayers();
  const westOn=(tab==='season')?ALM_WEST.filter(w=>L[w.key]):[];
  const west=almTrackStripHtml(alm,rowOf,1,westOn,tab);
  const lanes=westOn.length;
  const contentCol=lanes+1;
  // Week keeps a single 節氣 ribbon; Season gets the full mirrored strip.
  const eastOn=(tab==='season')?ALM_EAST.filter(w=>L[w.key]):(L.terms?[{key:'terms',glyph:'節',cls:'term'}]:[]);
  const east=(tab==='season')
    ? almTrackStripHtml(alm,rowOf,contentCol+1,eastOn,tab)
    : (eastOn.length?almRunsHtml(alm,rowOf,contentCol+1,'terms','solo',tab):'');
  // Season's east lanes are the same width as its west lanes — that equality IS the mirror. Week's
  // lone ribbon keeps the wider single-stack width it was designed at.
  const eastCols=(tab==='season')
    ? 'var(--alm-lane-w) '.repeat(eastOn.length)
    : (east?'var(--alm-stack-w)':'');
  const cols=(lanes?('var(--alm-lane-w) '.repeat(lanes)):'')+'1fr'+(eastCols?' '+eastCols.trim():'');
  return{cols,content:contentCol,html:west+east};
}

/* ============================================================
   MONASTERY CALENDARS (v10.2) — two published calendars over the local almanac.

   Abhayagiri keeps the Thai forest tradition's lunar calendar, DRBA the Chinese one, and the
   app's own engine computes the local astronomical moon. That is three reckonings of the same
   sky, and they routinely disagree by a day. NOTHING here reconciles them.

   The day cell is split into two bands rather than listed as one run of text (v10.2), because it
   carries two different KINDS of thing and mixing them is what made it unreadable:

     · the day's STATE — solar term, 候, and the moon. Quiet, small, ambient. It is true
       of the whole day and you read it at a glance or not at all.
     · what HAPPENS — observances, talks, festivals. Loud, chipped, one per line. These are
       appointments, and they are the reason to look at the row at all.

   A rule divides them, and it is only drawn on days that actually have events.

   The moon is stated ONCE for all three reckonings instead of once per layer. Agreeing sources
   are grouped onto a single reading and named beside it ("New Moon — local, Abhayagiri, DRBA");
   when they disagree the day simply shows two or three readings, each with its own sources. The
   attribution is dropped entirely on days where only one source speaks, which is most days, since
   naming a lone source tells you nothing. Only the local layer is drawn between the quarters —
   the monasteries publish new/quarter/full and nothing else, so a waxing gibbous is never put in
   their mouths, and an intermediate phase is therefore never grouped.

   Both are static published tables in calendars-data.js, not user data: they never enter `state`,
   never sync, and are precached by the service worker alongside the almanac. Season tab only.
   ============================================================ */
const CAL_SRC={
  abhayagiri:{table:'ABHAYAGIRI',cls:'abh',icon:'stupa',name:'Abhayagiri',accent:'ab'},
  drba:{table:'DRBA',cls:'drba',icon:'wheel',name:'DRBA',accent:'cn'}
};
function calReady(){return typeof CalendarData!=='undefined'&&!!CalendarData}
// A day's published entry, or null — outside a calendar's exported range every day is null and
// the layer simply draws nothing rather than implying the calendar is empty that day.
function calRec(src,dateKey){
  if(!calReady())return null;
  const t=CalendarData[CAL_SRC[src].table];
  return(t&&t[dateKey])||null;
}
const calEsc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* The day's moon, gathered from every reckoning that names one and grouped by what they say.
   Returns [{phase, mid, who:['local'|'abhayagiri'|'drba',…]}] in source order, local first.
   `mid` marks an intermediate phase, which only the local engine reports and so never groups. */
function calMoonReadings(alm,dateKey){
  const L=almLayers(),out=[];
  const add=(phase,mid,who)=>{
    const hit=out.find(r=>r.phase===phase&&r.mid===mid);
    if(hit)hit.who.push(who);else out.push({phase,mid,who:[who]});
  };
  if(L.moon&&alm){
    const q=(alm.markers[dateKey]||[]).filter(m=>m.kind==='moon');
    const a=alm.byDate[dateKey];
    if(q.length)q.forEach(m=>add(m.index,false,'local'));
    else if(a&&a.phase!=null)add(a.phase,true,'local');
  }
  ['abhayagiri','drba'].forEach(src=>{
    if(!L[src])return;
    const r=calRec(src,dateKey);
    if(r&&r.p!=null)add(r.p,false,src);
  });
  return out;
}
/* One moon reading, kept as terse as it can be and still be unambiguous (v10.3):

     · the phase icon always — it is the reading, and it is legible on its own
     · the phase NAME only for a local quarter. Local is the default and is never labelled, so a
       written name means "here"; the intermediate phases read fine from the icon alone and would
       otherwise put a line of prose on four days out of five.
     · a stupa/dharmachakra emblem for each monastery holding this reading. That is the whole
       attribution — writing "Abhayagiri · DRBA" out was the noisiest thing in the cell.

   The full sentence survives as the title, so nothing is lost to someone who stops to look. */
function calMoonRowHtml(r){
  const mo=(r.mid?AlmanacData.MOON_MID:AlmanacData.MOON)[r.phase];
  if(!mo)return'';
  const local=r.who.includes('local');
  const name=(local&&!r.mid)?`<span class="moon-name">${calEsc(mo.en)}</span>`:'';
  const badges=r.who.filter(w=>w!=='local').map(w=>{const s=CAL_SRC[w];
    return`<span class="cal-emblem ${s.cls}"><span class="mi" style="--ic:var(--ic-${s.icon})"></span></span>`}).join('');
  const who=r.who.map(w=>w==='local'?'local':CAL_SRC[w].name).join(', ');
  return`<div class="moon-row${r.mid?' mid':''}${r.who.length>1?' shared':''}" title="${calEsc(mo.en+' — '+who)}">`
    +`<span class="alm-moon-ico">${mo.svg}</span>${name}${badges}</div>`;
}
function calMoonBlockHtml(alm,dateKey){
  const rs=calMoonReadings(alm,dateKey);
  if(!rs.length)return'';
  return`<div class="moon-cluster">${rs.map(calMoonRowHtml).join('')}</div>`;
}

/* What happens on the day, as chips. A chip carries the emblem of whoever published it, so the
   event and its source are one object instead of an emblem governing a line.

   MIRRORING (v11.2). These calendars are read-only published tables, so a day's items are
   addressed positionally — source, date, index — rather than by embedding the title in an onclick.
   Several titles carry apostrophes (Venerable Master Hua's Entering Nirvana) and quoting them
   through an attribute is a bug waiting to happen. calDayItems is the single ordered list both
   the chip and the card index into, so the two can never disagree about what item 2 is. */
function calDayItems(src,dateKey){
  const r=calRec(src,dateKey);
  if(!r)return[];
  const out=[];
  // A `p` on an Abhayagiri day IS the observance, and it leads the day.
  if(src==='abhayagiri'&&r.p!=null)out.push({title:'Wan Phra',obs:true});
  (r.e||[]).forEach(e=>out.push({title:e,obs:false}));
  return out;
}
// The immutable handle for one published item. Stored on the mirrored event so either tab can find
// the other side of the pair.
const calEvtRef=(src,dateKey,title)=>src+'|'+dateKey+'|'+title;
function calRefAt(src,dateKey,i){
  const it=calDayItems(src,dateKey)[i];
  return it?calEvtRef(src,dateKey,it.title):'';
}
/* Unpack a mirror reference back into what Season knows about the item, so the Week tab can draw
   the copy exactly as the original: same emblem, same accent, and the same outlined treatment for
   an observance as opposed to a scheduled gathering. Returns null for anything that is not a
   mirror, which is how an ordinary event keeps its ordinary appearance. */
function calRefInfo(ref){
  if(!ref)return null;
  const cut=ref.indexOf('|'),cut2=ref.indexOf('|',cut+1);
  if(cut<0||cut2<0)return null;
  const src=ref.slice(0,cut),date=ref.slice(cut+1,cut2),title=ref.slice(cut2+1);
  const S=CAL_SRC[src];
  if(!S)return null;
  const it=calDayItems(src,date).find(x=>x.title===title);
  return{src,date,title,S,obs:!!(it&&it.obs)};
}
// The Week-tab event mirroring a published item, or null.
function calSentEvent(ref){return ref?((state.events||[]).find(e=>e.calRef===ref)||null):null}

/* Send one published item to the Week tab as a real event. It becomes an ordinary all-day event —
   editable, draggable, syncable like any other — that merely remembers where it came from. */
function calSend(src,dateKey,i){
  const items=calDayItems(src,dateKey),it=items[i];
  if(!it)return;
  const ref=calEvtRef(src,dateKey,it.title);
  _calArmed=null;                                      // the arrow has done its job
  if(calSentEvent(ref))return;                         // already there; nothing to do
  calFlash(ref);
  if(!state.events)state.events=[];
  state.events.push({id:genId(),name:it.title,date:dateKey,endDate:'',startTime:'',endTime:'',
                     location:'',allDay:true,calRef:ref});
  render();scheduleSave();
}
/* Cancel the mirror from either side. No confirm: it is one tap to put back, and the published
   item it came from is never touched — only the copy in the Week tab goes. */
function calUnsend(ref){
  if(!ref)return;
  _calArmed=null;calFlash(ref);
  state.events=(state.events||[]).filter(e=>e.calRef!==ref);
  render();scheduleSave();
}
function calUnsendAt(src,dateKey,i){calUnsend(calRefAt(src,dateKey,i))}
// Cancel from the Week tab, where the event's own id is the handle already to hand. Only a
// mirrored event is removable this way; an ordinary event keeps its normal delete-with-confirm.
function calUnsendEvent(id){
  const e=(state.events||[]).find(x=>x.id===id);
  if(!e||!e.calRef)return;
  calUnsend(e.calRef);
}

/* Tapping a chip ARMS it: a → appears in the slot at its right edge. Tapping that → sends it to
   the Week tab, and the → becomes an × in the same slot, which cancels the mirror.

   The slot is present on every chip at every moment and is always the same size — only its
   CONTENTS change, from nothing to → to ×. That is what keeps the pill from changing size when it
   is clicked or sent, which a popup-free affordance otherwise does by construction. An idle slot
   is hidden with visibility, not display, so it still occupies its width.

   Only one chip is armed at a time, and arming is transient UI state — never persisted, never
   synced. It is applied by toggling a class rather than re-rendering, so a tap costs nothing. */
let _calArmed=null,_calFlash=null;
/* Send and cancel go through render(), which replaces the node — so a CSS transition has nothing
   to run from. The changed chip is marked for one beat instead, and its class is dropped again
   afterwards without another render. Only the chip that actually changed animates; re-rendering
   for any other reason leaves every other chip still. */
function calFlash(ref){
  _calFlash=ref;
  setTimeout(()=>{
    _calFlash=null;
    document.querySelectorAll('.cal-flash').forEach(e=>e.classList.remove('cal-flash'));
  },560);
}
function calChipRef(el){return el?el.dataset.calRef||'':''}
function calSyncArmed(){
  document.querySelectorAll('.cal-evt').forEach(c=>{
    c.classList.toggle('armed',!!_calArmed&&c.dataset.calRef===_calArmed);
  });
}
// Tap the chip body: arm it, or disarm it if it was already the armed one.
function calArmChip(el){
  const ref=calChipRef(el);
  if(!ref)return;
  _calArmed=(_calArmed===ref)?null:ref;
  calSyncArmed();
}
// Anything else on the page dismisses a pending arrow, the way a menu would.
function calDisarm(){if(_calArmed){_calArmed=null;calSyncArmed()}}
function calActFromChip(btn){
  const el=btn.closest('.cal-evt');
  if(!el)return;
  const {src,date}=el.dataset,i=+el.dataset.i;
  if(el.classList.contains('sent'))calUnsendAt(src,date,i);
  else calSend(src,date,i);
}

function calEventChips(dateKey){
  const L=almLayers(),out=[];
  ['abhayagiri','drba'].forEach(src=>{
    if(!L[src])return;
    const s=CAL_SRC[src];
    calDayItems(src,dateKey).forEach((it,i)=>{
      const ref=calEvtRef(src,dateKey,it.title);
      const sent=!!calSentEvent(ref);
      const armed=(_calArmed===ref);
      const tip=sent?'On your Week tab. Tap the × to remove it from there.'
        :(armed?'Tap the → to send this to the Week tab.':'Tap to send this to the Week tab.');
      out.push(`<div class="cal-evt ${s.cls}${it.obs?' obs':''}${sent?' sent':''}${armed?' armed':''}${_calFlash===ref?' cal-flash':''}"`
        +` role="button" tabindex="0" data-cal-ref="${calEsc(ref)}" data-src="${src}" data-date="${dateKey}" data-i="${i}"`
        +` onclick="event.stopPropagation();calArmChip(this)"`
        +` title="${calEsc(it.title+' — '+s.name+'\n\n'+tip)}">`
        +`<span class="cal-emblem" aria-hidden="true"><span class="mi" style="--ic:var(--ic-${s.icon})"></span></span>`
        +`<span class="cal-evt-name">${calEsc(it.title)}</span>`
        +`<button class="cal-act" onclick="event.stopPropagation();calActFromChip(this)" tabindex="${sent||armed?0:-1}"`
        +` aria-label="${sent?'Remove from the Week tab':'Send to the Week tab'}"`
        +` title="${sent?'Remove from the Week tab':'Send to the Week tab'}">`
        +`<span class="cal-act-ico" aria-hidden="true">${sent?'\u00D7':'\u2192'}</span></button>`
        +`</div>`);
    });
  });
  return out;
}

// How far each published table actually reaches. Shown in settings so a stretch of empty days is
// legible as "the export ends here", not as a broken layer.
function calCoverageText(){
  if(!calReady())return'The monastery calendars did not load.';
  const f=k=>{const r=CalendarData.range&&CalendarData.range[k];
    return r?fmtDateShort(parseDate(r.start))+'/'+parseDate(r.start).getFullYear()%100+' → '+fmtDateShort(parseDate(r.end))+'/'+parseDate(r.end).getFullYear()%100:'—'};
  return`Published tables, not computed: Abhayagiri covers ${f('abhayagiri')}, DRBA covers ${f('drba')}. Days beyond those show nothing for that layer.`;
}

/* ---- Season tab (v9.4, recomposed v10.2) ----
   The same weeks and the same days as the Week tab, so the two views stay row-for-row aligned,
   but with no academic content. The Week tab's left-aligned day cell was dropped in v10.2: with a
   vertical flank on each side, the cell is a panel between two rules, and a centred stack sits in
   it far better than a ragged left edge. Every line is centred on the same axis — the date, the
   then one line per reckoning (local, Abhayagiri, DRBA), each under its own emblem. */
function renderSeason(){
  const sel=almWeekSelection();
  // Which 72 候 list is in force is stated at the top, because the two say very different things
  // about the same five days and there is no way to tell them apart from a single pentad.
  const hl=almHouList();
  let h=`<div class="life-header"><span class="life-title">Season</span><span class="legend-hint">節氣 · 候 · 月建 · sign · moon</span>`
    +`<span class="hou-src ${hl}" title="Which 72 候 list names the pentads. Change it in Settings → Almanac.">`
    +`<span class="hou-src-tc">候</span>${hl==='ukiah'?'NorCal · Ukiah Valley':'Classical Chinese'}</span></div>`;
  if(!almReady())return h+`<div class="notes-box"><div class="notes-box-text" style="font-size:var(--fs-xs);color:var(--text-muted)">The almanac engine did not load, so there is nothing to show here. A hard refresh usually fixes it.</div></div>`;
  if(sel.collapsedCount>0)h+=`<div style="margin-bottom:12px"><button class="expand-week-btn" onclick="expandAllPastWeeks()" style="font-size:var(--fs-2xs);padding:3px 10px">▼ ${sel.collapsedCount} past week${sel.collapsedCount>1?'s':''} (show)</button></div>`;
  const g=almGridPlan(sel.perWeek,'season');
  const fl=almFlanksHtml(g.alm,g.rowOf,'season');
  h+=`<div class="weeks-grid season-grid" style="grid-template-columns:${fl.cols};--alm-content-col:${fl.content}">`;
  sel.perWeek.forEach(s=>{
    h+=`<div class="week-section"><div class="week-hdr season-hdr" style="grid-row:${s.hdrRow}"><span class="week-hdr-title">Week ${s.wk.num}</span><span class="week-hdr-dates">${fmtDateShort(s.wk.start)} → ${fmtDateShort(s.wk.end)}</span></div>`;
    s.days.forEach((day,di)=>{
      const isT=sameDay(day.dateObj,TODAY);
      // Only the two solar OPENINGS reach the cell now; the running state lives in the flanks.
      const marks=almDayMarkers(g.alm,day.date,{term:true,hou:true,moon:false,phase:false});
      const evts=calEventChips(day.date);
      // Centred spine: the date. Everything else is placed around it —
      // the moon rides the top-left corner, `today` the top-right, and the two left-aligned bands
      // hang below. See the .season-row rules for why the corners are a three-column head rather
      // than absolute positioning.
      h+=`<div class="season-row ${isT?'is-today':''}" style="grid-row:${s.hdrRow+1+di}" data-date="${day.date}">`
        +`<div class="season-head">`
          +`<div class="season-corner left">${calMoonBlockHtml(g.alm,day.date)}</div>`
          +`<div class="season-date">${fmtDate(day.dateObj)}</div>`
          +`<div class="season-corner right">${isT?'<span class="today-tag">today</span>':''}</div>`
        +`</div>`
        +(marks.length?`<div class="season-opens">${marks.join('')}</div>`:'')
        +(evts.length?`<div class="season-events">${evts.join('')}</div>`:'')
        +`</div>`;
    });
    h+='</div>';
  });
  h+=fl.html+`</div>`;
  return h;
}

/* Names on the western tracks are printed optimistically and trimmed here, because whether one
   fits depends on how many day rows its run happens to span — a Moon sign can hold one day or
   three. Reads every measurement before writing any class, so the two passes cost one layout
   each rather than one per pill. Nothing else in the app depends on the result, so a missed run
   is cosmetic only. */
function almFitLabels(){
  const pills=[...document.querySelectorAll('.alm-pill.track')];
  if(!pills.length)return;
  const rows=pills.map(p=>({p,l:p.querySelector('.alm-ribbon-label')})).filter(r=>r.l);
  rows.forEach(r=>r.p.classList.remove('no-name','tight'));
  const m1=rows.map(r=>[r,r.l.scrollHeight,r.p.clientHeight]);              // one layout
  m1.forEach(([r,lh,ph])=>{if(lh>ph)r.p.classList.add('no-name')});
  const left=rows.filter(r=>r.p.classList.contains('no-name'));
  const m2=left.map(r=>[r,r.l.scrollHeight,r.p.clientHeight]);              // one more
  m2.forEach(([r,lh,ph])=>{if(lh>ph)r.p.classList.add('tight')});
}
let _fitTimer=null;
window.addEventListener('resize',()=>{clearTimeout(_fitTimer);_fitTimer=setTimeout(()=>{almFitLabels();sylFitTitles()},150)});

/* The one scrolling element in the app. The document itself no longer scrolls (the shell is exactly
   a viewport tall), so anything that used to read scrollY or call scrollTo reads and drives this. */
function scroller(){return document.getElementById('scroll')}



/* ---- Find ------------------------------------------------------------------------------------ */
/* A find that behaves the way the browser's own does — pinned while open, Enter and Shift+Enter to
   cycle, Escape to close, every match marked and the current one carried into view — but scoped to
   the planner's own tabs, which is what the browser's cannot do: seven of the eight tabs are in the
   DOM but display:none, so Ctrl+F finds nothing in them. With "all tabs" ticked, running past the
   last match in this tab opens the next tab that has one and continues there.
   Matching folds diacritics (Śūraṅgama matches "surangama") one character at a time, so the folded
   haystack stays the same length as the original and a hit's offsets still address the real text. */
const FIND_MAX=400;
let _find={open:false,q:'',hits:[],i:-1,tabCounts:{},all:false};
function findFold(str){let out='';
  for(const ch of str){const d=ch.normalize('NFD').replace(/[̀-ͯ]/g,'');
    out+=(d[0]||ch).toLowerCase()}
  return out}
function findOpen(){const bar=document.getElementById('findBar');if(!bar)return;
  _find.open=true;bar.classList.add('open');
  const inp=document.getElementById('findInput');inp.focus();inp.select();
  document.getElementById('findAll').checked=_find.all;
  if(_find.q)findRun(_find.q,true)}
function findClose(){const bar=document.getElementById('findBar');if(!bar)return;
  _find.open=false;bar.classList.remove('open');findClear();
  document.getElementById('findInput').blur()}
function findToggle(){_find.open?findClose():findOpen()}
// Unwrap every mark and stitch the split text nodes back together, so the DOM is exactly as it was.
function findClear(){document.querySelectorAll('mark.find-hit').forEach(m=>{
    const p=m.parentNode;if(!p)return;p.replaceChild(document.createTextNode(m.textContent),m);p.normalize()});
  _find.hits=[];_find.i=-1}
const FIND_SKIP={SCRIPT:1,STYLE:1,INPUT:1,TEXTAREA:1,SELECT:1,OPTION:1,MARK:1};
function findTextNodes(root){const out=[];
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
    if(!n.nodeValue||!n.nodeValue.trim())return NodeFilter.FILTER_REJECT;
    const p=n.parentElement;if(!p||FIND_SKIP[p.tagName])return NodeFilter.FILTER_REJECT;
    if(p.closest('.findbar'))return NodeFilter.FILTER_REJECT;
    // Hidden subtrees hold no matches a reader could see (collapsed weeks, the seven other tabs).
    if(!p.offsetParent&&getComputedStyle(p).position!=='fixed')return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT}});
  let n;while((n=w.nextNode()))out.push(n);return out}
// Marks every match in the open tab and returns them in document order.
function findMark(q){const root=document.querySelector('.view.active');if(!root||!q)return[];
  const fq=findFold(q),hits=[];
  for(const node of findTextNodes(root)){
    const text=node.nodeValue,folded=findFold(text);
    let from=0,idx;const ranges=[];
    while((idx=folded.indexOf(fq,from))!==-1){ranges.push(idx);from=idx+fq.length;
      if(hits.length+ranges.length>=FIND_MAX)break}
    if(!ranges.length)continue;
    // Split back to front so earlier offsets stay valid, but collect the marks THIS node produced
    // in their own array and append that: unshifting straight into `hits` also reversed the nodes
    // against each other, so the whole list came out in reverse document order and next/prev
    // stepped the wrong way up the page.
    const made=[];
    let tail=node;
    for(let k=ranges.length-1;k>=0;k--){
      const start=ranges[k];const mid=tail.splitText(start);mid.splitText(fq.length);
      const mk=document.createElement('mark');mk.className='find-hit';
      mid.parentNode.replaceChild(mk,mid);mk.appendChild(mid);made.unshift(mk)}
    for(const mk of made)hits.push(mk);
    if(hits.length>=FIND_MAX)break}
  return hits}
// Counts matches per tab without touching the DOM — used for "all tabs" and for the counter.
function findTabCounts(q){const out={};if(!q)return out;const fq=findFold(q);
  document.querySelectorAll('.view').forEach((v,i)=>{const t=FIND_TABS[i];if(!t)return;
    const folded=findFold(v.textContent||'');let n=0,from=0,idx;
    while((idx=folded.indexOf(fq,from))!==-1){n++;from=idx+fq.length;if(n>=FIND_MAX)break}
    if(n)out[t]=n});
  return out}
let FIND_TABS=[];   // filled by render(), in the order the .view elements are emitted
function findRun(q,keepIndex){
  findClear();_find.q=q;
  const trimmed=(q||'').trim();
  if(!trimmed){findPaint();return}
  _find.hits=findMark(trimmed);
  _find.tabCounts=findTabCounts(trimmed);
  if(_find.hits.length)_find.i=keepIndex&&_find.i>=0?Math.min(_find.i,_find.hits.length-1):0;
  else _find.i=-1;
  findPaint(true)}
function findPaint(scroll){
  const cnt=document.getElementById('findCount');
  _find.hits.forEach((m,k)=>m.classList.toggle('cur',k===_find.i));
  const cur=_find.hits[_find.i];
  if(cur&&scroll)cur.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
  if(!cnt)return;
  const total=Object.values(_find.tabCounts).reduce((a,b)=>a+b,0);
  const here=_find.hits.length;
  const elsewhere=_find.all?Math.max(0,total-here):0;

/* A syllabus title is whatever the spreadsheet says, and one row of it can run to a paragraph with
   a URL in the middle. In a day column ~150px wide that is a pill twenty lines deep, which buries
   the rest of the week. So a week pill's title is capped at ten rendered lines — and what comes out
   is the MIDDLE, not the end: the opening says what the reading is and the closing usually carries
   the page range, while the middle is the part you can lose. The full text stays in the Syllabus
   tab (and in the pill's tooltip, for a pointer).
   Ten *rendered* lines, not a character count, is why this measures instead of slicing: the same
   entry is four lines on a desktop row and twenty on a phone, so the cap simply never bites on a
   wide screen — no media query decides it. Binary search on how much text to keep, re-measuring
   each time, so a title that changes width as it shrinks still converges. Cosmetic only: a missed
   run leaves a long pill, nothing worse. */
const SYL_PILL_LINES=10;
function sylMidTrunc(str,keep){
  if(keep>=str.length)return str;
  const head=Math.ceil(keep*0.6),tail=keep-head;
  let a=str.slice(0,head),b=str.slice(str.length-tail);
  const ai=a.lastIndexOf(' ');if(ai>head*0.5)a=a.slice(0,ai);            // never cut mid-word
  const bi=b.indexOf(' ');if(bi>=0&&bi<tail*0.5)b=b.slice(bi+1);
  return[a.replace(/\s+$/,''),b.replace(/^\s+/,'')];
}
function sylFitTitles(){
  const els=[...document.querySelectorAll('.syl-t')];
  if(!els.length)return;
  // Restore anything a previous run cut (writes), then measure every pill (reads) — two passes, one
  // layout, the same discipline as almFitLabels. Only a pill over the cap pays for a search, and on
  // a normal week that is none of them.
  els.forEach(el=>{if(el.dataset.full){el.textContent=el.dataset.full;el.removeAttribute('title');delete el.dataset.full}});
  const caps=els.map(el=>(parseFloat(getComputedStyle(el).lineHeight)||16)*SYL_PILL_LINES+1);
  const hs=els.map(el=>el.getBoundingClientRect().height);
  els.forEach((el,i)=>{
    if(hs[i]<=caps[i])return;
    const full=el.textContent,cap=caps[i];
    el.dataset.full=full;el.title=full;
    const put=k=>{const[a,b]=sylMidTrunc(full,k);el.textContent='';
      el.append(a+' ',Object.assign(document.createElement('span'),{className:'syl-cut',textContent:'[…]'}),' '+b)};
    let lo=24,hi=full.length;                                  // lo is a length known to fit
    while(lo<hi){const mid=Math.ceil((lo+hi)/2);put(mid);
      if(el.getBoundingClientRect().height<=cap)lo=mid;else hi=mid-1}
    put(lo);
  });
}

   last on, which is why switchTab records it — arriving at a face by any route (the More sheet, a
   syllabus pill's "open in Syllabus", the term ribbon) leaves the slot showing where you are.

// offset (rect.top + scrollY) and scrolls to an absolute position: a relative scrollBy would be

   and nudges by the residual, repeating over the next few animation frames until two consecutive
   frames agree within half a pixel. A single scrollTo was accurate at the moment it ran but had
   nothing to say about a reflow arriving after it — almFitLabels adding a class, a webfont
   swapping in, the sticky flanks resolving — and any of those silently moved the row afterwards.
   Converging on the measurement instead of computing one offset makes the crossing robust to
   whatever settles late, now and in future. The pass cap stops it spinning when the target simply
   cannot be reached, i.e. the scroll is clamped at the end of a shorter document. */

function computeEvtColors(){const evts=(state.events||[]).filter(e=>e.date).slice().sort((a,b)=>a.date.localeCompare(b.date)||(a.startTime||'').localeCompare(b.startTime||''));const map=new Map();let idx=0,prevEnd=null;evts.forEach(e=>{const start=parseDate(e.date);if(prevEnd&&daysBetween(prevEnd,start)<5)idx=(idx+1)%6;else idx=0;map.set(e.id,idx);const end=parseDate(e.endDate||e.date);prevEnd=(prevEnd==null||end>prevEnd)?end:prevEnd});_evtColorMap=map}

function getEventsForDate(dateStr){
const evts=state.events||[];const chips=[];
evts.forEach(e=>{
const start=e.date,end=e.endDate||e.date;
if(dateStr>=start&&dateStr<=end){
const fmtT=t=>{if(!t)return'';const[h,m]=t.split(':');const hr=parseInt(h);return(hr>12?hr-12:hr||12)+':'+m+(hr>=12?'pm':'am')};
let label=e.name;

// ===== SYLLABUS FEED (v11.5) =====
// The syllabus is reference data now: one spreadsheet in the repo (calendars/source/syllabus.xlsx),
// read at runtime by syllabus.js and cached under its own localStorage key. Feed entries are merged
// in here, at render time, and never enter `state` — so they are never pushed through the
// per-record sync, and replacing the spreadsheet each term replaces the syllabus with it. What is

function sylClasses(){const f=(typeof sylFeed==='function')?sylFeed():null;return f&&f.classes?f.classes:[]}

function sylCatRank(cat){const c=sylClassOf(cat);return c?c.order:100}

function sylMark(id){return (state.sylMarks||{})[String(id)]||null}
/* A feed row belongs to the spreadsheet, but a row can arrive needing a hand: a paragraph where a
   title should be, a stray URL, a date the class moved by email. So an edit made here is kept as a
   PATCH over the feed row rather than as a copy of it — only the fields actually changed — and the
   row underneath stays whatever the spreadsheet says. Reset drops the patch and the feed's own text
   is back. Every other field keeps following the spreadsheet in the meantime, which a copy would
   not do.
   Keyed by the same derived id the ticks use, so editing that row's title or date in the
   spreadsheet mints a new id and the patch falls away with the tick — the same accepted trade for
   having no id column to maintain by hand. */
function sylEdit(id){const p=(state.sylEdits||{})[String(id)];return p&&Object.keys(p).length?p:null}

function sylSetEdit(id,patch){const k=String(id),raw=sylFeedRaw(id);if(!state.sylEdits)state.sylEdits={};
  const p={...(state.sylEdits[k]||{}),...patch};

  // and an untouched entry never carries a patch that pins it against a later spreadsheet change.
  SYL_EDITABLE.forEach(f=>{if(!(f in p))return;const base=f==='detail'?sylFeedDetail(raw):(raw?(raw[f]||''):'');if((p[f]||'')===base)delete p[f]});

function sylStamp(map,k){if(!state[map])state[map]={};state[map][k]=Date.now()}
function sylSetMark(id,field,val){const k=String(id);if(!state.sylMarks)state.sylMarks={};
  const m={...(state.sylMarks[k]||{})};if(val)m[field]=true;else delete m[field];

function sylFeedEntries(){const f=(typeof sylFeed==='function')?sylFeed():null;if(!f)return[];

function sylFeedRaw(id){const f=(typeof sylFeed==='function')?sylFeed():null;

// Every read of the syllabus goes through this: feed first, then whatever the user added by hand.
function sylAll(){return sylFeedEntries().concat(state.syllabus||[])}
function sylFind(id){return sylAll().find(s=>s.id===id)||null}
// A feed row carries more than a title. The citation keeps the existing detail slot; pages, where
// to get it, and the link read as small tags so the title line stays scannable.
function sylMetaHtml(e){if(!e.feed)return'';let h='';
  if(e.pages)h+=`<span class="syl-meta-tag">pp. ${escHtml(e.pages)}</span>`;

   wrote, note and all, since that is the text they were shown when they started editing. Composing

// feed's own date range changes. A range already adopted is left alone, so a deliberate change in
// Settings survives every subsequent load.
function sylAdoptRange(f){
  if(!f||!f.first||!f.last)return false;

function sylFeedBarHtml(){

function renderSyllabus(){

const todayStr=isoDate(TODAY);

if(pastWkNums.length){h+=`<div style="margin-bottom:14px"><button class="btn btn-quiet" onclick="toggleEl('sylPastWeeks')" style="opacity:.6;font-size:var(--fs-2xs)">${pastWkNums.length} past week${pastWkNums.length>1?'s':''} (show)</button></div><div id="sylPastWeeks" style="display:none">`}

/* Records left over from a term the workbook no longer defines. v12.0 took the retired classes out
   of the code, which is why these now read as Custom everywhere — but the records themselves are
   the user's data, held in the synced collections, and deleting them is theirs to authorise. So the
   app counts them and offers one sweep rather than purging on load behind their back.
   Two tests, and both are needed. One: a cat that is neither one of the workbook's classes nor one
   of the three kinds that are not classes — that is a class tag from a term that has ended. Two: a
   hand-added syllabus entry due before the workbook's own first date, which is how the spring
   entries filed under Custom are caught, Custom being a bucket that is still live. The second test
   is confined to hand-added syllabus entries: a task or a life task can be undated or long-running,
   and its date is nobody's evidence of which term it belongs to. Skipped entirely while the feed
   has not loaded — a missing workbook must never be read as "everything is old".
   The section removes itself once nothing matches. */
const LIVE_KINDS=['life','events','custom'];
function legacyCatRecords(){
  const out={syllabus:[],tasks:[],deliverables:[]},seen=new Set();
  for(const k in out){(state[k]||[]).forEach(r=>{const c=r&&r.cat;
    if(!c||LIVE_KINDS.includes(c)||sylClassOf(c))return;
    out[k].push(r);seen.add(c)})}
  const f=(typeof sylFeed==='function')?sylFeed():null;
  out.stale=[];
  if(f&&f.first)(state.syllabus||[]).forEach(r=>{
    if(!r||!r.due||r.due>=f.first||out.syllabus.includes(r))return;
    out.syllabus.push(r);out.stale.push(r)});
  out.total=out.syllabus.length+out.tasks.length+out.deliverables.length;
  out.cats=[...seen].sort();
  out.before=f&&f.first?f.first:'';
  return out}
function legacyCatSectionHtml(){
  const g=legacyCatRecords();
  if(!g.total)return'';
  const part=[['syllabus entries',g.syllabus.length],['tasks',g.tasks.length],['deliverables',g.deliverables.length]]
    .filter(p=>p[1]).map(p=>p[1]+' '+p[0]).join(', ');
  const why=[g.cats.length?'filed under '+g.cats.join(', ')+' — class tags the workbook no longer defines':'',
    g.stale.length?g.stale.length+' of them hand-added and due before the workbook’s first date ('+g.before+')':'']
    .filter(Boolean).join('; ');
  return `<div class="notes-box"><div class="notes-box-title">Retired Classes</div>
  <div class="settings-section"><label>${g.total} record${g.total>1?'s':''} from a past term</label>
  <div style="font-size:var(--fs-2xs);color:var(--text-muted);margin-bottom:8px">${escHtml(part)} — ${escHtml(why)}. They read as Custom everywhere until they are cleared. Back up first if you want them kept: this deletes them on every device.</div>
  <button class="btn btn-danger" onclick="clearLegacyCatRecords()">Clear ${g.total} record${g.total>1?'s':''}</button></div></div>`}
function clearLegacyCatRecords(){
  const g=legacyCatRecords();
  if(!g.total)return;
  if(!confirm('Delete '+g.total+' record'+(g.total>1?'s':'')+' from a past term?\n\n'
    +[['syllabus entries',g.syllabus.length],['tasks',g.tasks.length],['deliverables',g.deliverables.length]]
      .filter(p=>p[1]).map(p=>'  '+p[1]+' '+p[0]).join('\n')
    +'\n\nThis syncs to every device and cannot be undone here. Settings → Backup first if in doubt.'))return;
  // Deleting from the array IS the delete: detectAndQueue turns each disappearance into a per-record
  // delete with a tombstone, the same path the row-level delete buttons take. (SYNC_REFERENCE 1.6)
  ['syllabus','tasks','deliverables'].forEach(k=>{const ids=new Set(g[k].map(r=>String(r.id)));
    if(ids.size)state[k]=(state[k]||[]).filter(r=>!ids.has(String(r.id)))});
  render();scheduleSave()}

function getSylForDate(dateStr){
  const chips=[];
  // Done entries are kept: completing one from the Week tab strikes it through where it sits
  // rather than making it vanish out from under the finger that ticked it.
  sylAll().forEach(s=>{
    const start=s.due,end=s.dueEnd||s.due;
    if(dateStr>=start&&dateStr<=end){
      const startD=parseDate(start),endD=parseDate(end),curD=parseDate(dateStr);
      const total=Math.round((endD-startD)/864e5)+1;
      const day=Math.round((curD-startD)/864e5)+1;
      const label=total>1?` (${day}/${total})`:'';
      chips.push({entry:s,label,cat:s.cat,type:s.type,title:s.title,dueTime:s.dueTime||''});
    }
  });
  return chips;
}

function normalizeDateInput(val){
  if(!val)return val;
  if(/^\d{4}-\d{2}-\d{2}$/.test(val))return val;
  const m=val.match(/^(\d{1,2})[\/\-](\d{1,2})$/);
  if(m)return new Date().getFullYear()+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0');
  const m2=val.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(m2){let y=parseInt(m2[3]);if(y<100)y+=2000;return y+'-'+m2[1].padStart(2,'0')+'-'+m2[2].padStart(2,'0')}
  return val;
}

/* Every category picker is filled from the workbook at open time — there is no hardcoded class
   list left to go stale when the term turns over. `kinds` are the non-class options a picker leads
   with (Event and Task, where it is a task's category); `withCustom` offers the Custom bucket where
   one belongs. A record still tagged with a class from a past term keeps that tag as an option of
   its own, named for what it now reads as, so opening the editor cannot silently re-file it — and
   choosing anything else is how the user clears it, deliberately. */
// withClasses (default true) is what keeps the two directions honest: a task may be re-filed as an
// event and back, but never into a syllabus entry, so the task editor asks for the workbook classes
// to be left out. A task already tagged with a class still gets that one option, or the select would
// silently fall back to its first entry and a save would convert the record to something it isn't.
function fillCatSelect(sel,cur,kinds,withCustom,withClasses){
  if(!sel)return;
  kinds=kinds||[];
  const classes=(withClasses===false)?(sylClassOf(cur)?[sylClassOf(cur)]:[]):sylClasses();
  const opts=kinds.map(k=>`<option value="${k}">${escHtml(catName(k))}</option>`)
    .concat(classes.map(c=>`<option value="${c.cat}">${escHtml(c.name)}</option>`));
  const stale=cur&&cur!=='custom'&&!kinds.includes(cur)&&!sylClassOf(cur);
  if(stale)opts.push(`<option value="${escAttr(cur)}">Custom (from a past term)</option>`);
  if(withCustom)opts.push('<option value="custom">Custom</option>');
  sel.innerHTML=opts.join('');
  if(cur!=null)sel.value=cur;

function extractLocation(text,lines){

const atLocRe=/((?:^|[,;.]\s*|\s+)(?:at|in))\s+((?:the\s+)?[A-Za-z0-9][A-Za-z0-9 .,''&\-#()/]*?)(?:\s*[.;!?]?\s*$)/i;

const onlineRe=/\b(Online|Virtual|Zoom|Teams|Webex|Google\s*Meet)\b(?!\s+(?:call|meeting|session|chat|with))/i;
const om=remaining.match(onlineRe);

if(lines.length>1){const last=lines[lines.length-1];if(last.length<80&&last.length>1){const isLabel=/^(?:date|time|speaker|preparation|note|when|where)/i.test(last);const hasDate=extractDate(last).date;const hasTime=extractTime(last).startTime;const isAtLine=/^@\s/.test(last);if(!isLabel&&!hasDate&&!hasTime&&!isAtLine){location=last.replace(/[.,;\s]+$/,'').trim();const idx=remaining.lastIndexOf(last);if(idx>=0)remaining=(remaining.substring(0,idx)+remaining.substring(idx+last.length)).replace(/\s{2,}/g,' ').trim();return{location,remaining}}}}
const atLine2=/(?:^|\s)@\s+([A-Za-z0-9][A-Za-z0-9 .,''&\-#()/]*?)(?:\s*$)/i;
const atl2=remaining.match(atLine2);
